name: Nexus Mods

# Mirrors a GitHub release's archive to the Nexus Mods page, byte for byte. That is either the
# hand-attached proctoolvNNN.7z or, with ATTACH_CI_BUILD on, release.yml's folder-layout zip.
# With ATTACH_CI_BUILD on, the release event is skipped (the zip is not attached yet when the
# release is published); dispatch this once release.yml has finished.
#
# Setup, once (Settings -> Secrets and variables -> Actions):
#   secret   NEXUSMODS_API_KEY     personal key from https://www.nexusmods.com/settings/api-keys
#   variable NEXUS_MOD_ID          the number in the mod page URL (.../mods/402)
#   variable NEXUS_FILE_ID         the number of any version of the main file, as the Files tab
#                                  shows it (file_id=2589 in its download link)
#   variable NEXUS_GAME            optional; game domain in the URL (default crusaderkings3)
#   variable NEXUS_ASSET_PATTERN   optional; which release asset to send (default proctool*, or
#                                  Ck3MapGen-*-win-x64.zip with ATTACH_CI_BUILD on)
#   secret   VIRUSTOTAL_API_KEY    optional; free key from virustotal.com. Without it the
#                                  pre-upload VirusTotal check only warns.
#   variable VT_MAX_FLAGGED        optional; most engines allowed to flag a file (default 2)
# Until NEXUS_FILE_ID is set the job is skipped, not failed.
#
# The site shows game-scoped numbers, but the v3 upload endpoints want the internal ids, so the
# first step looks those up. Any version of the file resolves to the same file, so the variable
# never needs bumping.
#
# The Upload API only adds versions to a file that already exists on Nexus, so the mod page
# and its first file are created by hand on the site.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to send to Nexus again (e.g. v0.94)'
        required: true
      archive_existing:
        description: 'Archive the version currently on Nexus (off keeps both listed)'
        type: boolean
        default: true
      skip_virustotal:
        description: 'Upload even if VirusTotal flags it (after checking it is a false positive)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    if: vars.NEXUS_FILE_ID != '' && !(github.event_name == 'release' && vars.ATTACH_CI_BUILD == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Resolve Nexus ids
        id: nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          GAME: ${{ vars.NEXUS_GAME || 'crusaderkings3' }}
        run: |
          api() { curl -sSf -H "apikey: $NEXUS_KEY" "https://api.nexusmods.com/v3/games/$GAME/$1"; }
          file_id=$(api "mod-file-versions/${{ vars.NEXUS_FILE_ID }}" | jq -er .data.file.id)
          mod_id=$(api "mods/${{ vars.NEXUS_MOD_ID }}" | jq -er .data.id)
          echo "Nexus file ${{ vars.NEXUS_FILE_ID }} -> $file_id, mod ${{ vars.NEXUS_MOD_ID }} -> $mod_id"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,body > release.json
          # Nexus rejects anything outside these patterns: version ^[a-zA-Z0-9.-]+$, name
          # ^[a-zA-Z0-9 _'().-]+$ at most 50 chars ("&" in a release title is enough to fail).
          version=$(printf '%s' "${TAG#v}" | tr -cd 'a-zA-Z0-9.-')
          name=$(jq -r .name release.json | tr -cd "a-zA-Z0-9 _'().-" | tr -s ' ' | cut -c1-50 | sed 's/ *$//')
          [ -n "$name" ] || name="v$version"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "body<<NEXUS_EOF"
            # release.yml appends VirusTotal links under this marker; they stay on GitHub.
            jq -r .body release.json | awk '/^<!-- virustotal -->/ { exit } { print }' | head -c 65000
            echo
            echo "NEXUS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download release archive
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: ${{ vars.NEXUS_ASSET_PATTERN || (vars.ATTACH_CI_BUILD == 'true' && 'Ck3MapGen-*-win-x64.zip' || 'proctool*') }}
        run: |
          mkdir dl
          gh release download "${{ steps.rel.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p "$PATTERN" -D dl
          count=$(ls dl | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one asset matching '$PATTERN', found $count:"
            ls dl
            exit 1
          fi
          echo "file=dl/$(ls dl)" >> "$GITHUB_OUTPUT"

      # Stops a build that several engines flag from reaching Nexus. Checks the archive and the
      # binaries inside it (release.yml has usually scanned them already, so these are lookups).
      # One or two generic hits are normal for a new unsigned exe; the limit is the repo variable
      # VT_MAX_FLAGGED (default 2). If VirusTotal can't finish, it warns and lets the upload go.
      - name: Check with VirusTotal
        if: ${{ !inputs.skip_virustotal }}
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          LIMIT: ${{ vars.VT_MAX_FLAGGED || '2' }}
        run: |
          mkdir x
          7z x -y -ox "${{ steps.asset.outputs.file }}" > /dev/null
          mapfile -t bins < <(find x -type f \( -iname '*.exe' ! -iname createdump.exe -o -iname Ck3MapGen.dll \))
          VT_TIMEOUT=600 bash .github/scripts/virustotal.sh "${{ steps.asset.outputs.file }}" "${bins[@]}"
          cat virustotal.md >> "$GITHUB_STEP_SUMMARY"
          flagged=$(grep '^flagged=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$flagged" -gt "$LIMIT" ]; then
            echo "::error::$flagged engines flag one of these files (limit $LIMIT). Not uploading to Nexus. Look at the links in the summary; if it's a false positive, rerun with skip_virustotal."
            exit 1
          fi

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          filename: ${{ steps.asset.outputs.file }}
          version: ${{ steps.rel.outputs.version }}
          display_name: ${{ steps.rel.outputs.name }}
          changelog: ${{ steps.rel.outputs.body }}
          # The release event has no inputs, so it always archives.
          archive_existing_version: ${{ github.event_name == 'release' && 'true' || (inputs.archive_existing && 'true' || 'false') }}
          update_mod_version: 'true'
