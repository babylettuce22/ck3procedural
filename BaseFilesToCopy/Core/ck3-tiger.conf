# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# Check English localization
	check = "english"

	skip = "german"
	skip = "french"
	skip = "spanish"
	skip = "russian"
	skip = "simp_chinese"
	skip = "korean"
}

filter = {
    show_vanilla = no
    show_loaded_mods = no

    trigger = {
        severity >= Warning
        confidence >= Reasonable

        # Ignore missing loc in definition and vanilla titular titles
        ignore_keys_in_files = {
            keys = { missing-localization }
            files = {
                "map_data/definition.csv"
                "common/landed_titles/zz_vanilla_titulars.txt"
                "common/landed_titles/00_landed_titles.txt"
            }
        }

        # Ignore warnings in vanilla CB folder
        NAND = {
            severity < Fatal
            file = "common/casus_belli_types/"
        }

        # Vanilla's own findings in the two council-task files we copy.
        #
        # CouncilTaskWriter overrides `task_fabricate_claim` and `task_convince_dejure` — the only
        # two vanilla council tasks that can aim at a county outside the councillor's own realm, and
        # so the only two that can reach the wilderness dummy. Overriding either means copying the
        # whole file, which brings vanilla's script into the mod and out from behind
        # `show_vanilla = no`.
        #
        # Everything named here is vanilla's, byte for byte, and is reported against the game folder
        # too: two hardcoded county keys that a generated map does not have, and eight
        # `strict-scopes` warnings on vanilla's own council script values.
        #
        # Listed by text and key rather than by silencing the files, because the inserts are ten
        # lines each and every other key stays live in them — `missing-item` included, so a mistyped
        # `wilderness` trait in either guard is still reported.
        NAND = {
            file = "common/council_tasks/"
            OR = {
                text = "title c_byzantion not defined"
                text = "title c_maragha not defined"
                key = strict-scopes
            }
        }

        # Same policy, same reasoning, for the two other places a vanilla file is copied so the
        # wilderness dummy can be guarded in it: CasusBelliWriter's casus belli groups and
        # FactionWriter's county-joined faction types.
        #
        # Every key listed is one vanilla's own script produces and ours cannot: `scopes` and
        # `strict-scopes` findings against vanilla's `joined_faction` / `every_faction_member` /
        # `can_use_struggle_cbs_trigger` lines, and a vanilla loc key vanilla itself does not ship.
        # The guards we insert reference a trait and a government flag, so `missing-item` is
        # deliberately NOT silenced anywhere here — a typo in either name still fails the run.
        NAND = {
            file = "common/casus_belli_groups/"
            key = strict-scopes
        }

        # 09_mpo_interactions.txt is copied for the migration_interaction guard, and vanilla points
        # two of its lines at specific Mongol-invasion characters that a generated map has no reason
        # to contain. Named by text rather than by key, so `missing-item` stays live in this file for
        # the trait and flag our own guard references.
        NAND = {
            file = "common/character_interactions/09_mpo_interactions.txt"
            OR = {
                text = "character mpo_mongol_1 not defined"
                text = "character 125501 not defined"
            }
        }

        NAND = {
            file = "common/factions/"
            OR = {
                key = scopes
                key = strict-scopes
                key = missing-localization
            }
        }

        # rivers.png is audited by the generator itself (see MapGen/RiverMap.cs), with the same
        # segment model tiger uses; tiger's own segment builder (through v1.19) drops the endpoint
        # of a single-pixel segment when it extends it, splits chains at corner-shaped turns and
        # reports the pieces as "orphan river segment" by the thousand, on vanilla as on ours.
        # Whole-object overrides copied from vanilla drag vanilla's own findings out from behind
        # show_vanilla = no. The re-declared event is a duplicate by design; the point-of-interest
        # on_visit blocks are vanilla's text. missing-item is deliberately never silenced.
        NAND = {
            file = "events/religion_events/zz_gen_great_holy_war_events.txt"
            OR = {
                key = duplicate-item
                key = scopes
            }
        }
        NAND = {
            file = "common/travel/point_of_interest_types/"
            key = strict-scopes
        }

        # The court scene is a whole-file override of vanilla's own (Emit/HegemonyFlavourWriter.cs
        # rewrites one token in it so the hegemony stops summoning a Chinese throne room). It
        # therefore carries vanilla's references to Earth titles this map does not have. The copy
        # REPLACES vanilla's file rather than adding to it, so the engine resolves exactly what it
        # resolved before and the finding exists only because the copy is tagged [MOD] -- the same
        # shape as the `size { 5 0 }` structure error on our patched gui files. Named by text, not
        # by key, so missing-item stays live in this file for everything else.
        NAND = {
            file = "gfx/court_scene/scene_cultures/00_default_cultures.txt"
            text = "title c_byzantion not defined"
        }

        # Same writer, same reason, different shape: copying 00_illustration_triggers.txt into the
        # mod drags 22 `scopes` warnings out from behind show_vanilla = no. Every one is vanilla
        # calling its own graphical-culture-group triggers from a character scope in
        # 01_event_backgrounds.txt -- the finding's first `-->` is the [CK3] caller and ours is the
        # second. All 22 land on lines 18-73 and 666, none of them near the two governor triggers
        # this mod rewrites at 794-825. missing-item stays live.
        NAND = {
            file = "common/scripted_triggers/00_illustration_triggers.txt"
            key = scopes
        }
        NOT = { key = rivers }
    }
}