# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# Check English localization
	check = "english"

	skip = "german"
	skip = "french"
	skip = "spanish"
	skip = "russian"
	skip = "simp_chinese"
	skip = "korean"
}

filter = {
    show_vanilla = no
    show_loaded_mods = no

    trigger = {
        severity >= Warning
        confidence >= Reasonable

        # Ignore missing loc in definition and vanilla titular titles
        ignore_keys_in_files = {
            keys = { missing-localization }
            files = {
                "map_data/definition.csv"
                "common/landed_titles/zz_vanilla_titulars.txt"
                "common/landed_titles/00_landed_titles.txt"
            }
        }

        # Ignore warnings in vanilla CB folder
        NAND = {
            severity < Fatal
            file = "common/casus_belli_types/"
        }

        # Vanilla's own findings in the two council-task files we copy.
        #
        # CouncilTaskWriter overrides `task_fabricate_claim` and `task_convince_dejure` — the only
        # two vanilla council tasks that can aim at a county outside the councillor's own realm, and
        # so the only two that can reach the wilderness dummy. Overriding either means copying the
        # whole file, which brings vanilla's script into the mod and out from behind
        # `show_vanilla = no`.
        #
        # Everything named here is vanilla's, byte for byte, and is reported against the game folder
        # too: two hardcoded county keys that a generated map does not have, and eight
        # `strict-scopes` warnings on vanilla's own council script values.
        #
        # Listed by text and key rather than by silencing the files, because the inserts are ten
        # lines each and every other key stays live in them — `missing-item` included, so a mistyped
        # `wilderness` trait in either guard is still reported.
        NAND = {
            file = "common/council_tasks/"
            OR = {
                text = "title c_byzantion not defined"
                text = "title c_maragha not defined"
                key = strict-scopes
            }
        }

        # rivers.png is audited by the generator itself (see MapGen/RiverMap.cs), with the same
        # segment model tiger uses; tiger's own segment builder (through v1.19) drops the endpoint
        # of a single-pixel segment when it extends it, splits chains at corner-shaped turns and
        # reports the pieces as "orphan river segment" by the thousand, on vanilla as on ours.
        NOT = { key = rivers }
    }
}