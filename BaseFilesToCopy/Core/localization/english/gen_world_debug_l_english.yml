l_english:
 gen_world_debug_cancel:0 "Cancel"
 gen_world_debug_cancel_tt:0 "Leave the world unchanged."
 gen_world_debug_unrest_modifier:0 "Debug Popular Discontent"
 gen_world_debug_events.0001.t:0 "Realm Collapse"
 gen_world_debug_events.0001.desc:0 "Dissolve ordinary held titles above a selected tier. De jure structure and special titular titles remain. Personal counties are not redistributed."
 gen_world_debug_events.0001.o1:0 "Kingdom ceiling"
 gen_world_debug_events.0001.o1.tt:0 "Destroy ordinary empires worldwide."
 gen_world_debug_events.0001.o2:0 "Duchy ceiling"
 gen_world_debug_events.0001.o2.tt:0 "Destroy ordinary empires and kingdoms worldwide."
 gen_world_debug_events.0001.o3:0 "County ceiling"
 gen_world_debug_events.0001.o3.tt:0 "Destroy ordinary empires, kingdoms, and duchies worldwide."
 gen_world_debug_events.0001.o4:0 "Independent counties"
 gen_world_debug_events.0001.o4.tt:0 "Apply the county ceiling and release ordinary count-tier vassals. Rulers retain all personally held counties."
 gen_world_debug_events.0002.t:0 "Neighbor Wars"
 gen_world_debug_events.0002.desc:0 "Force eligible independent AI rulers to declare debug wars on legal neighboring targets. Debug mode is required. Victory transfers the targeted primary title and its vassals. Some rulers can receive several wars; rulers without a legal target are skipped."
 gen_world_debug_events.0002.o1:0 "One random AI ruler attacks"
 gen_world_debug_events.0002.o1.tt:0 "Choose one AI ruler with a legal neighboring target and declare one war."
 gen_world_debug_events.0002.o2:0 "Every eligible AI ruler attacks"
 gen_world_debug_events.0002.o2.tt:0 "Attempt one declaration per independent AI ruler, rechecking eligibility as wars begin."
 gen_world_debug_events.0002.o3:0 "Only peaceful AI rulers attack"
 gen_world_debug_events.0002.o3.tt:0 "Attempt one declaration per AI ruler still at peace when visited."
 gen_world_debug_events.0002.o4:0 "Attack weaker neighbors"
 gen_world_debug_events.0002.o4.tt:0 "Attempt one declaration against a legal neighbor with lower current military strength."
 gen_world_debug_events.0003.t:0 "Global White Peace"
 gen_world_debug_events.0003.desc:0 "End every active war, including wars involving the player and landless characters."
 gen_world_debug_events.0003.o1:0 "End all wars"
 gen_world_debug_events.0003.o1.tt:0 "End all active wars with white peace. War-end effects and truces still apply."
 gen_world_debug_events.0004.t:0 "Release All Vassals"
 gen_world_debug_events.0004.desc:0 "Make ordinary landed rulers independent while preserving their personal holdings, baron-tier vassals, and titles."
 gen_world_debug_events.0004.o1:0 "Release all ordinary vassals"
 gen_world_debug_events.0004.o1.tt:0 "Release every eligible count-tier or higher vassal, including the player."
 gen_world_debug_events.0005.t:0 "De Jure Consolidation"
 gen_world_debug_events.0005.desc:0 "Restore de jure titles to their capital county holders and attach lower-ranked county holders. Existing personal domains remain, so cross-border holdings and equal-ranked rulers can prevent exact de jure borders. Wilderness counties are skipped."
 gen_world_debug_events.0005.o1:0 "Consolidate duchies"
 gen_world_debug_events.0005.o1.tt:0 "Grant de jure duchies to their capital holders and vassalize lower-ranked county holders."
 gen_world_debug_events.0005.o2:0 "Consolidate kingdoms"
 gen_world_debug_events.0005.o2.tt:0 "Grant de jure kingdoms to their capital holders and vassalize lower-ranked county holders."
 gen_world_debug_events.0006.t:0 "World Resources"
 gen_world_debug_events.0006.desc:0 "Give ordinary landed rulers money or refill levies and garrisons in their counties. Men-at-arms and special troops are unaffected."
 gen_world_debug_events.0006.o1:0 "Give every ruler 5,000 gold"
 gen_world_debug_events.0006.o1.tt:0 "Add 5,000 gold to every eligible ruler, including the player."
 gen_world_debug_events.0006.o2:0 "Refill levies and garrisons"
 gen_world_debug_events.0006.o2.tt:0 "Refill county holding levies and garrisons worldwide."
 gen_world_debug_events.0006.o3:0 "Gold and reinforcements"
 gen_world_debug_events.0006.o3.tt:0 "Apply both resource actions."
 gen_world_debug_events.0007.t:0 "World Conversion"
 gen_world_debug_events.0007.desc:0 "Use the character receiving this event as the source of faith and culture. Changes affect ordinary rulers and inhabited counties, including the player; courtiers and wilderness are excluded."
 gen_world_debug_events.0007.o1:0 "Adopt my faith"
 gen_world_debug_events.0007.o1.tt:0 "Convert eligible rulers and counties to your faith."
 gen_world_debug_events.0007.o2:0 "Adopt my culture"
 gen_world_debug_events.0007.o2.tt:0 "Convert eligible rulers and counties to your culture."
 gen_world_debug_events.0007.o3:0 "Adopt both"
 gen_world_debug_events.0007.o3.tt:0 "Convert eligible rulers and counties to both your faith and culture."
 gen_world_debug_events.0008.t:0 "World Unrest"
 gen_world_debug_events.0008.desc:0 "Change control and popular opinion in inhabited counties worldwide. The unrest modifier lasts five years; clearing it removes only this debug modifier."
 gen_world_debug_events.0008.o1:0 "Set control to zero"
 gen_world_debug_events.0008.o1.tt:0 "Reduce county control to zero worldwide."
 gen_world_debug_events.0008.o2:0 "Restore full control"
 gen_world_debug_events.0008.o2.tt:0 "Raise county control to its maximum worldwide."
 gen_world_debug_events.0008.o3:0 "Create popular discontent"
 gen_world_debug_events.0008.o3.tt:0 "Apply -50 popular opinion in inhabited counties for five years."
 gen_world_debug_events.0008.o4:0 "Clear debug discontent"
 gen_world_debug_events.0008.o4.tt:0 "Remove the debug unrest modifier worldwide."
 gen_world_debug_events.0009.t:0 "Succession Wave"
 gen_world_debug_events.0009.desc:0 "Kill selected AI rulers through natural deaths to test inheritance. The player and wilderness owner are excluded. Successors are not killed again by this action."
 gen_world_debug_events.0009.o1:0 "One random independent ruler"
 gen_world_debug_events.0009.o1.tt:0 "Kill one eligible independent AI ruler."
 gen_world_debug_events.0009.o2:0 "All independent AI rulers"
 gen_world_debug_events.0009.o2.tt:0 "Kill the independent AI rulers present when the option is selected."
 gen_world_debug_events.0009.o3:0 "All ordinary AI rulers"
 gen_world_debug_events.0009.o3.tt:0 "Kill all eligible AI rulers present when the option is selected, including vassals."
 gen_world_debug_events.0010.t:0 "World Epidemics"
 gen_world_debug_events.0010.desc:0 "Start smallpox in a random inhabited county or reduce existing outbreaks. The engine exposes no script effect to delete epidemics; reducing severity does not clear infections."
 gen_world_debug_events.0010.o1:0 "Start a minor outbreak"
 gen_world_debug_events.0010.o1.tt:0 "Start minor smallpox in one random inhabited county."
 gen_world_debug_events.0010.o2:0 "Start a major outbreak"
 gen_world_debug_events.0010.o2.tt:0 "Start major smallpox in one random inhabited county."
 gen_world_debug_events.0010.o3:0 "Start an apocalyptic outbreak"
 gen_world_debug_events.0010.o3.tt:0 "Start apocalyptic smallpox in one random inhabited county."
 gen_world_debug_events.0010.o4:0 "Reduce all outbreaks to minor"
 gen_world_debug_events.0010.o4.tt:0 "Set all existing epidemic outbreak intensities to minor. Infections remain."
