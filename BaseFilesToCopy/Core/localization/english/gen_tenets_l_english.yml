l_english:
 gen_tenet_peace_of_god_name:0 "Peace of God"
 gen_tenet_peace_of_god_desc:0 "Senseless violence against our brothers and sisters is an affront to the divine. Let sacred truces shelter the innocent, and let those who bear arms remember that restraint is also a duty of the faithful."
 gen_tenet_dulia_name:0 "Veneration of Saints"
 gen_tenet_dulia_desc:0 "Let all who seek the intercession of the saints approach them with reverence and devotion. Those whose lives bore witness to the sacred remain a light to the faithful, and their relics a dwelling place of grace."
 gen_tenet_transubstantiation_name:0 "Transubstantiation"
 gen_tenet_transubstantiation_desc:0 "Before consecration, the sacred offering is earthly substance; afterward, it is the very presence of the divine. Though its outward appearance remains, its inner nature is transformed, and the faithful receive what mortal senses cannot discern."
 gen_tenet_ora_et_labora_name:0 "To Work Is to Pray"
 gen_tenet_ora_et_labora_desc:0 "To pray is to work and to work is to pray. Idleness is the enemy of the soul; let the faithful be diligent in thought and action, sanctifying each day's labor through devotion."
 gen_tenet_hyperdulia_name:0 "Divine Mother"
 gen_tenet_hyperdulia_desc:0 "Blessed is the mother who brought the divine into the world, a vessel of mercy and a shelter for the sorrowful. Let the faithful honor her above all other holy exemplars, seeking her intercession with reverence and love."
 gen_tenet_simony_name:0 "Simony"
 gen_tenet_simony_desc:0 "The divine placed gold beneath the earth as a favor to the faithful. Sacred offices and holy services may rightly be bestowed upon those whose offerings sustain the clergy, for worldly wealth can serve a higher purpose."
 gen_tenet_monophysitism_name:0 "Monophysitism"
 gen_tenet_monophysitism_desc:0 "The divine incarnation has only one nature, wholly sacred. Its mortal appearance is the veil through which eternal truth is revealed, and no earthly substance can diminish its divinity."
 gen_tenet_acts_of_apostles_name:0 "Fervent Proselytism"
 gen_tenet_acts_of_apostles_desc:0 "Bring heavenly light to those in darkness, and hope to those in despair. Let the faithful carry the true teaching beyond familiar lands, enduring hardship so that every people may hear the call of the sacred."
 gen_tenet_purgatory_name:0 "Purgatory"
 gen_tenet_purgatory_desc:0 "Those who depart this life burdened by lesser sins must undergo a final cleansing before entering the joy of the blessed. Let the prayers and good works of the living comfort these souls as their remaining impurities are consumed."
 gen_tenet_be_fruitful_and_multiply_name:0 "Be Fruitful and Multiply"
 gen_tenet_be_fruitful_and_multiply_desc:0 "The family is a sacred community of life and love. Let the faithful bring forth children and nurture them in devotion, that the blessings entrusted to this generation may flourish in those yet to come."
 gen_tenet_apostolic_succession_name:0 "Sacred Succession"
 gen_tenet_apostolic_succession_desc:0 "An unbroken line of ordination joins the living clergy to the first teachers of the faith. Through this sacred inheritance, their authority endures and the true teaching passes faithfully from one generation to the next."
 gen_tenet_confession_name:0 "Sacrament of Confession"
 gen_tenet_confession_desc:0 "Through confession, sinners may receive absolution and be reconciled with the divine and the fellowship of the faithful. Let no shame conceal a wounded soul from those entrusted with its healing."
 gen_tenet_original_sin_name:0 "Original Sin"
 gen_tenet_original_sin_desc:0 "All mortals inherit the stain of the first transgression, a wound passed down from the earliest ancestors. Neither worldly wisdom nor good works alone can heal it; the soul must seek redemption through divine grace."
 gen_tenet_celestial_hierarchy_name:0 "Celestial Hierarchy"
 gen_tenet_celestial_hierarchy_desc:0 "The heavenly host is ordered in sacred ranks, each appointed to its own ministry. From the highest spirits to the humblest messengers, all serve the divine order and guide mortal souls toward the light."
 gen_tenet_miles_christi_name:0 "Sacred Soldiery"
 gen_tenet_miles_christi_desc:0 "The faithful are called to be spiritual warriors, clothed in devotion and steadfast against corruption and evil. Let them endure hardship as soldiers endure their trials, holding fast to the sacred cause entrusted to them."
 gen_tenet_philanthropia_name:0 "Charity"
 gen_tenet_philanthropia_desc:0 "Let the hungry be fed, the sick tended, and the stranger given shelter. Generous alms and houses of mercy are sacred duties, for devotion finds its fullest expression in the care of those who suffer."
 gen_tenet_scholasticism_name:0 "Scholasticism"
 gen_tenet_scholasticism_desc:0 "Through rigorous inquiry and disciplined argument, faith and reason may be reconciled. Let the learned examine every question with humility, seeking beneath apparent contradiction a deeper understanding of divine truth."
 gen_tenet_adoptionism_name:0 "Adoptionism"
 gen_tenet_adoptionism_desc:0 "The sacred exemplar was born mortal and raised to divine dignity through righteousness and grace. Let the faithful contemplate this exaltation, that they too may follow the path from earthly frailty toward communion with the eternal."
 gen_tenet_love_thy_neighbour_name:0 "Love Thy Neighbour"
 gen_tenet_love_thy_neighbour_desc:0 "Love of one's neighbor is inseparable from devotion to the divine. Through charity and mercy, the faithful fulfill the sacred law, offering kindness even where kinship, custom, and worldly allegiance divide them."
 gen_tenet_divine_liturgy_name:0 "Divine Liturgy"
 gen_tenet_divine_liturgy_desc:0 "In the sacred liturgy, heaven and earth meet. Through prayer, incense, and solemn chant, the faithful join the eternal worship of the heavenly host, and the passing hour is opened to the timeless presence of the divine."
 gen_tenet_miaphysitism_name:0 "Miaphysitism"
 gen_tenet_miaphysitism_desc:0 "In the sacred incarnation, mortal and divine are united in one indivisible nature. Neither is diminished or lost; both endure together, inseparably joined in the mystery through which the eternal enters the world."
 gen_tenet_hesychasm_name:0 "Hesychasm"
 gen_tenet_hesychasm_desc:0 "Through inner stillness and the ceaseless repetition of sacred prayer, the faithful quiet the passions and turn the heart toward the divine. In this silence, the devoted may behold the uncreated light and enter a communion beyond words."
 gen_tenet_anachoresis_name:0 "Anachoresis"
 gen_tenet_anachoresis_desc:0 "Let those who seek spiritual purity withdraw from worldly society into the wilderness. Through solitude, prayer, and ascetic discipline, the faithful conquer the passions and draw nearer to the sacred presence."
 gen_tenet_mortification_of_the_flesh_name:0 "Mortification of the Flesh"
 gen_tenet_mortification_of_the_flesh_desc:0 "The faithful mortify the flesh and its unruly desires, accepting hardship to purify the soul. Through fasting, discipline, and holy suffering, the body's demands are subdued and the spirit made ready for the divine."
 gen_tenet_holy_myron_name:0 "Holy Myron"
 gen_tenet_holy_myron_desc:0 "Holy Myron is a fragrant oil consecrated for the anointing of the faithful. Through this sacred seal, the newly initiated receive a blessing of the divine spirit and take their place within the fellowship of the faith."
 gen_tenet_khachkar_name:0 "Sacred Stelae"
 gen_tenet_khachkar_desc:0 "Stone monuments carved with sacred symbols stand as enduring witnesses to the faith. Let them mark holy places, honor the departed, and preserve the memory of blessings for generations yet unborn."
 gen_tenet_alexandrian_catechism_name:0 "Mystical Catechism"
 gen_tenet_alexandrian_catechism_desc:0 "Sacred teachings conceal depths that the written word alone cannot reveal. Through learned instruction and allegorical understanding, the faithful look beyond the outward meaning toward the hidden wisdom of the divine."
 gen_tenet_aniconism_name:0 "Aniconism"
 gen_tenet_aniconism_desc:0 "No mortal image can contain the sacred. Let the faithful turn away from likenesses that bind the divine to earthly form, and seek devotion through the spoken word, the sacred sign, and the unadorned sanctuary."
 gen_tenet_armed_pilgrimages_name:0 "Armed Pilgrimages"
 gen_tenet_armed_pilgrimages_desc:0 "Let the faithful take up arms in defense of their sacred places. The holy journey is an act of devotion, and those who guard its roads and sanctuaries with the sword fulfill a solemn duty to the faith."
 gen_tenet_communal_identity_name:0 "Communal Identity"
 gen_tenet_communal_identity_desc:0 "The faithful are one people, bound together by sacred teaching and shared observance. Let each member uphold the fellowship, that through unity of purpose the community may endure every worldly trial."
 gen_tenet_consolamentum_name:0 "Consolamentum"
 gen_tenet_consolamentum_desc:0 "A solemn rite of consolation cleanses the soul and prepares it to depart this world. Those who receive this final blessing set aside earthly attachments, seeking peace in the promise of spiritual release."
 gen_tenet_divine_marriage_name:0 "Divine Marriage"
 gen_tenet_divine_marriage_desc:0 "As the divine powers are joined in sacred union, so may close kin of a holy bloodline be joined in marriage. Through these bonds, the faithful preserve the purity of their inheritance and honor the pattern set before them."
 gen_tenet_gnosticism_name:0 "Gnosticism"
 gen_tenet_gnosticism_desc:0 "The visible world conceals a deeper truth, and the soul bears a spark of the sacred within it. Through hidden knowledge and spiritual awakening, the faithful may escape the bonds of ignorance and return to their divine source."
 gen_tenet_mendicant_preachers_name:0 "Mendicant Preachers"
 gen_tenet_mendicant_preachers_desc:0 "Let those who preach the sacred teaching travel without riches, trusting in the hospitality of the faithful. Their poverty bears witness to their devotion, and their words carry hope from the humblest dwelling to the halls of rulers."
 gen_tenet_pentarchy_name:0 "Pentarchy"
 gen_tenet_pentarchy_desc:0 "The great sacred seats are pillars of the faith, each entrusted with the care of its region. Let their spiritual authorities deliberate in concord, preserving unity through counsel and the common observance of holy tradition."
 gen_tenet_unrelenting_faith_name:0 "Unrelenting Faith"
 gen_tenet_unrelenting_faith_desc:0 "True devotion does not falter before hardship, doubt, or the hostility of the world. Let the faithful stand firm in their sacred convictions, drawing strength from the certainty that endurance itself is an offering to the divine."
