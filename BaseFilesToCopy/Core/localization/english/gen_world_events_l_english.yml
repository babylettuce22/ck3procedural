l_english:
 gen_world_events.0001.t: "A Season of Swords"
 gen_world_events.0001.desc: "A cloth merchant lays his battered itinerary before me. Beside one town he has written 'under siege'; beside another, 'bridge burned'. Further down, simply: 'do not travel'.\n\nHis account agrees with the dispatches reaching my court: one independent realm in every four is now at war, more than anyone at court can remember. Even rulers far from the fighting are sending soldiers to their allies.\n\n'I used to sell fine cloth for weddings,' he says. 'These days, everyone asks whether it can be cut into bandages.'"
 gen_world_events.0001.a: "Buy the bandages. We may need them."
 gen_world_events.0001.a_war: "Send the bandages to our armies."
 gen_world_events.0001.b: "Offer him safe lodging and provisions."
 gen_world_events.0001.c: "We still have need of cloth."
 gen_world_events.0001.c.tt: "You continue with ordinary business, without spending additional gold."
 gen_world_medical_supplies_modifier: "Medical Supplies in Reserve"
 gen_world_medical_supplies_modifier_desc: "A stock of bandages and clean cloth helps wounded levies return to service."
 gen_world_events.0002.t: "The Quiet Years"
 gen_world_events.0002.desc: "My steward brings the toll accounts, and for once he is smiling. More carts on the roads than last year, and more than the year before. Not one bridge reported burned.\n\nThe envoys tell the same story: for two years running, hardly one independent realm in seven has taken up arms. Old soldiers grumble in the taverns that there is no work, and the farmers have stopped burying their seed grain.\n\nPeace like this does not last. The question is what to do with it while it does."
 gen_world_events.0002.a: "Mend the roads and markets while the carts are moving."
 gen_world_events.0002.b: "Peace is when others grow soft. Keep the levies drilling."
 gen_world_events.0002.c: "Let the court celebrate. We have earned it."
 gen_world_events.0002.d: "Peace needs no help from us."
 gen_world_events.0002.d.tt: "You continue as before, spending nothing and gaining nothing."
 gen_world_quiet_roads_modifier: "Roads Mended in Peacetime"
 gen_world_quiet_roads_modifier_desc: "Money spent on roads and markets during the quiet years is paying itself back in tolls and growing towns."
 gen_world_quiet_drill_modifier: "Drilling Through the Peace"
 gen_world_quiet_drill_modifier_desc: "The levies train while their neighbours' rust. The hands in the drill yard are hands not in the fields."
