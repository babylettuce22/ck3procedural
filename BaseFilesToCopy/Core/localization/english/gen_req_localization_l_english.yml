l_english:
 # The racial skin-shift gene. Named because a gene key without localisation shows up raw in the
 # ruler designer, which is where this one is legitimately useful to pick. The gene DECLARATION
 # stays in Core even though the fantasy content lives in the Fantasy set: Emit/PortraitWriter.cs
 # writes gen_race_skin into every persistent DNA record on every map, so the gene must always
 # be registered. (Trait localisation lives in Fantasy/localization/gen_fantasy_traits_l_english.yml.)
 gen_race_skin:0 "Racial Complexion"

 gen_early_realm_stability:0 "A Stable Realm"
 gen_early_realm_stability_desc:0 "This realm is in a period of internal alignment."

  MOD_GITHUB_BUTTON_TEXT: "Check Mod Updates"
 MOD_GITHUB_BUTTON_TOOLTIP: "View the latest releases, changelogs, and bugfixes on GitHub"

 # The realm-lore button on the title window, spliced in by Emit/GuiWriter.cs beside vanilla's
 # "Claimants" and "Title History". The panel has nothing to show yet; the placeholder says so
 # rather than opening empty, because an empty panel reads as a bug and this one is on purpose.
 GEN_TITLE_LORE:0 "Realm Lore"
 GEN_TITLE_LORE_TOOLTIP:0 "What is remembered of this realm."
 GEN_TITLE_LORE_PLACEHOLDER:0 "#italic Nothing is yet recorded of this place.#!\n\nThe chroniclers have not finished their work."

