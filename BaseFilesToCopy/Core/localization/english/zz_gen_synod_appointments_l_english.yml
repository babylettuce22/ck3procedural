l_english:
 gen_synod_vanilla_appoint_cardinal_interaction:0 "Appoint Cardinal"
 appoint_cardinal_interaction:0 "[recipient.Custom('GenSynodAppointName')]"
 appoint_cardinal_interaction_desc:0 "Appoint [recipient.GetShortUIName] as a [cardinal|E]"
 appoint_cardinal_interaction_notification:0 "Word of your faith and prudence has reached me, and such servants are precious to [puppet_or_actor.GetFaith.HighGodName]. Accept the red hat and a seat among my Cardinals: counsel me while I live, and when I am gone, help choose the one who follows."
 gen_synod_vanilla_request_court_chaplain_cardinalate_interaction:0 "Request Cardinalate for [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 request_court_chaplain_cardinalate_interaction:0 "[actor.Custom('GenSynodPetitionName')]"
 request_court_chaplain_cardinalate_interaction_desc:0 "Petition your [head_of_faith|E] to raise [actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName] into the [college_of_cardinals|E]. Only a [cardinal|E] may be elected as the next [head_of_faith|E], and a [cardinal|E] who owes you the hat is a [cardinal|E] worth keeping.\n\n#italic [actor.GetCouncillor( 'councillor_court_chaplain' ).GetSheHe|U] will hold a [cardinalate|E] of [actor.GetCouncillor( 'councillor_court_chaplain' ).GetHerHis] own, give up [actor.GetCouncillor( 'councillor_court_chaplain' ).GetHerHis] seat on your [council|E], and become your [external_clerical_puppet|E] if you keep no other.#!"
 request_court_chaplain_cardinalate_interaction_notification:0 "My chaplain, [actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName], has tended the souls of my realm with wisdom and tireless devotion. Raise [actor.GetCouncillor( 'councillor_court_chaplain' ).GetHerHim] into the College of Cardinals — the Faith will find no truer servant."
 gen_synod_appoint_name:0 "Appoint Synod Member"
 gen_synod_appoint_desc:0 "Invite [recipient.GetShortUIName] to join the Synod of [recipient.GetFaith.GetName] as a personal member."
 gen_synod_appoint_notification:0 "I invite you to join the Synod of [recipient.GetFaith.GetName]. Counsel our faith, and when my tenure ends, help choose the next [puppet_or_actor.GetFaith.ReligiousHeadTitleName]. Your membership is personal and lasts while you remain eligible."
 gen_synod_petition_name:0 "Request Chaplain's Synod Appointment"
 gen_synod_petition_desc:0 "Ask [recipient.GetShortUIName] to grant your chaplain personal membership in the Synod."
 gen_synod_petition_notification:0 "I ask you to grant my chaplain a personal seat in the Synod of [recipient.GetFaith.GetName]. May their service and counsel strengthen our faith."
 gen_synod_direct_cooldown_tt:0 "You can make a direct personal appointment once every two years"
 gen_synod_appointment_funds_tt:0 "You must be able to pay the appointment's financial cost"
 gen_synod_candidate_eligible_tt:0 "The candidate must be eligible same-faith clergy, free and capable, permitted by the head's clerical gender rules, and awaiting no permanent Synod seat"
 gen_synod_max_members_tt:0 "The Synod must have fewer than 70 members for another appointment"
 gen_synod_petition_piety_tt:0 "You must be able to pay the petition's piety cost"
 gen_synod_appointment_effect_tt:0 "[recipient.GetShortUIName] gains one personal Synod seat and +20 grateful opinion toward [puppet_or_actor.GetShortUIName]. Membership lasts while eligible and ends on death or succession."
 gen_synod_petition_effect_tt:0 "Your chaplain gains one personal Synod seat. Membership lasts while eligible and ends on death or succession. The usual chaplain promotion, gratitude, and clerical-agent rules apply."
 gen_synod_personal_capacity_preview_tt:0 "Personal appointments: $GEN_SYNOD_USED|0$ / $GEN_SYNOD_LIMIT|0$ → $GEN_SYNOD_AFTER|0$ / $GEN_SYNOD_LIMIT|0$. Appointments and chaplain petitions share an allowance of one personal member per three permanent seats, with a minimum of one."
 gen_synod_appointment_cost_tt:0 "Financial cost: $GEN_SYNOD_COST|0$. Paid by the appointing head only when the appointment succeeds."
 gen_synod_petition_cost_tt:0 "Piety cost: @piety_icon!$GEN_SYNOD_PIETY_COST|0$. Paid only when the appointment succeeds."
 gen_synod_unlanded_promotion_tt:0 "[recipient.GetShortUIName] becomes a landless ecclesiastical ruler"
 gen_synod_council_departure_tt:0 "[recipient.GetShortUIName] leaves their current council position on promotion"
 gen_synod_appointment_success_title:0 "Synod Member Appointed"
 gen_synod_appointment_success_tt:0 "[recipient.GetShortUIName] joins the Synod of [recipient.GetFaith.GetName], holding [gen_personal_seat.GetName]."
 gen_synod_petition_success_title:0 "Chaplain Appointed to Synod"
 gen_synod_petition_success_tt:0 "[new_cardinal.GetShortUIName] joins the Synod of [recipient.GetFaith.GetName], holding [gen_personal_seat.GetName]."
 gen_synod_appointment_cancelled_title:0 "Synod Appointment Cancelled"
 gen_synod_appointment_cancelled_tt:0 "The authority, candidate, available seats, or payment requirements changed before acceptance. No appointment cost was charged."
 gen_synod_petition_cancelled_tt:0 "Your chaplain, the religious authority, available seats, or payment requirements changed before acceptance. No piety or hook was spent."
 gen_synod_appointment_declined_title:0 "Synod Appointment Declined"
 gen_synod_appointment_declined_tt:0 "[recipient.GetShortUIName] declined the invitation. No appointment cost was charged."
 gen_synod_petition_declined_title:0 "Synod Petition Declined"
 gen_synod_petition_declined_tt:0 "[recipient.GetShortUIName] declined your petition. No piety or hook was spent."
