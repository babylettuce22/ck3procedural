 # ---- Shared ----

 wilderness_clearing_returns_beast_dens_tt:0 "#N $building_beast_dens$ return to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."
 wilderness_clearing_returns_bandit_camps_tt:0 "#N $building_bandit_camps$ return to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."
 wilderness_clearing_returns_dense_growth_tt:0 "#N $building_dense_growth$ returns to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."
 wilderness_clearing_returns_flooded_lands_tt:0 "#N $building_flooded_lands$ return to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."
 wilderness_clearing_returns_scree_slopes_tt:0 "#N $building_scree_slopes$ return to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."
 wilderness_clearing_returns_killing_cold_tt:0 "#N $building_killing_cold$ returns to [obstacle_county.GetNameNoTier]#!. The clearing will have to be done again."

 # ---- Beasts ----

 wilderness_clearing.0101.t:0 "The Pack Leader"
 wilderness_clearing.0101.desc:0 "The hunters have done good work in [obstacle_county.GetNameNoTier]. Den after den has been dug out and burned, and the shepherds are sleeping at night again.\n\nAll but one pack. Its leader is a grey she-wolf the size of a pony, and she has learned to stay out of bowshot. [foreman.GetFirstName] says the hunters won't go after her again. Not after what she did to the last three who tried."
 wilderness_clearing.0101.a:0 "I'll hunt her myself."
 wilderness_clearing.0101.a.success:0 "The She-Wolf Is Dead"
 wilderness_clearing.0101.a.failure:0 "The She-Wolf Escapes"
 wilderness_clearing.0101.a.pelt_tt:0 "Her pelt is cured and hung in your court"
 wilderness_clearing.0101.b:0 "[champion.GetFirstName], this is a job for you."
 wilderness_clearing.0101.b.success:0 "[champion.GetFirstName] Kills the She-Wolf"
 wilderness_clearing.0101.b.failure:0 "The She-Wolf Mauls [champion.GetFirstName]"
 wilderness_clearing.0101.c:0 "Hire trappers from outside. Let them deal with her."
 wilderness_clearing.0101.c.tt:0 "The trappers take her within the month, and the clearing holds"

 wilderness_clearing.0102.t:0 "Bounty on Pelts"
 wilderness_clearing.0102.desc:0 "The dens in [obstacle_county.GetNameNoTier] are cleared, and the settlers who did the work would like to be paid for it. [foreman.GetFirstName] brings their request: a bounty for every pelt brought in, as other lords pay.\n\n"The furs are good, and there are merchants who'll buy them," [foreman.GetSheHe] says. "Give the hunters a reason to keep at it, and nothing with teeth will ever come back.""
 wilderness_clearing.0102.a:0 "Pay the bounty."
 wilderness_clearing.0102.b:0 "They were clearing their own land. That's payment enough."
 wilderness_clearing.0102.c:0 "I'll keep the eastern woods as my own hunting ground."

 wilderness_clearing.0103.t:0 "Taken from the Fields"
 wilderness_clearing.0103.desc:0 "Word comes from [obstacle_county.GetNameNoTier]. A child was taken from the edge of the new fields at dusk, three days after the last den was burned.\n\n[foreman.GetFirstName] thinks it was a single animal, a stray the hunters missed. The settlers don't care whether it was one or a hundred. Several families are already talking about going home."
 wilderness_clearing.0103.a:0 "Hunt the beast down. Tonight."
 wilderness_clearing.0103.a.success:0 "The Beast Is Killed"
 wilderness_clearing.0103.a.failure:0 "The Hunt Finds Nothing"
 wilderness_clearing.0103.b:0 "Pay the family, and post watchmen on the fields."
 wilderness_clearing.0103.c:0 "Children wander. This is what new land costs."

 # ---- Bandits ----

 wilderness_clearing.0201.t:0 "The Bandit Chief"
 wilderness_clearing.0201.desc:0 "The last bandit camp in [obstacle_county.GetNameNoTier] has been burned, and the [bandit_chief.GetWomanMan] who led it was dragged out alive. [bandit_chief.GetFirstName] is brought before you in chains, filthy and not at all sorry.\n\n"You want this land worked?" [bandit_chief.GetSheHe] says. "I know every path and cave in these hills. Hang me and you'll never find the rest of my people. Let me serve you, and they'll be your people instead.""
 wilderness_clearing.0201.a:0 "Hang [bandit_chief.GetHerHim] where the settlers can see."
 wilderness_clearing.0201.b:0 "Swear to serve me, and you'll live."
 wilderness_clearing.0201.c:0 "Take your people and go. If I see you again, you hang."
 wilderness_clearing.0201.c.success:0 "The Bandits Keep Their Word"
 wilderness_clearing.0201.c.failure:0 "The Bandits Come Back"

 wilderness_clearing.0202.t:0 "Friends in the Village"
 wilderness_clearing.0202.desc:0 "Clearing the camps in [obstacle_county.GetNameNoTier] turned up more than stolen goods. The bandits ate well all winter, and [foreman.GetFirstName] has found out why. Some of your own settlers were selling them grain, and warning them whenever the hunters were on their way.\n\n[foreman.GetSheHe|U] has the names. What should be done with them?"
 wilderness_clearing.0202.a:0 "Flog them in front of the whole village."
 wilderness_clearing.0202.b:0 "Pardon them. They were frightened, not wicked."
 wilderness_clearing.0202.b.success:0 "The Pardon Is Kept"
 wilderness_clearing.0202.b.failure:0 "Old Friends Return"
 wilderness_clearing.0202.c:0 "Use them. Let them lead us to whoever's left."
 wilderness_clearing.0202.c.success:0 "The Last Camp Is Found"
 wilderness_clearing.0202.c.failure:0 "The Bandits Are Warned"

 wilderness_clearing.0203.t:0 "The Hoard"
 wilderness_clearing.0203.desc:0 "In the last of the bandit caves above [obstacle_county.GetNameNoTier], the hunters found where the takings went: sacks of coin, bolts of cloth, good iron tools, a bronze bell. Most of it was taken from your own settlers on the road in.\n\n[foreman.GetFirstName] has had it all carried down and piled in the yard. The settlers have seen it, and they're waiting to see what you'll do."
 wilderness_clearing.0203.a:0 "It goes to my treasury."
 wilderness_clearing.0203.b:0 "Give it back to the people it was taken from."
 wilderness_clearing.0203.c:0 "Half to me, half to the hunters who found it."

 # ---- Dense growth ----

 wilderness_clearing.0301.t:0 "Timber"
 wilderness_clearing.0301.desc:0 "The felling in [obstacle_county.GetNameNoTier] is done. Where the forest stood, there are now stumps, brush piles, and more cut timber than the settlers could use in a lifetime.\n\n[foreman.GetFirstName] has an offer from a timber merchant downriver. [foreman.GetSheHe|U] also points out that you'll need a great deal of wood yourself if this place is ever going to have walls and a hall."
 wilderness_clearing.0301.a:0 "Keep it. We'll build with it."
 wilderness_clearing.0301.b:0 "Sell it."

 wilderness_clearing.0302.t:0 "Burn It Off"
 wilderness_clearing.0302.desc:0 "The trees in [obstacle_county.GetNameNoTier] are down, but the stumps and undergrowth are still there. Grubbing them out by hand will take the settlers years.\n\n[foreman.GetFirstName] has a faster way: wait for a dry week and burn the whole lot. The ash makes good soil. The only danger is the wind. If it turns, the fire will go wherever it likes, and the settlement is built of wood."
 wilderness_clearing.0302.a:0 "Burn it."
 wilderness_clearing.0302.a.success:0 "The Burn Goes Well"
 wilderness_clearing.0302.a.failure:0 "The Wind Turns"
 wilderness_clearing.0302.b:0 "Pay for more hands and dig them out."

 wilderness_clearing.0303.t:0 "The Great Tree"
 wilderness_clearing.0303.desc:0 "One tree still stands in the middle of the cleared ground in [obstacle_county.GetNameNoTier]. It's enormous and very old, and the fellers won't touch it.\n\nThe people who lived here before believed something lived in it, and some of your settlers have started leaving offerings at its roots. [foreman.GetFirstName] wants a decision before the thing becomes a shrine."
 wilderness_clearing.0303.a:0 "Cut it down. It's only a tree."
 wilderness_clearing.0303.b:0 "Leave it standing. Build around it."
 wilderness_clearing.0303.c:0 "Have a [ROOT.Char.GetFaith.PriestNeuter] bless it first, then cut it."

 # ---- Flooded lands ----

 wilderness_clearing.0401.t:0 "The Spring Flood"
 wilderness_clearing.0401.desc:0 "The ditches and dykes in [obstacle_county.GetNameNoTier] were finished before winter, and the drained marsh has turned out to be good black soil. The settlers are already ploughing it.\n\nNow the snow is melting in the hills and the river is rising. [foreman.GetFirstName] isn't sure the dykes will hold. More earth and more hands would settle the question, but both cost money, and they might hold anyway."
 wilderness_clearing.0401.a:0 "They'll hold."
 wilderness_clearing.0401.a.success:0 "The Dykes Hold"
 wilderness_clearing.0401.a.failure:0 "The Dykes Break"
 wilderness_clearing.0401.b:0 "Pay for more hands. Now."

 wilderness_clearing.0402.t:0 "Marsh Fever"
 wilderness_clearing.0402.desc:0 "The draining in [obstacle_county.GetNameNoTier] is done, but the diggers paid for it. A fever went through the work camps in the last weeks: first the shaking, then the sweats. [foreman.GetFirstName] has buried a dozen people, and more are lying sick.\n\nThe settlers want to see that you care. [foreman.GetFirstName] would rather you didn't come anywhere near the place."
 wilderness_clearing.0402.a:0 "I'll go and see them myself."
 wilderness_clearing.0402.a.success:0 "You Visit the Sick"
 wilderness_clearing.0402.a.success.tt:0 "You come home in good health"
 wilderness_clearing.0402.a.failure:0 "You Catch the Fever"
 wilderness_clearing.0402.a.failure.tt:0 "You come home with the fever"
 wilderness_clearing.0402.b:0 "Send money for physicians and food."
 wilderness_clearing.0402.b.tt:0 "The sickness runs its course without further deaths"
 wilderness_clearing.0402.c:0 "Keep them working. The fever will pass."

 wilderness_clearing.0403.t:0 "What the Bog Gave Back"
 wilderness_clearing.0403.desc:0 "As the water drained out of [obstacle_county.GetNameNoTier], the diggers found a body in the peat: a man, perfectly preserved, with a leather cord still around his neck and a bronze sword laid beside him. From the look of the sword, he has been there a very long time.\n\nThe diggers have downed tools. Nobody wants to be the one to move him."
 wilderness_clearing.0403.a:0 "Bury him properly, with the proper rites."
 wilderness_clearing.0403.b:0 "I'll keep the sword. Put him back in the bog."

 # ---- Scree slopes ----

 wilderness_clearing.0501.t:0 "Good Stone"
 wilderness_clearing.0501.desc:0 "Clearing the loose rock from the slopes above [obstacle_county.GetNameNoTier] has turned up something useful. Under the scree is a face of solid, even-grained stone, the kind masons pay good money for.\n\n[foreman.GetFirstName] wants to open a proper quarry. It will cost something to set up, but you'd have all the stone you need for walls and a keep."
 wilderness_clearing.0501.a:0 "Open the quarry."
 wilderness_clearing.0501.b:0 "Sell the rights to a mason's guild."

 wilderness_clearing.0502.t:0 "Rockslide"
 wilderness_clearing.0502.desc:0 "A section of the slope above [obstacle_county.GetNameNoTier] gave way this morning, just as the work crews were starting. Four people are under it. [foreman.GetFirstName] can hear at least one of them shouting.\n\nThe rest of the slope is still moving. Digging now means putting more people underneath it."
 wilderness_clearing.0502.a:0 "Dig them out. Everyone, now."
 wilderness_clearing.0502.a.success:0 "The Workers Are Saved"
 wilderness_clearing.0502.a.failure:0 "The Slope Comes Down Again"
 wilderness_clearing.0502.b:0 "Nobody else goes up there. I'm sorry."

 wilderness_clearing.0503.t:0 "Terraces"
 wilderness_clearing.0503.desc:0 "The scree is gone from [obstacle_county.GetNameNoTier], and what's under it is steep, thin soil that won't take a plough.\n\n[foreman.GetFirstName] says there are two ways to make something of it. You can cut terraces into the hillside and grow grain on them: slow, expensive work that will feed the valley for generations. Or you can leave the slopes to goats, which cost nothing and ask for nothing."
 wilderness_clearing.0503.a:0 "Build the terraces."
 wilderness_clearing.0503.b:0 "Goats, then."

 # ---- Killing cold ----

 wilderness_clearing.0601.t:0 "The First Winter"
 wilderness_clearing.0601.desc:0 "The shelters in [obstacle_county.GetNameNoTier] are finished: sunk into the ground, roofed with turf, and stacked high with firewood. Now they have to last through a winter.\n\n[foreman.GetFirstName] has counted the stores twice. If the winter is short, there's enough food. If it's long, there isn't."
 wilderness_clearing.0601.a:0 "Ration everything from the first day."
 wilderness_clearing.0601.b:0 "Buy grain from the south, whatever it costs."
 wilderness_clearing.0601.c:0 "It'll be a short winter."
 wilderness_clearing.0601.c.success:0 "A Mild Winter"
 wilderness_clearing.0601.c.failure:0 "The Long Dark"

 wilderness_clearing.0602.t:0 "Lost in the Snow"
 wilderness_clearing.0602.desc:0 "A work party went out from [obstacle_county.GetNameNoTier] three days ago to cut firewood, and it hasn't come back. It has snowed without stopping ever since.\n\n[foreman.GetFirstName] thinks they found shelter somewhere. If so, they're still alive, but not for much longer."
 wilderness_clearing.0602.a:0 "I'll lead the search myself."
 wilderness_clearing.0602.a.success:0 "You Bring Them Home"
 wilderness_clearing.0602.a.failure:0 "The Search Fails"
 wilderness_clearing.0602.b:0 "[champion.GetFirstName], find them."
 wilderness_clearing.0602.b.success:0 "[champion.GetFirstName] Brings Them Home"
 wilderness_clearing.0602.b.failure:0 "[champion.GetFirstName] Returns Alone"
 wilderness_clearing.0602.c:0 "Nobody goes out in that. We wait for the snow to stop."

 wilderness_clearing.0603.t:0 "The Herders"
 wilderness_clearing.0603.desc:0 "Now that there's shelter in [obstacle_county.GetNameNoTier], you have visitors: a band of herders who have wintered in this country for longer than anyone can remember. They wear better furs than your settlers, they eat better, and they haven't lost anyone to the cold.\n\nTheir headman has offered to teach your people how to survive here, for a price. [foreman.GetFirstName] quietly points out that the price is a good deal less than their furs and herds would be worth."
 wilderness_clearing.0603.a:0 "Pay them. Learn what they know."
 wilderness_clearing.0603.b:0 "Take the furs and the herds."
 wilderness_clearing.0603.c:0 "We'll manage without them."

 # ---- Modifiers ----

 clearing_fur_trade:0 "Fur Trade"
 clearing_fur_trade_desc:0 "A bounty on pelts has turned the clearing of the dens into a trade."
 clearing_unpaid_hunters:0 "Unpaid Hunters"
 clearing_unpaid_hunters_desc:0 "The settlers cleared the dens at their own risk and were paid nothing for it."
 clearing_hunting_reserve:0 "Private Hunting Ground"
 clearing_hunting_reserve_desc:0 "A stretch of wild country has been kept back for this character's own hunting."
 clearing_settlers_reassured:0 "Settlers Reassured"
 clearing_settlers_reassured_desc:0 "Their lord came when it mattered, and the settlers haven't forgotten it."
 clearing_settlers_frightened:0 "Frightened Settlers"
 clearing_settlers_frightened_desc:0 "Nobody works the far fields after dark, and some families have packed up and left."
 clearing_gallows:0 "Bandits on the Gallows"
 clearing_gallows_desc:0 "A hanged bandit is a strong argument for keeping the peace."
 clearing_collaborators_punished:0 "Collaborators Punished"
 clearing_collaborators_punished_desc:0 "The settlers who fed the bandits were flogged in public. Nobody will try it again, and nobody has forgiven it either."
 clearing_collaborators_pardoned:0 "Collaborators Pardoned"
 clearing_collaborators_pardoned_desc:0 "The settlers who fed the bandits were forgiven, and they're grateful for it."
 clearing_goods_returned:0 "Stolen Goods Returned"
 clearing_goods_returned_desc:0 "What the bandits took has been handed back to the people it was taken from."
 clearing_robbed_settlers:0 "Robbed Twice"
 clearing_robbed_settlers_desc:0 "First the bandits took the settlers' goods, then their lord did."
 clearing_timber_stock:0 "Timber Stockpile"
 clearing_timber_stock_desc:0 "Cleared forest has left enough seasoned timber to build with for years."
 clearing_ash_fields:0 "Ash-Fed Fields"
 clearing_ash_fields_desc:0 "The burned ground is black and rich, and everything planted in it grows."
 clearing_fire_damage:0 "Fire Damage"
 clearing_fire_damage_desc:0 "A clearing fire got loose and burned half the settlement with it."
 clearing_felled_holy_tree:0 "Felled Holy Tree"
 clearing_felled_holy_tree_desc:0 "The great tree was cut down, and some of the settlers think no good will come of it."
 clearing_spared_holy_tree:0 "The Spared Tree"
 clearing_spared_holy_tree_desc:0 "The great tree still stands in the middle of the fields, and the settlers are fond of it."
 clearing_drained_fields:0 "Drained Fields"
 clearing_drained_fields_desc:0 "Land that used to be marsh is now some of the best soil in the county."
 clearing_fever_losses:0 "Fever Losses"
 clearing_fever_losses_desc:0 "Marsh fever killed a good many of the diggers, and the work was kept going regardless."
 clearing_bog_unease:0 "Unquiet Bog"
 clearing_bog_unease_desc:0 "The settlers know what was found in the peat, and they avoid the place."
 clearing_stone_quarry:0 "Local Quarry"
 clearing_stone_quarry_desc:0 "Good building stone is cut right here, and doesn't have to be carted in."
 clearing_rockslide_grief:0 "Buried in the Rockslide"
 clearing_rockslide_grief_desc:0 "Workers were left under the rockslide, and their families still mourn them."
 clearing_rockslide_rescue:0 "Dug Out Alive"
 clearing_rockslide_rescue_desc:0 "Everyone dug for the buried workers, and everyone came home."
 clearing_terraces:0 "Hillside Terraces"
 clearing_terraces_desc:0 "Terraces cut into the cleared slopes grow grain where nothing grew before."
 clearing_hill_grazing:0 "Hill Grazing"
 clearing_hill_grazing_desc:0 "Goats have the run of the cleared slopes."
 clearing_hard_rationing:0 "Hard Rationing"
 clearing_hard_rationing_desc:0 "Everyone lived through the winter on short rations, and everyone remembers who counted them out."
 clearing_full_granary:0 "Full Granary"
 clearing_full_granary_desc:0 "Grain bought from the south got the settlers through their first winter in comfort."
 clearing_cold_lore:0 "Herders' Knowledge"
 clearing_cold_lore_desc:0 "The settlers have learned from local herders how to live through a hard winter."
 clearing_herder_grudge:0 "Herders' Grudge"
 clearing_herder_grudge_desc:0 "The herders who were robbed are still out there, and they remember."
 clearing_lost_party:0 "Lost in the Snow"
 clearing_lost_party_desc:0 "A work party went out into the snow and never came back."
