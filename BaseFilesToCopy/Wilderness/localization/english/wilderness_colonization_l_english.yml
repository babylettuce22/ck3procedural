 # under. Worded to match vanilla's own block in localization/english/modifiers/modifiers_l_english.yml.
 wilderness_holding_build_speed:0 "Wilderness [buildings|E] Construction Time"
 wilderness_holding_build_gold_cost:0 "Wilderness [buildings|E] Construction Cost"
 wilderness_holding_build_piety_cost:0 "Wilderness [buildings|E] Piety Cost"
 wilderness_holding_build_prestige_cost:0 "Wilderness [buildings|E] Prestige Cost"
 wilderness_holding_holding_build_speed:0 "Wilderness [holding|E] Construction Time"
 wilderness_holding_holding_build_gold_cost:0 "Wilderness [holding|E] Construction Cost"
 wilderness_holding_holding_build_piety_cost:0 "Wilderness [holding|E] Piety Cost"
 wilderness_holding_holding_build_prestige_cost:0 "Wilderness [holding|E] Prestige Cost"

 settlement_holding_build_speed:0 "Colony [buildings|E] Construction Time"
 settlement_holding_build_gold_cost:0 "Colony [buildings|E] Construction Cost"
 settlement_holding_build_piety_cost:0 "Colony [buildings|E] Piety Cost"
 settlement_holding_build_prestige_cost:0 "Colony [buildings|E] Prestige Cost"
 settlement_holding_holding_build_speed:0 "Colony [holding|E] Construction Time"
 settlement_holding_holding_build_gold_cost:0 "Colony [holding|E] Construction Cost"
 settlement_holding_holding_build_piety_cost:0 "Colony [holding|E] Piety Cost"
 settlement_holding_holding_build_prestige_cost:0 "Colony [holding|E] Prestige Cost"
