 WILDERNESS_PROMOTE_TEMPLE_BUTTON:0 "Consecrate a Temple"
 colonize_settle_button_effect_tt:0 "Send settlers into this country, and make it ours to hold — or to lose."
 colonize_obstacles_remain_tt:0 "Nothing may still be blocking the land"
 colonize_needs_development_tt:0 "The county must have reached #V 4 #! Development"
