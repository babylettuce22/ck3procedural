l_english:

 # Key prefixes are not decoration: CK3 looks up a building as `building_<key>`, the label above its
 # icon as `building_type_<key>`, and a trait as `trait_<key>`. A bare key here shows the raw string
 # in-game and reports nothing, which is why every one of these was caught by ck3-tiger rather than
 # by playing.

 # War/Casus Belli 
 is_a_wilderness_recipient_tt:0 "You cannot declare war on uncolonized wilderness."
 is_a_wilderness_actor_tt:0 "The wilderness cannot declare war."

 # --- Trait and government -----------------------------------------------------------------
 trait_wilderness:0 "Wilderness"
 blank_title_male:0 ""
 # The generated dummy that holds every unsettled county writes `name = "wilderness_holder_name"`,
 # so this is what the county view shows where a lord's name would go. See Emit/HistoryWriter.cs.
 wilderness_holder_name:0 "The Wilds"

 # The titular kingdom the dummy holds so its realm has a name — otherwise every unsettled county
 # on the map is labelled after whichever county the dummy happened to hold first.
 #
 # This key is defined in C#, not here: WildernessMap.TitleKey in MapGen/Wilderness.cs. It is the
 # only place a file in this set names something the generator owns, so if that constant changes
 # this string silently stops resolving and the map shows the raw key.
 k_gen_wilderness:0 "Wilderness"
 k_gen_wilderness_adj:0 "Wild"
 trait_wilderness_desc:0 "Vast and untamed nothingness."

 wilderness_government:0 "Wilderness"
 wilderness_government_adjective:0 "Untamed"
 wilderness_government_realm:0 "Wilderness"
 wilderness_government_desc:0 "Empty country. No lord holds it, no levy comes from it, and crossing it is a risk in itself."

 # --- What a title of ours is CALLED ------------------------------------------------------
 #
 # CK3 builds a title's full name from `TITLE_TIERED_NAME`, which is "$TIER|U$ of $NAME$" — so
 # "County of Braemar" is the tier word plus the title. The tier word is looked up as
 # `<tier>_<government>`, where <government> is the government key with `_government` stripped:
 # feudal_government gives `county_feudal` ("County"), clan_government gives `county_clan`
 # ("Chiefdom"), theocracy_government gives `county_theocracy` ("Great Temple").
 #
 # NOT `mechanic_type`, which is the tempting reading and is wrong: republic_government and
 # tribal_government declare no mechanic_type at all, and still resolve `county_republic` and
 # `county_tribal`.
 #
 # Both of this mod's governments were therefore asking for keys nobody had written. A missing
 # tier key is not a silent failure — it shows the raw key — so a colonist's county was liable to
 # read "County_colony of Braemar" anywhere the full name is drawn.
 #
 # IMPORTANT, because it limits what this buys: the tier word is a fact about the HOLDER's
 # government, not about the holding. A colony held by an ordinary feudal lord — which is every
 # colony the player founds and keeps — still reads "County of X", because that lord is still
 # feudal. Only a colony held by a colonist reads "Colony of X". Making the county window say
 # "Colony" regardless of who holds it needs a GUI change in Emit/GuiWriter.cs, not a string here.
 barony_colony:0 "Colony"
 county_colony:0 "Colony"
 duchy_colony:0 "Colonies"

 # The wilderness dummy has the same gap. "Wilderness of Braemar" is also the honest phrasing for
 # ground nobody holds, which is a happier accident than it sounds.
 barony_wilderness:0 "Wilderness"
 county_wilderness:0 "Wilderness"
 duchy_wilderness:0 "Wilderness"
 kingdom_wilderness:0 "Wilderness"

 # --- Holdings -----------------------------------------------------------------------------
 wilderness_holding:0 "Wilderness"
 wilderness_holding_desc:0 "Unsettled land. Somebody could live here, given years and money and a tolerance for what already does."

 settlement_holding:0 "Colony"
 settlement_holding_desc:0 "A foothold rather than a holding — a palisade, a few families, and a great deal still to do."

 # A holding type needs a SECOND name, not just the one above. Anywhere the UI says "$TYPE$
 # Holding" it looks up `<key>_concept_key`, not `<key>`, and vanilla points that at a game
 # concept (`castle_holding_concept_key` is "[castle|E]") so the phrase is clickable. These two
 # holdings have no concept behind them, so they are plain strings — and without them the county
 # window prints the raw key, which is what it was doing.
 wilderness_holding_concept_key:0 "Wilderness"
 settlement_holding_concept_key:0 "Colony"

 # --- The wilderness itself ----------------------------------------------------------------
 building_wilderness_01:0 "Untamed Land"
 building_wilderness_01_desc:0 "No road, no field, no roof. Whatever wealth is here is still in the ground or on the hoof."
 building_type_wilderness_01:0 "Wilderness"
 building_type_wilderness_01_desc:0 "Land nobody has taken in hand."

 # --- Obstacles ----------------------------------------------------------------------------
 building_beast_dens:0 "Beast Dens"
 building_beast_dens_desc:0 "Wolves, bear, or worse. The herds thin every winter and the shepherds will not go out alone."
 building_beast_dens_cleared:0 "Clear the Dens"
 building_beast_dens_cleared_desc:0 "Hunt them out, or drive them far enough that they become somebody else's trouble."
 building_type_beast_dens:0 "Beasts"
 building_type_beast_dens_desc:0 "Something with teeth has the run of this county."

 building_bandit_camps:0 "Bandit Camps"
 building_bandit_camps_desc:0 "Somebody was already here, and they have no use for a tax collector."
 building_bandit_camps_cleared:0 "Break the Camps"
 building_bandit_camps_cleared_desc:0 "Root them out of the hills. Some will hang; some will take the coin and enlist."
 building_type_bandit_camps:0 "Bandits"
 building_type_bandit_camps_desc:0 "Men who were here first and intend to stay."

 building_dense_growth:0 "Dense Growth"
 building_dense_growth_desc:0 "Old forest, close-grown. Nothing can be built here until a good deal of it comes down."
 building_dense_growth_cleared:0 "Clear the Growth"
 building_dense_growth_cleared_desc:0 "Fell it, burn the stumps, and sell what timber the work does not eat."
 building_type_dense_growth:0 "Dense Growth"
 building_type_dense_growth_desc:0 "Forest that has to come down before anything goes up."

 building_flooded_lands:0 "Flooded Lands"
 building_flooded_lands_desc:0 "Standing water half the year. The ground will not hold a foundation and the air carries fever."
 building_flooded_lands_cleared:0 "Drain the Lowlands"
 building_flooded_lands_cleared_desc:0 "Ditch it, dyke it, and hope the river agrees."
 building_type_flooded_lands:0 "Flooded Lands"
 building_type_flooded_lands_desc:0 "Ground that is under water more often than not."

 building_scree_slopes:0 "Scree Slopes"
 building_scree_slopes_desc:0 "Loose rock and no level ground. Every cart that comes up is unloaded twice."
 building_scree_slopes_cleared:0 "Cut Terraces"
 building_scree_slopes_cleared_desc:0 "Cut benches into the slope until there is somewhere flat enough to stand a building on."
 building_type_scree_slopes:0 "Broken Ground"
 building_type_scree_slopes_desc:0 "Rock and rubble where level ground should be."

 building_killing_cold:0 "Killing Cold"
 building_killing_cold_desc:0 "The winters here take people. Not a hardship — a cause of death."
 building_killing_cold_cleared:0 "Build Against the Winter"
 building_killing_cold_cleared_desc:0 "Deep stores, banked walls, and fuel enough to last. The cold does not leave; you simply stop losing to it."
 building_type_killing_cold:0 "Killing Cold"
 building_type_killing_cold_desc:0 "Winters that are a cause of death rather than a season."

 # --- The colony ---------------------------------------------------------------------------
 building_settlement_01:0 "Colony"
 building_settlement_01_desc:0 "A palisade and a few dozen souls. It costs more than it earns and will for years."
 building_settlement_02:0 "Growing Colony"
 building_settlement_02_desc:0 "Fields cleared, a mill, a road worth the name. It very nearly pays for itself."
 building_settlement_03:0 "Established Colony"
 building_settlement_03_desc:0 "No longer an outpost. Give it a lord's seat and it will pass for anywhere else."
 building_type_settlement_01:0 "Colony"
 building_type_settlement_01_desc:0 "A foothold on ground nobody held."

 # --- Modifiers ----------------------------------------------------------------------------
 settling_expedition_underway:0 "Settlers on the Road"
 settling_expedition_underway_desc:0 "A party has gone out to this country. Whether anything comes of it will not be known for a year or two."
 block_settlement_ability:0 "Unsettlable"
 block_settlement_ability_desc:0 "Nobody will live here. Not for money, not for land, not for anything."

 # --- Decision -----------------------------------------------------------------------------
 settle_the_wilderness_decision:0 "Settle the Wilderness"
 settle_the_wilderness_decision_tooltip:0 "Send settlers into the empty country on our borders."
 settle_the_wilderness_decision_confirm:0 "Send Them Out"
 settle_the_wilderness_decision_desc:0 "There is land beyond our borders that no lord holds and no map names.\n\nSettling it is not a conquest. It is an expense — men who must be fed through a first winter, a palisade against whatever already lives there, and years before any of it shows in the ledger. What it buys is a county that did not exist before.\n\nThe steward has a place in mind."

 # --- Interactions -------------------------------------------------------------------------
 claim_wilderness_interaction:0 "Claim the Land"
 claim_wilderness_interaction_desc:0 "No lord holds this country and no map names it. Send settlers, and it becomes ours to make something of — or to lose."
 promote_colony_interaction:0 "Raise To Proper Holding"
 promote_colony_interaction_desc:0 "The colony has grown past its palisade. Build a proper seat here and let it stand as any other county does."
 promote_colony_to_city_interaction:0 "Charter a Town"
 promote_colony_to_city_interaction_desc:0 "Grant the colony a charter and let it grow as a town rather than a fortress."
 promote_colony_to_temple_interaction:0 "Consecrate a Temple"
 promote_colony_to_temple_interaction_desc:0 "Give the colony over to the faith, and let its temple be the seat here."

 # --- Toasts -------------------------------------------------------------------------------
 colonize_claimed_toast:0 "Settlers Depart"

 # --- The settling event -------------------------------------------------------------------
 # --- The expedition ------------------------------------------------------------------------
 # scope:colony is the county just claimed; scope:expedition_leader and scope:expedition_soldier are
 # the two candidates. Written plainly: the drama is that the party may not come back, and text
 # that shouts about it before anything has happened spends the moment early.
 #
 # PRONOUNS. Every character these events name is picked by ordered_courtier_or_guest or is an
 # existing vassal — nothing anywhere restricts them to men — so a hard-coded "he" is wrong roughly
 # half the time. Where a character is in scope the text uses the engine's own gendered promotes,
 # which are built in and need no customizable_localization of ours:
 #   [x.GetSheHe] she/he · [x.GetHerHis] her/his · [x.GetHerHim] her/him
 #   [x.GetHerselfHimself] herself/himself · [x.GetWomanMan] woman/man
 # Add |U to capitalise for the start of a sentence: [x.GetSheHe|U].
 # Where no character is in scope — modifier and contract descriptions, the riders who carry news —
 # the phrasing avoids a pronoun instead. Collective "men" for a levy or a band of settlers is left
 # alone; it is a period noun for a crowd, not a claim about one person.
 wilderness_colonization.0010.t:0 "The Settlers Go Out"
 wilderness_colonization.0010.desc:0 "They leave before dawn, in carts and on foot — younger sons with no land coming to them, families a bad harvest turned out, a few men who did not say why they were going.\n\nAhead of them is [colony.GetName], which is not a place yet so much as a direction. There is no road to it and no roof on it, and between the last of our grain and their first harvest is a winter that will not care how well we meant it.\n\nSomeone has to be in charge of that arithmetic."
 wilderness_colonization.0010.a:0 "Send [expedition_leader.GetFirstName]. [expedition_leader.GetSheHe|U] knows a thing or two about management."
 wilderness_colonization.0010.b:0 "Send [expedition_soldier.GetFirstName]. It is not the winter I am worried about."
 wilderness_colonization.0010.c:0 "They can choose their own leader on the road."

 colonize_expedition_odds_tt:0 "#V [expedition_leader.GetShortUIName]#! leads the expedition"
 colonize_expedition_soldier_tt:0 "#V [expedition_soldier.GetShortUIName]#! leads the expedition. If the colony holds, one obstacle will already have been dealt with"
 colonize_expedition_none_tt:0 "Nobody leads the expedition. Poorer odds, but no one of ours is out there when it goes wrong"

 # --- Word from the road ---------------------------------------------------------------------
 # Three months out, one of these arrives. Each asks for a different thing: money, a decision
 # about who is in charge, or a promise that only costs anything if they live.
 #
 # THE ODDS. Every option out there is a roll, and every one of them prints its chance the way
 # vanilla prints a duel's or a hunt's:
 #     [SCOPE.ScriptValue('some_value')|0]%
 # SCOPE is the scope the tooltip is evaluated in, which for an event option is the lord reading
 # the letter — which is why the values in 00_colonization_values.txt are written for HIS scope and
 # reach the party through scope:expedition_leader. A value written in the leader's scope could be
 # rolled against but not shown, and being shown is the point.
 wilderness_colonization.0016.t:0 "Short Rations"
 wilderness_colonization.0016.desc:0 "A rider from the column, who has not eaten well.\n\nThey are further from [colony.GetName] than the maps allowed for, and the carts are lighter than they were. It is not a disaster yet. It becomes one in about six weeks, and by then there will be nothing to send that would arrive in time."
 wilderness_colonization.0016.a:0 "Send carts after them."
 wilderness_colonization.0016.b:0 "They will have to make do."

# --- Short Rations 0016 Text & Tooltips ---
 wilderness_colonization.0016.c:0 "Order the hunters to fan out and live off the wild."

 colonize_relief_column_breakdown_tt:0 "#bold Dispatch Relief Wagons#! (#N -50 Gold#!):\n• #V [SCOPE.ScriptValue('colony_relief_column_chance')|0]%#! Chance Carts Arrive in Time (based on Realm Stewardship)\n• #P Success#!: Supplies reach the column (#P +20#! Expedition Fortune)\n• #N Failure#!: Carts arrive late or lose wagons in drifts (#P +2#! Fortune; gold spent)"

 colonize_forage_breakdown_tt:0 "#bold Forage & Hunt the Wilderness#!:\n• #V [SCOPE.ScriptValue('colony_self_rule_chance')|0]%#! Chance of Bountiful Game\n• #P Success#!: Scouts bring down wild game (#P +12#! Expedition Fortune)\n• #N Failure#!: Game is scarce; scouts suffer frostbite (#N -8#! Expedition Fortune)"

 colonize_make_do_breakdown_tt:0 "#bold Enforce Harsh Rationing#!:\n• #V [SCOPE.ScriptValue('colony_make_do_chance')|0]%#! Chance Existing Stores Last\n• #P Success#!: Discipline stretches grain to the border (#P +5#! Expedition Fortune)\n• #N Failure#!: Bitter starvation and dead pack animals (#N -18#! Expedition Fortune)"

 colonize_relief_column_tt:0 "#V [SCOPE.ScriptValue('colony_relief_column_chance')|0]%#! that the carts find them in time. The gold goes either way"
 colonize_make_do_tt:0 "#V [SCOPE.ScriptValue('colony_make_do_chance')|0]%#! that they make what they have last"

 # 0017 has two forms of one question, chosen by whether anybody was put in charge in 0010. The
 # leaderless wording is the .nobody keys below; nothing names a character in them, because there is
 # no character to name — see the pronoun note above for why the phrasing works around it rather
 # than inventing a "he".
 wilderness_colonization.0017.t:0 "The [expedition_leader.GetWomanMan|U] We Sent"
 wilderness_colonization.0017.desc:0 "The rider is careful about how to put it, which tells us most of it.\n\n[expedition_leader.GetFirstName] is not sleeping. [expedition_leader.GetSheHe|U] has been overruling men who know the country better than [expedition_leader.GetSheHe] does, and twice now has been wrong in front of everybody. Nobody has said the word yet. They are all thinking about who would be in charge if [expedition_leader.GetSheHe] were not."
 wilderness_colonization.0017.a:0 "[expedition_leader.GetSheHe|U] has our authority. Say so, loudly."
 wilderness_colonization.0017.b:0 "Put [expedition_soldier.GetFirstName] over [expedition_leader.GetHerHim]."
 wilderness_colonization.0017.c:0 "They can sort it out among themselves."

 wilderness_colonization.0017.t.nobody:0 "Somebody Has Been Deciding"
 wilderness_colonization.0017.desc.nobody:0 "There is no name at the top of the message, which is most of the news.\n\nSomebody out there has been deciding things — where to ford, what to leave on the road, who eats when the carts run light — and has mostly been deciding right. Nobody appointed that. The column has started saying so, and the ones saying it loudest are the ones who have been overruled.\n\nThey are three months out and arguing about who is in charge of the argument."
 wilderness_colonization.0017.a.nobody:0 "Whoever has been leading them leads them. Say so, loudly."
 wilderness_colonization.0017.b.nobody:0 "Send [expedition_soldier.GetFirstName] after them to take command."
 wilderness_colonization.0017.c.nobody:0 "It is their road. Let them settle it."


 # --- Option A Tooltip ---
 colonize_authority_breakdown_tt:0 "#bold Standing on Royal Authority#!:\n• #V [SCOPE.ScriptValue('colony_authority_chance')|0]%#! Chance of Success\n• #P Success#!: Authority restored (#P +14#! Expedition Fortune)\n• #N Failure#!: Words ignored from afar (#N -10#! Expedition Fortune, Leader gains Stress)"

 # --- Option B Tooltips ---
 colonize_handover_breakdown_tt:0 "#bold Force Change of Command#!:\n#V [expedition_soldier.GetShortUIName]#! assumes leadership immediately.\n• #V [SCOPE.ScriptValue('colony_handover_chance')|0]%#! Chance of Clean Handover\n• #P Success#!: Martial order established (#P +8#! Fortune, obstacle clearance active)\n• #N Failure#!: Factional mutiny on the road (#N -12#! Fortune, [expedition_leader.GetShortUIName] loses #N 20 Opinion#! and gains Stress)"

 colonize_ride_after_breakdown_tt:0 "#bold Send a Military Leader#!:\n[expedition_soldier.GetShortUIName] rides out to take command of the leaderless carts.\n• #V [SCOPE.ScriptValue('colony_handover_chance')|0]%#! Chance to Overtake & Assume Command\n• #P Success#!: Column rallied under strong leadership (#P +10#! Fortune)\n• #N Failure#!: Arrives late to a distrustful column (#N -6#! Fortune)"

 # --- Option C Tooltip ---
 colonize_self_rule_breakdown_tt:0 "#bold Abstain from the Dispute#!:\n• #V [SCOPE.ScriptValue('colony_self_rule_chance')|0]%#! Chance of Sensible Resolution\n• #P Success#!: Grassroots consensus emerges (#P +6#! Fortune)\n• #N Failure#!: Brawls and wagon desertions on the trail (#N -14#! Fortune)"
 wilderness_colonization.0018.t:0 "They Want to Turn Back"
 wilderness_colonization.0018.desc:0 "It has stopped being a journey and become a thing they are enduring, and some of them have started counting the days back rather than forward.\n\nWhat they want is to know what they get. Not wages — land. Their own, held of us and not worked for somebody else, which is the only thing that was ever going to move people this far from anywhere.\n\nWe can promise that. It is not ours to promise until there is a colony to cut it out of."
 wilderness_colonization.0018.a:0 "Promise them land of their own."
 wilderness_colonization.0018.b:0 "They knew what they were signing for."

 colonize_promise_tt:0 "#V [SCOPE.ScriptValue('colony_promise_chance')|0]%#! that they believe it"
 colonize_hold_them_tt:0 "#V [SCOPE.ScriptValue('colony_hold_them_chance')|0]%#! that the column holds together"
 colonize_settlers_promised_tt:0 "If the colony holds, its settlers will hold us to it — promised or merely told, and believed or not"

 # Lines in the odds breakdown, from `desc` on an add in 00_colonization_values.txt.
 colonize_no_leader_desc:0 "Nobody in charge of them"
 colonize_riding_after_desc:0 "Three months of road to make up"
 settlers_promised_land:0 "Promised Their Own Land"
 settlers_promised_land_desc:0 "They were told, on a bad road a long way from here, that this country would be theirs. Some of it will have to be."

 wilderness_colonization.0012.t:0 "Word from the Colony"
 wilderness_colonization.0012.desc:0 "A rider from [colony.GetName], 7 months on.\n\nThey lost people — the rider is matter-of-fact about it, and does not give a number unless asked. But there are roofs, there is a palisade, and there was enough put by to get through the second winter without sending to us for it.\n\nIt is a place now. A poor one, but a place."

wilderness_colonization.0012.desc.self:0 "After days and days of ragged, rough terrain, sleepless nights behind the palisade have finally yielded fruit.\n\n[colony.GetName] is no longer just carts in the snow—there are solid hearths, cleared perimeter ditches, and fields ready for the spring planting. We have carved a county out of the wild with our own hands.\n\nIt is a place now. Our place."

wilderness_colonization.0029.t:0 "The Starving Winter"
 wilderness_colonization.0029.desc:0 "The blizzard has sealed the passes behind us, and the last grain barrel was scraped clean three days ago.\n\nThe expedition to [colony.GetName] has collapsed. Settlers are burning wagon spokes just to stay alive through the night, and frozen cattle lie half-buried in the snowdrifts.\n\nWithout an immediate, brutal decision, this road will be our grave."
 wilderness_colonization.0029.a:0 "Butcher the horses, ditch the wagons, and march home on foot."
 wilderness_colonization.0029.b:0 "Press forward through the whiteout! We reach the palisade or die trying!"

 colonize_starvation_retreat_tt:0 "#P Guaranteed Survival#!:\n• You abandon the expedition and limp back to court.\n• Suffer wounds and #N Malnutrition#!, but you #P survive#!."
 colonize_starvation_gamble_tt:0 "#bold Desperate Defiance#!:\n• #N High risk of death by freezing/starvation!#!\n• Evaluated against your #V Prowess#! and constitution."
 wilderness_starvation_survival_desc:0 "You drag yourself out of the drifts frostbitten and battered, but breathing."
 wilderness_starvation_death_desc:0 "The cold seeps into your bones. Your march ends in the snow."
 wilderness_colonization.0013.t:0 "Nothing Came Back"
 wilderness_colonization.0013.desc:0 "What is left of the party came out of [colony.GetName] in ones and twos over the spring, and what they say does not entirely agree.\n\nThe stores went early. After that it is a matter of which thing got them — the cold, the water, the people who were already there — and by then it hardly mattered which.\n\nThe ground is as it was. So is the ledger, minus what we spent."
 wilderness_colonization.0013.a:0 "It was not a good place for it."

 promote_colony_toast:0 "A Colony Comes of Age"
 colonize_obstacle_cleared_toast:0 "The Way Is Clear"

 # --- Requirement tooltips -----------------------------------------------------------------
 colonize_expedition_out_tt:0 "We already have a party on the road; we will know how they fared before long..."
 colonize_at_settlement_limit_tt:0 "We hold as many colonies as we can support"
 colonize_must_border_realm_tt:0 "The land must border our realm"
 colonize_not_while_at_war_tt:0 "We cannot spare settlers while at war"
 colonize_cannot_afford_tt:0 "We cannot afford to outfit an expedition"
 colonize_cannot_afford_prestige_tt:0 "We lack the standing to call men out to empty country"

