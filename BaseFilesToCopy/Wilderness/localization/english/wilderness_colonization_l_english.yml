 # --- The colonist's government ---------------------------------------------------------------
 colony_government:0 "Colonial"
 colony_government_adjective:0 "Colonial"
 colony_government_realm:0 "Settlement"
 colony_government_desc:0 "The open frontier; full of potential, but a developing colony will only be able to muster few men, and all capital produced goes directly into the colony; their liege will only receive few levies, and no taxes."
 colony_opinion_of_liege_desc:0 "The Lord Who Sent Me Out"

 colony_vassal:0 "Settlers' Terms"
 colony_vassal_desc:0 "What a colonist owes the lord who sent them out. There is nothing in it to negotiate; it lapses the day there is a seat here."
 colony_obligations:0 "Settlers' [obligations|E]"
 settlers_obligations:0 "Men, Not Coin"
 settlers_obligations_short:0 "Men, Not Coin"
 settlers_obligations_desc:0 "The colony renders no tax — there is none to render. What it has is people, and they can be called out."

 # --- Presence -----------------------------------------------------------------------------
 overseeing_the_settlement:0 "Overseeing the Settlement"
 overseeing_the_settlement_desc:0 "We are here. Not sending word, not reading reports — here, where the work is, for as long as we choose to stay."
 settlement_overseen:0 "The Lord Is Here"
 settlement_overseen_desc:0 "Their lord sleeps within the palisade. Disputes are settled the same week, the work is inspected by whoever is paying for it, and nobody is waiting on a rider."

 # --- Opinion ------------------------------------------------------------------------------
 colonist_raised_up_opinion:0 "Raised Me From Nothing"
 colonist_sent_to_the_frontier_opinion:0 "Sent Me to the Frontier"
 lost_a_colony_opinion:0 "Let a Frontier Walk Away"

 TRUCE_COLONY_INDEPENDENCE:0 "settlement of the frontier"

 # --- Going there, and coming back -----------------------------------------------------------
 WILDERNESS_OVERSEE_BUTTON:0 "Go and Oversee It"



 # --- The leak detector ----------------------------------------------------------------------
 # Diagnostic, not flavour. Both strings name the county and the holder so the route can be
 # identified from a screenshot or from game.log without reproducing it. Remove with
 # wilderness_colonization.0099 once the route is closed at its source.
 wilderness_leak_toast:0 "Wilderness in a Realm: [leak_county.GetName] was held by [leak_county.GetHolder.GetName] while still unsettled. It has been returned to the wild."
 wilderness_leak_debug_log:0 "WILDERNESS LEAK: county [leak_county.GetName] entered the realm of [leak_county.GetHolder.GetName] with wilderness_holding intact; reverted."

 colonize_already_present_tt:0 "We are already there"
 colonize_already_travelling_tt:0 "We are already on the road"

 # --- Granting a colony away -----------------------------------------------------------------
 wilderness_colonization.0015.t:0 "A [colonist.GetWomanMan|U] With Nothing"
 wilderness_colonization.0015.desc:0 "[colonist.GetTitledFirstName] came to us with unlanded, and with no foreseen prospects of any. [colonist.GetSheHe|U] now has a chance to forge [colonist.GetHerHis] own land in my name.\n\nIt shall start with no more than tents and mere pallisades, and [colonist.GetSheHe] knows perfectly well; [colonist.GetSheHe] knelt anyway.\n\nWhat [colonist.GetSheHe] has that our other vassals do not is a reason for the place to succeed. [colonist.GetSheHe|U] has nowhere else to go that [colonist.GetSheHe] may call [colonist.GetHerHis] own."
 wilderness_colonization.0015.a:0 "Let [colonist.GetHerHim] make something of it."

wilderness_colonization.0010.d:0 "I will lead the column myself. No one else has more at stake."
 colonize_expedition_self_tt:0 "#V You#! lead the expedition personally. Your own attributes and traits determine its odds of survival."

 wilderness_colonization.0012.a:0 "Integrate [colony.GetName] into our personal domain."
 wilderness_colonization.0012.b:0 "Invest [expedition_leader.GetFirstName] as the new ruler of [colony.GetName]."
 colonize_keep_direct_control_tt:0 "You retain direct possession of [colony.GetName] as part of your domain."
 colonize_grant_to_leader_tt:0 "#V [expedition_leader.GetShortUIName]#! is granted [colony.GetName] and becomes your colonial vassal."

 # --- Naming the colony ----------------------------------------------------------------------
 # `colony_entered_name` is the only one of these the game ever stores. The text widget on 0012
 # keeps whatever was typed under `colony_chosen_name` on the character, GetLocalizedText reads it
 # back out, and `set_title_name_dynamic` in the event's `after` resolves this key once and bakes
 # the result onto the title. Nothing here is looked up again afterwards, so these strings are
 # free to change without touching colonies that were already named.
 colony_entered_name:0 "[ROOT.Char.GetLocalizedText('colony_chosen_name')]"

 # The suggestions under the box. `colony_name_keep` is first, so it is what the box is pre-filled
 # with, and clicking straight through leaves the generated name alone.
 colony_name_keep:0 "[colony.GetName]"
 colony_name_wood:0 "Thornwood"
 colony_name_jungle:0 "Greenmarch"
 colony_name_stone:0 "Stonewatch"
 colony_name_dry:0 "Dryhold"
 colony_name_fen:0 "Fenmarch"
 colony_name_field:0 "Longfield"

 # --- A colony comes of age ------------------------------------------------------------------
 wilderness_colonization.0020.t:0 "The Seat Is Raised"
 wilderness_colonization.0020.desc:0 "Word from [finished_colony.GetName]: the hall is up.\n\n[colonist.GetTitledFirstName] has spent the better part of [colonist.GetHerHis] life on this — the wolves, the winters, the years where nothing we sent made any difference and nothing came back. There is a road to it now. There are people in it who were born in it.\n\n[colonist.GetSheHe|U] has sent word rather than come [colonist.GetHerselfHimself], which is fair; the ride is long and there is a harvest. The word is that [colonist.GetSheHe] remains ours."
 wilderness_colonization.0020.a:0 "[colonist.GetSheHe|U] has earned the seat. Let [colonist.GetHerHim] keep it."
 wilderness_colonization.0020.b:0 "It is finished now. We will take it back."

 wilderness_colonization.0021.t:0 "[colonist.GetSheHe|U] Does Not Send Word"
 wilderness_colonization.0021.desc:0 "The infrastructure, housing, and main hall at [finished_colony.GetName] have all finished construction. We know this because a merchant told us, not because [colonist.GetTitledFirstName] did.\n\n[colonist.GetSheHe|U] has not renewed [colonist.GetHerHis] oath, and does not intend to. [colonist.GetHerHis|U] answer, when it came, was courteous and short: [colonist.GetSheHe] was given empty country and a charter, and what stands there now [colonist.GetSheHe] and [colonist.GetHerHis] neighbours built. [colonist.GetSheHe|U] does not see what part of it is ours.\n\nIt is a long way off. Everyone who has heard is waiting to see whether that matters to us."
 wilderness_colonization.0021.a:0 "Let [colonist.GetHerHim] have it. It was never worth anything to us."
 wilderness_colonization.0021.b:0 "The land is ours. We will remember that."

# Plea for aid

wilderness_colonization.0051.t:0 "A Plea from the Palisade"
 wilderness_colonization.0051.desc.intro:0 "A dust-caked messenger from [struggling_colony.GetName] presents a letter signed with the rough hand of [petitioning_colonist.GetTitledFirstName].\n\nProgress on the frontier has ground to a halt."
 
 wilderness_colonization.0051.desc.beasts:0 "\n\nPacks of wolves and predators have surrounded the perimeter. Woodsmen refuse to fell timber without armed escorts, and hunting the beasts out of the hills requires wages for trackers and hunters."
 wilderness_colonization.0051.desc.bandits:0 "\n\nOutlaw camps in the nearby ridges have ambushed the supply carts. [petitioning_colonist.GetFirstNameNoTooltip] needs funds to hire local armsmen and root them out."
 wilderness_colonization.0051.desc.growth:0 "\n\nThe dense, ancient growth will not yield to blunt axes. Additional teams of loggers and draft oxen must be hired from bordering towns to fell and burn the stumps."
 wilderness_colonization.0051.desc.floods:0 "\n\nStanding marshwater has flooded the lower compound. Digging drainage ditches and dyking the river will require specialized ditchers and timber cribs."
 wilderness_colonization.0051.desc.scree:0 "\n\nThe steep scree slopes constantly collapse into the ditches. Cutting stone benches and terraces requires masons and iron picks."
 wilderness_colonization.0051.desc.cold:0 "\n\nThe bitter frost has frozen the work yards solid. Deep winter storehouses and banked walls must be erected before men can work safely."
 wilderness_colonization.0051.desc.upgrade_01:0 "\n\nThe initial palisade is bursting at the seams. Expanding into a growing settlement with fields and proper cartways requires timber and building materials."
 wilderness_colonization.0051.desc.upgrade_02:0 "\n\nThe colony is poised on the brink of full establishment, but lacks the coin to raise the final stone foundations and roads."
 wilderness_colonization.0051.desc.fallback:0 "\n\nThe local settlement chest is empty and tools are broken."
 
 wilderness_colonization.0051.desc.outro:0 "\n\n[petitioning_colonist.GetSheHe|U] asks for #bold [struggling_colony.MakeScope.Var('colony_aid_cost').GetValue|0] gold#! to immediately give assistance and resume work."

 wilderness_colonization.0051.a:0 "Send the wagons with gold. Clear the way immediately."
 wilderness_colonization.0051.b:0 "We will pay, but [petitioning_colonist.GetFirstNameNoTooltip] will owe us a heavy debt."
 wilderness_colonization.0051.c:0 "They were granted land, not an endless draft on our treasury."

 colonize_aid_funded_tt:0 "#P The gold is dispatched; the obstacle is cleared and work on [struggling_colony.GetName] advances immediately.#!"
 colonize_aid_hook_tt:0 "#P You fund the clearance immediately and gain a Hook on [petitioning_colonist.GetShortUIName].#!"
 colonize_aid_refused_tt:0 "#N [petitioning_colonist.GetShortUIName] is denied funds, leaving the obstacle in place.#!"
 
 # --- The overseeing activity -----------------------------------------------------------------
 # Replaces oversee_colony_interaction, which could not hold a lord anywhere — see the note at the
 # top of common/activities/activity_types/00_oversee_colony_activity.txt.
 # CK3 derives TEN keys per activity from its name, and it names none of them anywhere — a missing
 # one shows the raw key in the planner rather than reporting anything. The list below is exactly
 # what ck3-tiger asked for; if a future patch adds an eleventh, tiger will say so.
 activity_oversee_colony:0 "Oversee a Colony"
 activity_oversee_colony_name:0 "Oversee a Colony"
 activity_oversee_colony_owner:0 "Overseen by [ROOT.Char.GetTitledFirstName]"
 activity_oversee_colony_selection_tooltip:0 "Ride out to one of our colonies and live there until the work is done."
 activity_oversee_colony_host_desc:0 "We will be living behind its palisade, not reading reports about it."
 activity_oversee_colony_guest_desc:0 "Nobody is invited. This is not a gathering."
 activity_oversee_colony_guest_help_text:0 "A lord overseeing a colony brings no company. There is nowhere to put them."
 activity_oversee_colony_destination_selection:0 "Which of our colonies are we going to?"
 activity_oversee_colony_predicted_cost:0 "Nothing in coin. The price is the years."
 activity_oversee_colony_conclusion_desc:0 "The work here is done, or we are needed elsewhere. Either way the road home is a long one."
 TRAVEL_NAME_FOR_activity_oversee_colony:0 "Journey to the Colony"
 activity_oversee_colony_desc:0 "A colony renders nothing to a lord who has never seen it. Ride out, live behind its palisade, and it will render something — for as long as we are standing in it.\n\nWe will not be at court. What happens there in our absence is not something anyone out here will be able to tell us."
 activity_oversee_colony_province_desc:0 "A colony of ours, and a long way from anywhere. There is no hall here and nowhere to put a court."
 oversee_colony_intent:0 "Oversee the Work"
 oversee_colony_intent_desc:0 "We are not here to be entertained. We are here so that the work is inspected by whoever is paying for it, and so that disputes are settled the same week they are raised."
 phase_overseeing:0 "Overseeing the Work"
 phase_overseeing_desc:0 "We stay until there is something here worth leaving behind."
 colonize_oversee_must_hold_tt:0 "We must hold this colony ourselves"
 colonize_oversee_button_effect_tt:0 "Ride out and live in this colony until the work is done."



# --- Colony Buildings ---

# Logging/"Infrastructure"
 building_colony_timber_works_01:0 "Frontier Timber Works"
 building_colony_timber_works_01_desc:0 "A rudimentary logging camp and pit-saw shed. Working local timber on-site dramatically eases the burden of hauling dressed wood across the roadless wastes."
 building_type_colony_timber_works_01:0 "Timber Works"
 building_type_colony_timber_works_01_desc:0 "Local logging and stoneworks reducing settlement construction costs."
 building_colony_timber_works_02:0 "Colonial Sawmill & Masonry"
 building_colony_timber_works_02_desc:0 "Water-driven saws, drying racks, and lime kilns. The settlement no longer imports basic building materials, allowing steady growth and durable construction."
 building_type_colony_timber_works_02:0 "Timber Works"
 building_type_colony_timber_works_02_desc:0 "Local logging and stoneworks reducing settlement construction costs."

# Walls
building_colony_pallisade_01:0 "Frontier Palisade"
 building_colony_pallisade_01_desc:0 "Stakes cut from the nearest treeline, sharpened and driven deep into a shallow ditch. It will not stop an army, but it turns a raid into a decision, and a wolf pack into someone else's problem. The settlers sleep behind it because sleeping in front of it is worse."
 building_type_colony_pallisade_01:0 "Palisade"
 building_type_colony_pallisade_01_desc:0 "A wall of timber and earth thrown up around a young settlement. Cheap, quick, and temporary — when the colony grows into something worth defending properly, the palisade comes down and stone goes up in its place."
 building_colony_pallisade_02:0 "Colonial Palisade"
 building_colony_pallisade_02_desc:0 "The stakes have been replaced twice over, the ditch dug wider, and a walkway now runs the inner face so a handful of men can watch every approach. Gates are barred at dusk by habit rather than by order. What began as a fence has become the edge of somewhere."
 building_type_colony_pallisade_02:0 "Palisade"
 building_type_colony_pallisade_02_desc:0 "A wall of timber and earth thrown up around a young settlement. Cheap, quick, and temporary — when the colony grows into something worth defending properly, the palisade comes down and stone goes up in its place."

# Office
building_colony_office_01:0 "Colonial Bailiff's Office"
 building_colony_office_01_desc:0 "A modest timber office housing surveyors, tax scribes, and clerks to register claims, coordinate labor, and enforce the settlement's charter."
 building_type_colony_office_01:0 "Colonial Administration"
 building_type_colony_office_01_desc:0 "Administrative offices that oversee taxation, legal registry, and organized settlement growth."
 building_colony_office_02:0 "Colonial Magistrate & Registry"
 building_colony_office_02_desc:0 "A dedicated administrative seat with land registries, revenue ledgers, and court chambers to govern local commerce and drive regional development."
 building_type_colony_office_02:0 "Colonial Administration"
 building_type_colony_office_02_desc:0 "Administrative offices that oversee taxation, legal registry, and organized settlement growth."
 building_colony_office_03:0 "Grand Colonial Chancery"
 building_colony_office_03_desc:0 "A sprawling administrative complex housing ministries, exchequer clerks, and civil courts. By subsidizing incoming settlers and coordinating large-scale public works, the colony finally breaks through frontier stagnation to become a thriving regional capital."
 building_type_colony_office_03:0 "Colonial Administration"
 building_type_colony_office_03_desc:0 "Administrative offices that oversee taxation, legal registry, and organized settlement growth."

  # --- wilderness event 30 -----------------------------------------------------------------
 wilderness_colonization.0030.t:0 "Winter at the Palisade"
 
 wilderness_colonization.0030.desc.intro:0 "The wind howling through the timbers of [colony.GetName] brings no warmth from our halls at home. Outside the ditch, the frontier is turning white and merciless."
 
 wilderness_colonization.0030.desc.beasts:0 "\n\nHowls echo from the treeline every dusk. Driven by hunger, the beasts have grown bold enough to test the perimeter stakes, dragging off livestock and scattering our pickets."
 wilderness_colonization.0030.desc.bandits:0 "\n\nSmoke rises from the ridge where outlaws watch our gates. With our wagons stalled in the snow, they know our supplies are thin and have started harassing our woodcutters."
 wilderness_colonization.0030.desc.cold:0 "\n\nThe ground has frozen so deep that iron picks shatter against it. Without fuel enough to bank the longhouses through the dark weeks, frostbite is taking fingers and toes."
 wilderness_colonization.0030.desc.floods:0 "\n\nThe sleet and freezing melt have turned the lower compound into knee-deep black slurry. Foundations are sinking, and damp rot threatens what little grain remains."
 wilderness_colonization.0030.desc.fallback:0 "\n\nStores are running leaner than planned, and the settlers look to our quarters with anxious, hollow eyes."
 
 wilderness_colonization.0030.desc.outro:0 "\n\n[colony_foreman.GetTitledFirstName] stands by the brazier with grease-stained tally slates. #EMP 'We can spend our way through it, fight what’s outside, or bolt the doors and let the weak fall away.'#!"

 wilderness_colonization.0030.a:0 "Empty the treasury chests. No one freezes on our watch."
 wilderness_colonization.0030.b:0 "Rally the guard. We ride out to secure the perimeter ourselves!"
 wilderness_colonization.0030.c:0 "Bolt the granaries. The colony must survive, whatever the toll."

 wilderness_rationing_success_tt:0 "#P Supplies are distributed fairly, boosting development growth and loyalty.#!"
 wilderness_sortie_success_desc:0 "You drive off the threat, earning the awe of the settlers!"
 wilderness_sortie_fail_desc:0 "The sortie turns into a chaotic rout in the snow, leaving you battered."
 wilderness_hard_winter_tt:0 "#N Sacrifices are made; control is maintained at the cost of settler resentment.#!"

 settlement_well_provisioned:0 "Well-Provisioned Palisade"
 settlement_well_provisioned_desc:0 "Generous stores and relief funds kept this frontier settlement thriving through the deep cold."
 settlement_hardened_winter:0 "Grim Winter Discipline"
 settlement_hardened_winter_desc:0 "Strict rationing and iron discipline preserved the garrison, though the settlers remember who went without."

 # Follow-up A (Relief)
 wilderness_colonization.0031.t:0 "Warmth in the Deep Cold"
 wilderness_colonization.0031.desc:0 "The wagons made it through the drifts. Sacks of salted oats, cured meat, and dry split cordwood are unloaded into the palisade’s storehouses.\n\nFor the first time since the first snow fell, hearth-smoke rises from every chimney in [colony.GetName]. The settlers raise a cheer as we inspect the yards."
 wilderness_colonization.0031.a:0 "They will remember who fed them."

 # Follow-up B Success (Victory)
 wilderness_colonization.0032.t:0 "Horns in the Snow"
 wilderness_colonization.0032.desc:0 "The ambush caught them off guard. Steel bit into the gloom, and within an hour the perimeter was swept clean.\n\nWe return through the timber gates bloodied but triumphant, bearing trophies through the palisade. No one will test these walls again before spring."
 wilderness_colonization.0032.a:0 "Let the wild fear our banner."

 # Follow-up B Failure (Defeat)
 wilderness_colonization.0033.t:0 "Dragged from the Fray"
 wilderness_colonization.0033.desc:0 "The drifts were deeper than the scouts reported. The lines shattered, and in the freezing confusion the skirmish became a desperate retreat.\n\nOur guards drag us back behind the bolted timbers, gashed and feverish, while jeers and howls linger just beyond arrow-shot."
 wilderness_colonization.0033.a:0 "Bar the gates... call the healer."

 # Follow-up C (Grim Winter)
 wilderness_colonization.0034.t:0 "The Thaw"
 wilderness_colonization.0034.desc:0 "Spring arrives not with song, but with melting slush and silent graves. The granaries held, but the settlement has grown quieter.\n\nThose who survived look upon our quarters with cold, dutiful deference. The colony lives, but trust has been buried in the permafrost."
 wilderness_colonization.0034.a:0 "Order has a price."

  # --- Good Event 0040 ---
 wilderness_colonization.0040.t:0 "A Seam in the Strata"
 wilderness_colonization.0040.desc:0 "While digging drainage ditches beneath the northern palisade, pickaxes struck stone that rang like an anvil.\n\n[colony_foreman.GetTitledFirstName] brings samples to our tent: dense gray ashlar and veins of dark, workable iron ore. In country where every nail and cornerstone must be carted across roadless wastes, this is a fortune sleeping beneath our boots."
 wilderness_colonization.0040.a:0 "Quarry it all for the colony's walls and roads."
 wilderness_colonization.0040.b:0 "Smelt the ore into ingots for our realm treasury."

 # --- Bad Event 0041 ---
 wilderness_colonization.0041.t:0 "Ague in the Palisade"
 wilderness_colonization.0041.desc:0 "A foul gray damp has settled over the compound ditch, and with it comes the shuddering fever. Settlers lie bundled in damp wool, coughing blood and delirious with cold sweat.\n\nLiving in such cramped quarters, the contagion is only days away from reaching our personal guard."
 wilderness_colonization.0041.a:0 "Send for bark and wine remedies; isolate the sick."
 wilderness_colonization.0041.b:0 "Trust in God and our own blood to weather the season."
 wilderness_colonization.0041.c:0 "Torches to the infested huts. Drive the sick beyond the perimeter."

 wilderness_fever_contracted_desc:0 "The contagion takes hold in your chest, leaving you feverish and bedridden."
 wilderness_fever_resisted_desc:0 "Your robust constitution throws off the chill, though the camp suffers."

 colony_rich_seam:0 "Rich Stone & Ore Vein"
 colony_rich_seam_desc:0 "Local deposits of workable stone and iron make construction dramatically faster and cheaper."
 colony_purged_quarter:0 "Charred Quarters"
 colony_purged_quarter_desc:0 "The ruthless burning of infected huts curbed the fever, but left bitter resentment among surviving families."

 # vassal asks for money to complete colony
 wilderness_colonization.0050.t:0 "A Seat on the Frontier"
 wilderness_colonization.0050.desc:0 "A dust-stained messenger kneels before our dais, bearing a letter bearing the seal of [petitioning_colonist.GetTitledFirstName].\n\nThe ditch is cleared at [ready_colony.GetName], the palisade is reinforced, and the land is ready to support a proper fortress. Yet [petitioning_colonist.GetTitledFirstName] has exhausted their local levies and granaries reaching this threshold.\n\nThey ask for #bold [SCOPE.ScriptValue('promote_colony_cost')|0] gold#! to raise the castle walls and complete the colony's coming-of-age."
 
 wilderness_colonization.0050.a:0 "Send the gold. The seat shall be raised in our name."
 wilderness_colonization.0050.b:0 "We will pay, but [petitioning_colonist.GetFirstNameNoTooltip] will owe us a heavy debt."
 wilderness_colonization.0050.c:0 "If [petitioning_colonist.GetSheHe] cannot afford a hall, [petitioning_colonist.GetSheHe] can sleep in the palisade."

 colonize_petition_funded_tt:0 "#P [ready_colony.GetName] is immediately promoted to a full holding, earning deep vassal gratitude.#!"
 colonize_petition_hook_tt:0 "#P [ready_colony.GetName] is promoted, and you gain a Hook on [petitioning_colonist.GetTitledFirstName].#!"
 colonize_petition_refused_tt:0 "#N [petitioning_colonist.GetTitledFirstName] is left without funds, breeding resentment on the frontier.#!"
 
 # return home
return_home_from_colony_decision:0 "Return Home from the Colony"
 return_home_from_colony_decision_desc:0 "We have inspected the palisade, heard local disputes, and seen the ditch cleared. The frontier can manage without us for a time; it is time to return to our realm capital."
 return_home_from_colony_decision_tooltip:0 "Conclude your stay at the colony and journey back to court."
 return_home_from_colony_decision_confirm:0 "Pack the Carts"
 
 WILDERNESS_RETURN_HOME_BUTTON:0 "Return Home"
 colonize_return_home_button_effect_tt:0 "Conclude overseeing this settlement and journey back to your capital."
 
OVERSEE_COLONY_ACTIVITY_STATUS:0 "You are dwelling among the settlers, directing the expansion firsthand."
 OVERSEEING_THE_SETTLEMENT_TOOLTIP:0 "#T Overseeing the Settlement#!\n#positive @gold_icon! +2.0#! Monthly Income\n#negative @prestige_icon! -0.5#! Monthly Prestige\n\n#flavor The lord dwells in the palisade, directing the work firsthand.#!"
 SETTLEMENT_OVERSEEN_TOOLTIP:0 "#T Colony Growth#!\n#positive @development_icon! +15%#! Development Growth\n#positive @control_icon! +0.5#! Monthly Control Growth\n#positive +20#! County Opinion\n#positive -15%#! Construction Time\n\n#flavor A colony develops rapidly when its lord is present to govern it.#!"
 
 # --- Was promised colony, now what
 wilderness_colonization.0025.t: "The Pioneer's Charter"
 wilderness_colonization.0025.desc: "Years ago, when wagon axles cracked in the frozen mud and the expedition stood on the brink of turning back, a solemn pledge was sworn: #italic every family that endured the march would hold their own land in fee and freedom.#! \n\nToday, [finished_colony.GetNameNoTier] is wild no longer. Its palisades have been replaced by stone ramparts, and smoke rises from hundreds of steady hearths. A delegation of the original settlers—graybeards and the grown children of those who perished clearing the brush—now stands before the dais. \n\nIn their calloused hands, they hold the dispatch bearing your seal."
 wilderness_colonization.0025.a: "A lord's oath is the realm's bedrock. Grant them their charter."
 wilderness_colonization.0025.b: "Offer a purse of silver to every family in exchange for the charter."
 wilderness_colonization.0025.c: "They were hired laborers, not lords. Enforce standard feudal tithes."

 colonize_honor_charter_tt: "You grant freeholder rights to the pioneer families:\n$EFFECT_LIST_BULLET$Lightens holding taxes by #negative_value 15%#!\n$EFFECT_LIST_BULLET$Boosts Development Growth by #positive_value 25%#!\n$EFFECT_LIST_BULLET$Grants #positive_value +20#! Popular Opinion for 25 years"
 colonize_commute_charter_tt: "You buy out the settlers' charters with coin, avoiding popular unrest without sacrificing future tax rights."
 colonize_break_charter_tt: "You extract full feudal taxes, but betraying your word causes #negative_value severe unrest#!, drops Control by #negative_value 30#!, and gains #negative_value Tyranny#!."

 # Personally leading expedition
 # --- Player-Led Expedition Events ---
 wilderness_colonization.0026.t:0 "Scraping the Barrel"
 wilderness_colonization.0026.desc:0 "The wagons groan through the ruts, but they ride higher than they did three weeks ago.\n\nWe have miscalculated the road to [colony.GetName]. The damp has ruined two sacks of meal, the oxen are faltering, and the camp kettle yields only thin, watery broth.\n\nNobody has starved yet, but every eye in the camp watches our tent to see what their lord intends to do about it."
 wilderness_colonization.0026.a:0 "Pay local trappers from our campaign chest for dry stores."
 wilderness_colonization.0026.b:0 "Rouse the hunters. We will track and take game ourselves."
 wilderness_colonization.0026.c:0 "Tighten the belts. We march through it on half-rations."

 wilderness_colonization.0027.t:0 "Murmurs in the Mud"
 wilderness_colonization.0027.desc:0 "Three axletrees have snapped in two days, and the column has stalled before a rain-swollen crossing.\n\nA few of the older teamsters have begun arguing over the bearings, their voices rising over the rain. When a lord sleeps in the same mud as their wagoners, the distance that kept court quiet vanishes.\n\nThey are three months from home, cold to the marrow, and questioning who knows the way forward."
 wilderness_colonization.0027.a:0 "Remind them who leads this column—and whose banner they follow."
 wilderness_colonization.0027.b:0 "Step back. Let [expedition_soldier.GetFirstName] take command of the march."
 wilderness_colonization.0027.c:0 "Sit by their fire and hear out their council."

 wilderness_colonization.0028.t:0 "The Fires Turn Back"
 wilderness_colonization.0028.desc:0 "The night is bitter, and outside our tent a deputation of settlers waits in the frost.\n\nThey did not bring weapons, but they brought hollow faces and cold determination. A journey is one thing; marching toward a frozen bog where nothing waits for them is another.\n\n#EMP 'We are losing cattle every night, my [ROOT.Char.GetLadyLord],'#! their spokesman murmurs. #EMP 'If we die out here, what was it for? What is ours when we arrive?'#!"
 wilderness_colonization.0028.a:0 "Swear to them: every family who reaches the palisade receives their own freehold land."
 wilderness_colonization.0028.b:0 "Draw steel and bar the road back. You took an oath—you walk until we arrive."
 colonize_cannot_lead_already_holding_tt:0 "You cannot personally lead an expedition into the wilderness while already holding or overseeing a frontier colony."
 colonize_must_grant_colony_tt:0 "You hold as many direct colonies as you can support; you must invest [expedition_leader.GetShortUIName] with the title."
 
 # --- Crisis Root (0060) ---
 wilderness_colonization.0060.t: "Frontier in Chaos"
 wilderness_colonization.0060.desc: "Disaster has overtaken the outpost in [colony.GetNameNoTier]. The palisades stand undermanned, winter stores have been ransacked, and open mutiny brews among the cold, desperate settlers. \n\nWithout immediate intervention, the entire settlement will disintegrate and the wild will swallow what we spent years building."
 wilderness_colonization.0060.a: "Take command in person and enforce order with an iron fist!"
 wilderness_colonization.0060.b: "Dispatch supply wagons and hired mercenaries at once."
 wilderness_colonization.0060.c: "It is finished. Sound the retreat and abandon the post."
 
 wilderness_control_salvaged_desc: "You break the mutineers, rally the survivors, and secure the palisade."
 wilderness_control_lost_desc: "Your men are routed in the chaos, and the settlement burns around you."
 colonize_control_bought_tt: "Restores #positive_value 40#! County Control through relief stores and mercenary guards."
 colonize_abandon_colony_tt: "The outpost is abandoned and reverts to unclaimed wilderness."

 # --- Follow-up 0061 (Martial Success) ---
 wilderness_colonization.0061.t: "Iron Discipline"
 wilderness_colonization.0061.desc: "Steel solved what words could not. After making an example of the ringleaders and organizing daily patrols along the perimeter, fear and purpose have returned to [colony.GetNameNoTier]. The fires burn again, the watchtowers are manned, and the settlement stands firm."
 wilderness_colonization.0061.a: "Let none doubt our hold on this frontier."

 # --- Follow-up 0062 (Martial Defeat) ---
 wilderness_colonization.0062.t: "Blood in the Mud"
 wilderness_colonization.0062.desc: "The attempt to quell the disorder failed completely. Desperate deserters and wolves broke the cordon under the cover of night. Wounded and outmatched, the remnants of our forces had no choice but to join the retreat. [colony.GetNameNoTier] has been reclaimed by the wild."
 wilderness_colonization.0062.a: "A bitter and shameful defeat."

 # --- Follow-up 0063 (Gold / Mercenaries) ---
 wilderness_colonization.0063.t: "Relief and Steel"
 wilderness_colonization.0063.desc: "Grain carts escorted by hardened mercenaries rode into [colony.GetNameNoTier] just before the final collapse. Full bellies and armed guards quickly quieted the mutineers, putting the settlers back to work repairing the fences and digging ditches."
 wilderness_colonization.0063.a: "Coin well spent."

 # --- Follow-up 0064 (Abandonment) ---
 wilderness_colonization.0064.t: "The Abandoned Gate"
 wilderness_colonization.0064.desc: "The carts were packed, the stores burnt to deny them to bandits, and the exhausted settlers marched back to civilized lands. Behind them, the rotting timber palisade of [colony.GetNameNoTier] stands silent in the encroaching brush."
 wilderness_colonization.0064.a: "We leave it to the wolves."

