l_english:
 # ============ Orcish duel moves (Blood Challenge only) ============
 gen_bc_sc_orc.wait_and_hope: "Come on, then. Come on. I can wait all day."
 gen_bc_sc_orc.unsure_attack: "Uh... for the clan! Just #EMP die#!!"
 gen_bc_sc_orc.unsure_attack_non_fatal: "Uh... for the clan! Just #EMP yield#!!"
 gen_bc_sc_orc.hail_mary: "Nothing left to lose but teeth!"
 gen_bc_sc_orc.pocket_sand: "Eat some #EMP [sc_defender.Custom('GritType')]#!, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 gen_bc_sc_orc.nut_em: "Let's see how your skull likes my brow!"
 gen_bc_sc_orc.guard: "You'll break your [my_foe.Custom('signature_weapon')] on me first, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_orc.probing_attack: "Show me where it hurts, runt!"
 gen_bc_sc_orc.onslaught: "Blood for [myself.GetFaith.WarGodName]!"
 gen_bc_sc_orc.surprise_attack: "Watch the [myself.Custom('signature_weapon')], not the tusks!"
 gen_bc_sc_orc.surprise_attack_notusk: "Watch the [myself.Custom('signature_weapon')], not my knee!"
 gen_bc_sc_orc.taunt: "Is that a [my_foe.Custom('signature_weapon')] or a stirring spoon, [my_foe.Custom2('InsultNoun', ROOT.Char)]?"
 gen_bc_sc_orc.put_the_boot_in: "Down you go, and the boot after!"
 gen_bc_sc_orc.strict_guard: "Better [my_foe.GetWomenMen] than you have broken on me!"
 gen_bc_sc_orc.confident_attack: "Watch how #EMP I#! [myself.Custom('SignatureWeaponAction')] [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')]!"
 gen_bc_sc_orc.expert_onslaught: "Hit! Hit! #BER HIT!#!"
 gen_bc_sc_orc.attempt_disarm: "Drop it, or lose the hand!"
 gen_bc_sc_orc.lightning_assault: "Before the circle's even closed!"
 gen_bc_sc_orc.tire_opponent: "Swing all you like. I'll still be standing."
 gen_bc_sc_orc.reason_you_suck_speech: "Your mother was ashamed of you, [my_foe.GetFirstNameNoTooltip]. Your clan still is."
 gen_bc_sc_orc.technique_from_legend: "Grandsire swore this worked!"
 gen_bc_sc_orc.like_a_viper: "There! Your throat, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 gen_bc_sc_orc.martial_voice: "#EMP Down,#! whelp! This is #EMP my#! circle!"
 gen_bc_sc_orc.mocking_boast: "The clans sing of #EMP me#!. Who sings of you?"
 gen_bc_sc_orc.desert_warrior: "Sun's cooking you, [my_foe.GetFirstNameNoTooltip]. I was born in it."
 gen_bc_sc_orc.jungle_stalker: "You can't fight what you can't see!"
 gen_bc_sc_orc.open_terrain_expert: "Nowhere to hide out here, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_orc.rough_terrain_expert: "Rock and scree. This is #EMP my#! country!"
 gen_bc_sc_orc.forest_fighter: "These trees know my name, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_orc.raaargh: "#BER BLOOD! BLOOD!#!"
 gen_bc_sc_orc.hard_grit: "Scars teach better than masters!"
 gen_bc_sc_orc.butchery: "Hold still. I'll carve you proper."
 gen_bc_sc_orc.blade_dance: "Let the clans remember #EMP this#!!"
 gen_bc_sc_orc.blade_dance_unlanded: "Let the clans remember #EMP this#!!"
 gen_bc_sc_orc.wrath_of_highgod: "Ancestors and [myself.GetFaith.WarGodName], see me now!"
 gen_bc_sc_orc.hurt_me_better: "Is that all? #EMP Hit me harder!#!"
 gen_bc_sc_orc.special_fallback: "Down in the dirt with you!"
 gen_bc_sc_orc.something_to_hide: "You owe me, [my_foe.GetFirstNameNoTooltip]. Remember that."
 gen_bc_sc_orc.tt_wait_and_hope: "#BOL Stand Your Ground:#! you plant your feet and wait for [my_foe.GetFirstNameNoTooltip] to make the first mistake"
 gen_bc_sc_orc.tt_unsure_attack: "#BOL Clumsy Swing:#! you swing, and hope"
 gen_bc_sc_orc.tt_enthusiastic_onslaught: "#BOL Wild Charge:#! you charge in head-down, swinging at anything that moves"
 gen_bc_sc_orc.tt_hail_mary: "#BOL Last Roar:#! there's nothing for it but a bellow to the ancestors and a wild swing"
 gen_bc_sc_orc.tt_pocket_sand: "#BOL Dirt in the Eyes:#! you kick a spray of [sc_defender.Custom('GritType')] into [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')]"
 gen_bc_sc_orc.tt_nut_em: "#BOL Brow-Breaker:#! you get inside [my_foe.GetFirstNamePossessiveNoTooltip] guard and drive your heavy brow into [my_foe.GetHerHis] [my_foe.Custom('MaskFace')]"
 gen_bc_sc_orc.tt_guard: "#BOL Hold the Line:#! you focus on holding off [my_foe.GetFirstNameNoTooltip]"
 gen_bc_sc_orc.tt_probing_attack: "#BOL Testing Blows:#! you hammer at [my_foe.GetFirstNamePossessiveNoTooltip] guard, looking for the weak spot"
 gen_bc_sc_orc.tt_onslaught: "#BOL Onslaught:#! you drive [my_foe.GetFirstNameNoTooltip] back with blow after blow"
 gen_bc_sc_orc.tt_surprise_attack: "#BOL Tusk Gore:#! while [my_foe.GetFirstNameNoTooltip] watches your weapon, you drive your tusks into [my_foe.GetHerHim]"
 gen_bc_sc_orc.tt_surprise_attack_notusk: "#BOL Low Blow:#! while [my_foe.GetFirstNameNoTooltip] watches your weapon, you drive a knee into [my_foe.GetHerHim]"
 gen_bc_sc_orc.tt_taunt: "#BOL Jeer:#! you play to the crowd, mocking [my_foe.GetFirstNameNoTooltip] until [my_foe.GetSheHe] loses [my_foe.GetHerHis] temper"
 gen_bc_sc_orc.tt_put_the_boot_in: "#BOL Stomp:#! a heavy blow, then your full weight on [my_foe.GetFirstNamePossessiveNoTooltip] knee"
 gen_bc_sc_orc.tt_strict_guard: "#BOL Iron Hide:#! you tuck in and let [my_foe.GetFirstNameNoTooltip] batter at you"
 gen_bc_sc_orc.tt_confident_attack: "#BOL Proven Hand:#! you strike like someone who has done this many times before"
 gen_bc_sc_orc.tt_expert_onslaught: "#BOL Storm of Blows:#! a flurry of strikes that leaves [my_foe.GetFirstNameNoTooltip] no time to breathe"
 gen_bc_sc_orc.tt_attempt_disarm: "#BOL Wrench Free:#! you grab [my_foe.GetFirstNamePossessiveNoTooltip] wrist and try to tear the weapon out of it"
 gen_bc_sc_orc.tt_lightning_assault: "#BOL First Blood:#! you go for [my_foe.GetFirstNameNoTooltip] before [my_foe.GetSheHe] has found [my_foe.GetHerHis] feet"
 gen_bc_sc_orc.tt_tire_opponent: "#BOL Outlast:#! you give ground and let [my_foe.GetFirstNameNoTooltip] wear [my_foe.GetHerselfHimself] out"
 gen_bc_sc_orc.tt_reason_you_suck_speech: "#BOL Blood Insult:#! you tell the whole circle everything wrong with [my_foe.GetFirstNamePossessiveNoTooltip] bloodline"
 gen_bc_sc_orc.tt_technique_from_legend: "#BOL Grandsire's Trick:#! you try a move from a story the elders tell"
 gen_bc_sc_orc.tt_like_a_viper: "#BOL Snap at the Gap:#! you strike at a momentary weak point in [my_foe.GetFirstNamePossessiveNoTooltip] guard"
 gen_bc_sc_orc.tt_martial_voice: "#BOL Warchief's Bellow:#! you roar at [my_foe.GetFirstNameNoTooltip] like a warchief at an unruly whelp"
 gen_bc_sc_orc.tt_mocking_boast: "#BOL Boast:#! you remind the circle whose name they know, and whose they don't"
 gen_bc_sc_orc.tt_terrain_expert: "#BOL Home Ground:#! you know this ground, and [my_foe.GetFirstNameNoTooltip] does not"
 gen_bc_sc_orc.tt_raaargh: "#BOL Blood Frenzy:#! the red haze takes you. You stop feeling the blows"
 gen_bc_sc_orc.tt_hard_grit: "#BOL Old Scars:#! you fight like someone who has survived worse"
 gen_bc_sc_orc.tt_butchery: "#BOL Butcher's Work:#! you make a show of how much of this you've done before"
 gen_bc_sc_orc.tt_blade_dance: "#BOL Circle Showman:#! flashy moves, to give the crowd a fight they'll talk about for years"
 gen_bc_sc_orc.tt_wrath_of_highgod: "#BOL The Ancestors Watch:#! with a roar to the ancestors, you throw everything you have at [my_foe.GetFirstNameNoTooltip]"
 gen_bc_sc_orc.tt_hurt_me_better: "#BOL Scar-Hungry:#! relishing the pain, you lean in to [my_foe.GetFirstNamePossessiveNoTooltip] attacks for advantage"
 gen_bc_sc_orc.tt_special_fallback: "#BOL Leg Sweep:#! you kick [my_foe.GetFirstNamePossessiveNoTooltip] legs out from under [my_foe.GetHerHim]"
 gen_bc_sc_orc.tt_something_to_hide: "#BOL Blood Debt:#! you remind [my_foe.GetFirstNameNoTooltip] of the [hook|E] you hold over [my_foe.GetHerHim]"

 # ============ Vanilla wording, copied verbatim as the fallback ============
 # From game/localization/english/single_combat_events_l_english.yml (1.19.0.6). Re-copy after a patch
 # that rewrites any of them.
 gen_bc_sc_vanilla.wait_and_hope: "Maybe if I wait, [my_foe.GetSheHe]'ll trip on [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')]?"
 gen_bc_sc_vanilla.unsure_attack: "Uh, have at thee! Just #EMP die#!!"
 gen_bc_sc_vanilla.unsure_attack_non_fatal: "Uh, have at thee! Just #EMP yield#!!"
 gen_bc_sc_vanilla.hail_mary: "Fighting someone so skilled means I've got nothing to lose!"
 gen_bc_sc_vanilla.pocket_sand: "How about some #EMP [sc_defender.Custom('GritType')]#! in your [my_foe.Custom('EyeEyes')]? #EMP Huyah!#!"
 gen_bc_sc_vanilla.nut_em: "Let's see how you like a skulling!"
 gen_bc_sc_vanilla.guard: "You'll never break my guard, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_vanilla.probing_attack: "You have to let your guard down eventually, coward!"
 gen_bc_sc_vanilla.onslaught: "Taste the wroth of [myself.GetFaith.WarGodName]!"
 gen_bc_sc_vanilla.surprise_attack: "[my_foe.GetSheHe|U]'ll never see this coming!"
 gen_bc_sc_vanilla.taunt: "Foolish [my_foe.Custom2('InsultNoun', ROOT.Char)], can't you do better?"
 gen_bc_sc_vanilla.put_the_boot_in: "A blow from my [myself.Custom('signature_weapon')], and a kick to gut!"
 gen_bc_sc_vanilla.strict_guard: "Better [my_foe.GetWomenMen] than you have died trying to break my guard!"
 gen_bc_sc_vanilla.confident_attack: "I'll show you how #EMP I#! [myself.Custom('SignatureWeaponAction')] [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')]!"
 gen_bc_sc_vanilla.expert_onslaught: "Strike! #EMP Parry!#! #BER Riposte!#!"
 gen_bc_sc_vanilla.attempt_disarm: "Let's see how you do without your [my_foe.Custom('signature_weapon')]!"
 gen_bc_sc_vanilla.lightning_assault: "Attack first, attack hard! #EMP En garde!#!"
 gen_bc_sc_vanilla.tire_opponent: "That the best you've got? You can't even hit me!"
 gen_bc_sc_vanilla.reason_you_suck_speech: "You know what your problem is [my_foe.GetFirstNameNoTooltip]? No? Well..."
 gen_bc_sc_vanilla.technique_from_legend: "This'll work just like it does in the legends, right?"
 gen_bc_sc_vanilla.like_a_viper: "An opening! Try my steel, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 gen_bc_sc_vanilla.martial_voice: "#EMP Maggot!#! You think you can stand against #EMP me#!?"
 gen_bc_sc_vanilla.mocking_boast: "#EMP You#! think you can beat someone as famous as #EMP me#!?"
 gen_bc_sc_vanilla.desert_warrior: "Heat getting to you, [my_foe.GetFirstNameNoTooltip]? Weakling!"
 gen_bc_sc_vanilla.jungle_stalker: "I am one with the jungle's shadows!"
 gen_bc_sc_vanilla.open_terrain_expert: "With this much room to move, you're dead meat, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_vanilla.rough_terrain_expert: "Hills, fens, mountains, this is all #EMP my#! domain!"
 gen_bc_sc_vanilla.forest_fighter: "These are #EMP my#! woods, [my_foe.GetFirstNameNoTooltip]!"
 gen_bc_sc_vanilla.raaargh: "#BER RAAARGH!#!"
 gen_bc_sc_vanilla.hard_grit: "Let me show you how a #EMP professional#! fights!"
 gen_bc_sc_vanilla.butchery: "Methinks I need to make an #EMP example#! of you..."
 gen_bc_sc_vanilla.blade_dance: "I'm the fastest blade in [myself.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 gen_bc_sc_vanilla.blade_dance_unlanded: "I'm the fastest blade of the [myself.GetCulture.GetCollectiveNounNoTooltip]!"
 gen_bc_sc_vanilla.wrath_of_highgod: "For [myself.GetFaith.HighGodNameAlternate] and [myself.GetFaith.WarGodName], suffer blasphemer!"
 gen_bc_sc_vanilla.hurt_me_better: "#EMP Mmmmm#!, you think #EMP that#! hurts? I'll show you pain!"
 gen_bc_sc_vanilla.special_fallback: "To the floor with you!"
 gen_bc_sc_vanilla.something_to_hide: "Have you forgotten your #EMP debt#! to me, [my_foe.GetFirstNameNoTooltip]?"
 gen_bc_sc_vanilla.tt_wait_and_hope: "#BOL Wait & Hope:#! you stay still, patiently hoping that [my_foe.GetFirstNameNoTooltip] just makes a mistake"
 gen_bc_sc_vanilla.tt_unsure_attack: "#BOL Unsure Attack:#! you try, badly, to attack"
 gen_bc_sc_vanilla.tt_enthusiastic_onslaught: "#BOL Enthusiastic Onslaught:#! you charge in, swinging wildly"
 gen_bc_sc_vanilla.tt_hail_mary: "#BOL Hail Mary:#! there's nothing for it but a prayer and a wild attack"
 gen_bc_sc_vanilla.tt_pocket_sand: "#BOL Clouded Vision:#! you toss a handful of [sc_defender.Custom('GritType')] at [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')]"
 gen_bc_sc_vanilla.tt_nut_em: "#BOL Headbutt:#! you try to get inside [my_foe.GetFirstNamePossessiveNoTooltip] guard and headbutt [my_foe.GetHerHim] in the [my_foe.Custom('MaskFace')]"
 gen_bc_sc_vanilla.tt_guard: "#BOL Guard:#! you focus on holding off [my_foe.GetFirstNameNoTooltip]"
 gen_bc_sc_vanilla.tt_probing_attack: "#BOL Probing Attack:#! cautiously but firmly, you test the strength of [my_foe.GetFirstNamePossessiveNoTooltip] guard"
 gen_bc_sc_vanilla.tt_onslaught: "#BOL Onslaught:#! you harry [my_foe.GetFirstNameNoTooltip] with a furious onslaught"
 gen_bc_sc_vanilla.tt_surprise_attack: "#BOL Surprise Attack:#! you attack from an unexpected angle"
 gen_bc_sc_vanilla.tt_taunt: "#BOL Taunt:#! you try to provoke [my_foe.GetFirstNameNoTooltip] into make a mistake"
 gen_bc_sc_vanilla.tt_put_the_boot_in: "#BOL Put the Boot In:#! you combine a heavy attack with an unexpected kick to [my_foe.GetFirstNamePossessiveNoTooltip] vitals"
 gen_bc_sc_vanilla.tt_strict_guard: "#BOL Strict Guard:#! you focus entirely on fending off [my_foe.GetFirstNameNoTooltip]"
 gen_bc_sc_vanilla.tt_confident_attack: "#BOL Confident Attack:#! with skill and poise, you make a series of well-placed strikes"
 gen_bc_sc_vanilla.tt_expert_onslaught: "#BOL Expert Onslaught:#! you throw out a flurry of rapid attacks and counters"
 gen_bc_sc_vanilla.tt_attempt_disarm: "#BOL Attempt Disarm:#! with a powerful blow, you try to remove [my_foe.GetFirstNamePossessiveNoTooltip] weapon"
 gen_bc_sc_vanilla.tt_lightning_assault: "#BOL Lightning Assault:#! you try to overwhelm [my_foe.GetFirstNameNoTooltip] at the start of the bout"
 gen_bc_sc_vanilla.tt_tire_opponent: "#BOL Tire Opponent:#! playing defensively for time, you allow [my_foe.GetFirstNameNoTooltip] to tire [my_foe.GetHerselfHimself] while you stay fresh"
 gen_bc_sc_vanilla.tt_reason_you_suck_speech: "#BOL Disheartening Speech:#! you launch into a blistering spiel about [my_foe.GetFirstNamePossessiveNoTooltip] failings"
 gen_bc_sc_vanilla.tt_technique_from_legend: "#BOL Legendary Technique:#! you try to copy a famous move from your favorite book"
 gen_bc_sc_vanilla.tt_like_a_viper: "#BOL Like a Viper:#! with immense speed, you strike at a momentary weak-point in [my_foe.GetFirstNamePossessiveNoTooltip] guard"
 gen_bc_sc_vanilla.tt_martial_voice: "#BOL In Command:#! you try to intimidate [my_foe.GetFirstNameNoTooltip] as though [my_foe.GetSheHe] were one of your soldiers"
 gen_bc_sc_vanilla.tt_mocking_boast: "#BOL Mocking Boast:#! you make fun of [my_foe.GetFirstNamePossessiveNoTooltip] poor [prestige_level|E]"
 gen_bc_sc_vanilla.tt_terrain_expert: "#BOL Master of Terrain:#! your expert knowledge of the local terrain stands you in good stead"
 gen_bc_sc_vanilla.tt_raaargh: "#BOL Berserkergang:#! rip and tear! RIP AND TEAR! #BER RIP AND TEAR!#!"
 gen_bc_sc_vanilla.tt_hard_grit: "#BOL Hard Grit:#! bringing your experience to bear, you lay down a battery of determined attacks"
 gen_bc_sc_vanilla.tt_butchery: "#BOL Butchery:#! you make a show of your cruel skills as a raider"
 gen_bc_sc_vanilla.tt_blade_dance: "#BOL Blade Dance:#! a series of flashy, expert moves ensure your dueling prowess will be talked about for years"
 gen_bc_sc_vanilla.tt_wrath_of_highgod: "#BOL Divine Wrath:#! with a shouted prayer, you humble yourself before [myself.GetFaith.HighGodName]"
 gen_bc_sc_vanilla.tt_hurt_me_better: "#BOL Fueled by Pain:#! relishing the pain, you lean in to [my_foe.GetFirstNamePossessiveNoTooltip] attacks for advantage"
 gen_bc_sc_vanilla.tt_special_fallback: "#BOL Unstable Foundations:#! you kick [my_foe.GetFirstNameNoTooltip] in the shin"
