l_english:
 # ============ World-Weary trait ============
 trait_world_weary: "World-Weary"
 trait_world_weary_desc: "The long-lived do not break as mortals do. They simply begin, one century at a time, to set the world down."
 trait_world_weary_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has seen too many springs to be surprised by another. Little by little, [ROOT.GetCharacter.GetSheHe] is setting the world down."
 trait_track_world_weary: "World-Weary"
 trait_track_world_weary_desc: "Each passing year weighs a little more, and matters a little less."
 TRAIT_FLAG_DESC_world_weary_yearly_xp_gain: "\n@time_icon!#help This [trait_level_track|E] deepens with the passing years#!"

 # ============ Death reason ============
 death_fading:0 "faded from the world"

 # ============ Feed message ============
 gen_world_weary_deepens_message_title: "The World Grows Distant"

 # ============ Onset: The Weight of Centuries ============
 gen_aging.0001.t: "The Weight of Centuries"
 gen_aging.0001.desc: "It arrives without herald or hour: a morning on which the light through the leaves looks exactly as it did a hundred years ago, and the sameness is heavier than any grief. The faces around me are dear, and yet I find I am watching them from a slight remove, as one watches a river — fond of the water, certain it will pass.\n\nMy people do not wither. We are not taken. But I understand now what the old ones meant when they said the world is a garment, and that one day it simply grows loose upon the shoulders."
 gen_aging.0001.a: "Then I will wear it lightly."
 gen_aging.0001.b: "Not yet. There is work unfinished."

 # ============ The Fading ============
 gen_aging.0002.t: "The Fading"
 gen_aging.0002.desc: "There is no pain. That is the first thing to know, and the last kindness of a long life: there is no pain.\n\nThe world has grown thin as worn linen, and the light behind it very bright. Names I have carried for centuries lie down gently, one by one, like tools at the end of a day's labor. Somewhere close by, someone is weeping; somewhere further, spring is arriving without my help, as it always did.\n\nIt is time to set the garment down."
 gen_aging.0002.a: "I am ready."

