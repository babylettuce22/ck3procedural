l_english:
 # ============ World-Weary trait ============
 trait_world_weary: "World-Weary"
 trait_world_weary_desc: "The long-lived do not break as mortals do. They simply begin, one century at a time, to set the world down."
 trait_world_weary_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has seen too many springs to be surprised by another. Little by little, [ROOT.GetCharacter.GetSheHe] is setting the world down."
 trait_track_world_weary: "World-Weary"
 trait_track_world_weary_desc: "Each passing year weighs a little more, and matters a little less."
 TRAIT_FLAG_DESC_world_weary_yearly_xp_gain: "\n@time_icon!#help This [trait_level_track|E] deepens with the passing years#!"

 # ============ Death reason ============
 death_fading:0 "faded from the world"

 # ============ Feed message ============
 gen_world_weary_deepens_message_title: "The World Grows Distant"
 gen_dwarf_age_catches_up_message_title: "Age Catches Up"

 # ============ Onset: The Weight of Centuries ============
 gen_aging.0001.t: "The Weight of Centuries"
 gen_aging.0001.desc: "It arrives without herald or hour: a morning on which the light through the leaves looks exactly as it did a hundred years ago, and the sameness is heavier than any grief. The faces around me are dear, and yet I find I am watching them from a slight remove, as one watches a river... fond of the water, certain it will pass.\n\nMy people do not wither. We are not taken. But I understand now what the old ones meant when they said the world is a garment, and that one day it simply grows loose upon the shoulders."
 gen_aging.0001.a: "Then I will wear it lightly."
 gen_aging.0001.b: "Not yet. There is work unfinished."

 # ============ The Fading ============
 gen_aging.0002.t: "The Fading"
 gen_aging.0002.desc: "There is no pain. That is the first thing to know, and the last kindness of a long life: there is no pain.\n\nThe world has grown thin as worn linen, and the light behind it very bright. Names I have carried for centuries lie down gently, one by one, like tools at the end of a day's labor. Somewhere close by, someone is weeping; somewhere further, spring is arriving without my help, as it always did.\n\nIt is time to set the garment down."
 gen_aging.0002.a: "I am ready."

 # ============ Not Yet (the one reprieve) ============
 gen_aging.0003.t: "Not Yet"
 gen_aging.0003.desc: "Your breath has grown shallow and the light seems very far away. Your household has started speaking quietly around you, the way people speak in a sickroom.\n\n"
 gen_aging.0003.desc.ambitious: "But there are plans of yours still unfinished, and you are not willing to leave them to someone else. You get up."
 gen_aging.0003.desc.stubborn: "But you have never once done a thing because it was expected of you, and you will not start now. You get up."
 gen_aging.0003.a: "Not yet."
 gen_aging.0003.a.tt: "[GetTrait('world_weary').GetName( GetNullCharacter )] falls back to its second level: about #P ten more years#!.\nThis can only happen once."

 # ============ A Late Child ============
 gen_aging.0010.t: "A Late Child"
 gen_aging.0010.desc.elf: "Human women stop bearing children in their forties. Elven women do not, though a late child is rare among elves, and they say one only comes when both parents truly want it.\n\n"
 gen_aging.0010.desc.dusk_elf: "Like all elven women, dusk elf women can bear children for decades after a human woman could not. It seldom happens, and the dusk elves say it never happens by accident.\n\n"
 gen_aging.0010.desc.dwarf: "Dwarven women bear children later in life than human women do, though not much later and not often. Among dwarves, a late child is taken as a good sign for a house.\n\n"
 gen_aging.0010.desc.mother: "Lately you have found yourself wanting another child. When you raised it with [father.GetFirstName], [father.GetSheHe] did not say no. The decision is yours."
 gen_aging.0010.desc.father: "Last night [mother.GetFirstName] told you that [mother.GetSheHe] has been thinking about another child. [mother.GetSheHe|U] is still able to have one, and [mother.GetSheHe] wants to know what you think."
 gen_aging.0010.desc.no_children: "\n\nThe two of you have no living children. If you want an heir of your own blood, this may be the best chance you will get."
 gen_aging.0010.desc.many_children: "\n\nThe house is already full of children and grandchildren. Another would be one more to raise, feed and provide for."
 gen_aging.0010.desc.some_children: "\n\nYour children are grown or nearly so. Another would be many years younger than the rest."
 gen_aging.0010.a: "Then let us have one more."
 gen_aging.0010.b: "Let it come if it comes."
 gen_aging.0010.b.success: "A Child on the Way"
 gen_aging.0010.b.failure: "No Child Comes"
 gen_aging.0010.b.failure.desc: "The seasons turn and [mother.GetFirstName] does not conceive. Neither of you is much surprised."
 gen_aging.0010.c: "No. Let the chance pass."
 gen_late_child_fertility_modifier: "A Late Child"
 gen_late_child_fertility_modifier_desc: "Long past the age when most women stop bearing children, this character has conceived once more."

