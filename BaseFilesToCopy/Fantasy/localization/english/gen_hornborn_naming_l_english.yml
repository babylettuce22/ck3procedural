 # ============ Secret ============
 secret_gen_hidden_horns:0 "Hidden Horns"
 secret_gen_hidden_horns_desc:0 "[secret_owner.GetFirstName] has been hiding that [TARGET_CHARACTER.GetFirstName] was born Hornborn: the buds trimmed, the cap never off."
 secret_gen_hidden_horns_tooltip_desc:0 "This character is hiding that a child of theirs was born Hornborn."
