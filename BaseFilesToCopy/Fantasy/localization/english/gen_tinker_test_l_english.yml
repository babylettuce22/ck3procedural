l_english:
 # Gnome Tinkering: the workbench (gen_tinker.0010), the test (0300s) and the outcome (0350).
 # Events: events/gen_tinker_test_events.txt. Effects: common/scripted_effects/00_gen_tinker_outcome_effects.txt.

 # ============ 0010 The Workbench ============
 gen_tinker.0010.t: "The Workbench"
 gen_tinker.0010.desc: "The workbench has been cleared, mostly. The lamps are trimmed, the tools laid out in the order only you understand, and a stack of fresh paper waits for the first drawing.\n\nAll that is left is to decide what to build. Every choice costs good gold before the first gear is cut, and none of them is certain to work."
 gen_tinker.0010.a: "A clockwork curio. Something beautiful and completely unnecessary."
 gen_tinker.0010.a.tt: "If it works: a clockwork curio for your treasury, a brass songbird trinket (or, for a ruler with a royal court and the Fate of Iberia art, an orrery for the throne room) that raises #V Learning#!, with #V Prestige#! for the songbird or #V Court Grandeur#! for the orrery. A masterwork is rarer and stronger"
 gen_tinker.0010.b: "Waterworks. Wheels, sluices, pumps: the fields will thank me."
 gen_tinker.0010.b.tt: "If it works: waterworks on your capital county for #V 20 years#!: #P +15%#! development growth and #P +5%#! tax. A masterwork: #P +30%#!, #P +10%#! and #P +5#! county opinion"
 gen_tinker.0010.c: "A war engine. Let the next castle wall see what a gnome can throw."
 gen_tinker.0010.c.tt: "If it works: for #V 10 years#!, #P +20%#! siege value and #P 10%#! faster siege phases. A masterwork: #P +35%#!, #P 15%#! faster, and #P +5%#! army damage"
 gen_tinker.0010.d: "A clockwork limb. For myself, since nobody else will make one properly."
 gen_tinker.0010.d.tt: "If it works: a clockwork hand (for a maimed maker) or leg (for a one-legged one) that gives back about #P half#! of what the injury takes. A masterwork gives back more — most of the strength and poise, if not quite all the finer skills. The injury itself remains"
 gen_tinker.0010.e: "A grand invention. The one I have been saving."
 gen_tinker.0010.e.tt: "Needs #V 18 Learning#!, or to be a #V Master Artificer#!.\nIf it works: #P +100#! prestige, and your people's current fascination moves #P 10%#! of the way along. A masterwork: #P +200#! and #P 20%#!. If your people are not pursuing an innovation, the prestige is doubled instead"
 gen_tinker.0010.f: "Not now. The bench can wait."
 gen_tinker.0010.f.tt: "Nothing is built, and nothing is spent"

 # ============ The test: what each project's test is ============
 gen_tinker.0300.project.curio: "\n\nThe curio sits under a cloth on a velvet cushion. When the cloth comes off and the key is turned, it will either do the charming thing it was built to do, or it will not."
 gen_tinker.0300.project.mill: "\n\nDown at the river the new waterworks stand ready: wheel, race, sluice gate and a great deal of hopeful carpentry. Someone has to open the gate and let the water in."
 gen_tinker.0300.project.engine: "\n\nOut in the field the war engine squats on its timbers, aimed at a fortress built of hay bales and one old door. It has been loaded. It has never been fired."
 gen_tinker.0300.project.limb: "\n\nThe clockwork limb lies on the table, oiled and wound, next to the straps that will hold it on. The only way to test a limb is to wear it."
 gen_tinker.0300.project.invention: "\n\nThe invention stands in the hall under three sheets and a rope. Scholars have been invited to see it demonstrated. Several of them came mostly to watch it fail."
 gen_tinker.0300.patron: "\n\nIt was made for [ROOT.Char.MakeScope.Var('gen_tk_patron').Char.GetShortUIName], who paid for it and will expect it to work."
 gen_tinker.0300.tweaked: "\n\nThe last adjustment is made. It is better now, you are nearly sure. It is also wound a good deal tighter."

 # ============ The test: options shared by the scenes ============
 gen_tinker.0300.self: "Stand back. I'll pull the lever myself."
 gen_tinker.0300.apprentice: "[gen_tk_apprentice_char.GetFirstName], you've earned this. Pull the lever."
 gen_tinker.0300.court: "Fetch the whole court! They should see this."
 gen_tinker.0300.tweak: "Wait. One last adjustment."
 gen_tinker.0300.night: "We'll test it tonight, when nobody is watching."
 gen_tk_test_stakes_normal.tt: "Prestige riding on the test: #P +150#! for a masterwork, #P +75#! if it works, #N -50#! for a dud, #N -100#! if it blows up"
 gen_tk_test_stakes_court.tt: "With the whole court watching, the prestige riding on the test is doubled: #P +300#! for a masterwork, #P +150#! if it works, #N -100#! for a dud, #N -200#! if it blows up"
 gen_tk_test_stakes_night.tt: "With nobody watching, the prestige riding on the test is halved: #P +75#! for a masterwork, #P +38#! if it works, #N -25#! for a dud, #N -50#! if it blows up"
 gen_tk_test_apprentice_lever.tt: "[gen_tk_apprentice_char.GetShortUIName] stands at the lever: if it blows up, #N [gen_tk_apprentice_char.GetSheHe] takes the blast#! instead of you. If it works, [gen_tk_apprentice_char.GetSheHe] learns more from it"
 gen_tk_test_tweak.tt: "You will come back to the test afterwards, with the new odds"

 # ============ 0310 Test Day ============
 gen_tinker.0310.t: "Test Day"
 gen_tinker.0310.desc: "Months of work come down to this morning. Every bolt has been checked twice, every spring wound and every gear greased. You have run out of things to check."

 # ============ 0311 A Cracked Part ============
 gen_tinker.0311.t: "A Cracked Part"
 gen_tinker.0311.desc: "Something went "ping" in the workshop last night. This morning you found it: a hairline crack in a part that is very much load-bearing. It might hold. It might not. You can go ahead as it is, or take the day to mend it."
 gen_tinker.0311.desc.mended: "The cracked part has been taken out, recast and fitted again. It took the whole day and most of your temper, but it is sound now."
 gen_tinker.0311.fix: "Stop everything. We mend it properly."

 # ============ 0312 Word Has Got Out ============
 gen_tinker.0312.t: "Word Has Got Out"
 gen_tinker.0312.desc: "You meant to test it quietly. Somebody talked. By mid-morning half the court has found a reason to be standing near your workshop, and the other half has brought a picnic."
 gen_tinker.0312.self: "Well, since you're all here. Stand back!"
 gen_tinker.0312.apprentice: "[gen_tk_apprentice_char.GetFirstName], take a bow and pull the lever."
 gen_tinker.0312.night: "Go home, all of you. There is nothing to see. (Until tonight.)"

 # ============ 0350 The outcome ============
 gen_tinker.0350.t.masterwork: "A Masterwork!"
 gen_tinker.0350.t.works: "It Works!"
 gen_tinker.0350.t.dud: "A Dud"
 gen_tinker.0350.t.explodes: "It Blew Up"

 gen_tinker.0350.curio.masterwork: "The key turns, the cloth comes off, and the curio comes to life. It sings, it turns, it opens its little brass wings, and then it does a thing you did not build it to do and cannot quite explain, which is even better. Grown knights gasp. Somebody asks if it is alive. You say no, probably."
 gen_tinker.0350.curio.works: "The key turns and the curio does exactly what it was built to do: it ticks, it whirrs, it sings its three notes. Not always in the right order, but nobody who is not a gnome notices."
 gen_tinker.0350.curio.dud: "The key turns. Nothing happens. The key turns again. There is a small, sad click from somewhere inside, and then nothing at all. It will make a fine paperweight."
 gen_tinker.0350.curio.explodes: "The key turns, and turns, and keeps turning on its own, faster and faster, until the curio leaves the cushion in several directions at once. A spring is found three days later embedded in a tapestry."
 gen_tinker.0350.mill.masterwork: "The sluice gate opens, the race fills, and the great wheel turns as if it had always been there. Water climbs to fields that have never seen it. By the end of the week the millers have stopped arguing with you and started bringing you cheese."
 gen_tinker.0350.mill.works: "The sluice gate opens and the wheel creaks, groans and then turns. Water goes more or less where it was meant to. The farmers say it will do, which from farmers is a standing ovation."
 gen_tinker.0350.mill.dud: "The sluice gate opens and the water goes everywhere except into the race. The wheel sits dry and dignified while the ducks enjoy their new pond. The works will not be used."
 gen_tinker.0350.mill.explodes: "The sluice gate opens, the wheel spins up, and the pump behind it tears itself off its bolts with a noise like a cathedral falling over. The river carries the pieces away. It also carries away the bridge."
 gen_tinker.0350.engine.masterwork: "The arm swings, the stone flies, and the hay-bale fortress simply stops existing. So does the old door, and the fence behind it. The captains stare at the smoking field and start asking how soon you can build another."
 gen_tinker.0350.engine.works: "The arm swings with a crack you feel in your teeth and the stone lands square in the middle of the hay-bale fortress. Hay goes everywhere. The captains look impressed, and a little worried about the next castle."
 gen_tinker.0350.engine.dud: "The arm swings, the stone drops straight down, and it lands six feet in front of the engine with a gentle thud. The hay-bale fortress remains undefeated. The captains are very polite about it."
 gen_tinker.0350.engine.explodes: "The arm swings, the engine does not, and for a moment the whole thing is in the air together. It comes down in splinters. The hay-bale fortress, untouched, is the only thing standing on the field."
 gen_tinker.0350.limb.masterwork: "The straps are buckled, the spring is wound, and the limb moves before the thought has quite finished. It grips, it bends, it bears weight, and it does not pinch. Nobody says anything for a long moment, which is the best thanks a tinkerer ever gets."
 gen_tinker.0350.limb.works: "The straps are buckled and the limb moves: stiffly, with a faint tick, but it moves where it is told and it holds. With practice it will be second nature. With oil it will be quieter."
 gen_tinker.0350.limb.dud: "The straps are buckled and the limb does nothing but hang there, heavy and polite. Something in the wrist mechanism has seized for good. It comes off again and goes back in its box."
 gen_tinker.0350.limb.explodes: "The straps are buckled, the spring is wound, and the spring unwinds all at once. The limb kicks, flails and throws itself across the room, taking a good deal of skin and a lamp with it."
 gen_tinker.0350.invention.masterwork: "The sheets come off, the invention does precisely what you said it would, and then keeps going. The scholars who came to watch it fail are taking notes. One of them asks to be your student. Letters about it will be going out before the week is over."
 gen_tinker.0350.invention.works: "The sheets come off and the invention works. It is loud, and it smells, and it works. The scholars argue about what it means, which is the surest sign that it means something."
 gen_tinker.0350.invention.dud: "The sheets come off, the handle turns, and the invention sits there being a large, expensive shape. The scholars nod gravely and say it is very interesting in principle. They say it all the way home."
 gen_tinker.0350.invention.explodes: "The sheets come off, the handle turns, and the invention demonstrates something no one expected, very quickly, and in every direction. When the smoke clears, the front row of scholars is considerably further back than it was."

 gen_tinker.0350.blast.self: "\n\nYou were at the lever, which is to say at the middle of it. You are hurt."
 gen_tinker.0350.blast.apprentice: "\n\n[gen_tk_apprentice_char.GetFirstName] was at the lever and took the worst of it. You were far enough away to be merely deafened."
 gen_tinker.0350.blast.both: "\n\nYou were at the lever, and [gen_tk_apprentice_char.GetFirstName] was close enough to catch some of it too. You are both hurt."
 gen_tinker.0350.blast.frightened: "\n\nYou were at the lever, and you are hurt. [gen_tk_apprentice_char.GetFirstName] was far enough away to escape with singed eyebrows and a bad fright."
 gen_tinker.0350.blast.burned_self: "\n\nThe burns on your face will not fade. You will carry this test with you for life."
 gen_tinker.0350.blast.burned_apprentice: "\n\nThe burns on [gen_tk_apprentice_char.GetFirstNamePossessive] face will not fade. [gen_tk_apprentice_char.GetSheHe|U] will carry them for life."
 gen_tinker.0350.blast.ruins: "\n\nThe workshop did not survive. The roof is gone, the walls are thinking about it, and the neighbours have opinions."

 gen_tinker.0350.court.good: "\n\nThe whole court saw it. They will be talking about it for years."
 gen_tinker.0350.court.bad: "\n\nThe whole court saw it. They will be talking about it for years, and not in the way you hoped."
 gen_tinker.0350.night: "\n\nAt least nobody saw. Well, the night watch saw. But the night watch sees all sorts of things."

 gen_tinker.0350.patron.deliver: "\n\nIt is packed in straw and sent to [gen_tk_beneficiary.GetShortUIName], who paid for it. It is theirs now."
 gen_tinker.0350.patron.nothing: "\n\nThere is nothing to send to [gen_tk_beneficiary.GetShortUIName], who paid for it. Someone will have to write that letter."
 gen_tinker.0350.patron.dead: "\n\nThe one who commissioned it did not live to see it. It stays with you."

 gen_tinker.0350.a.masterwork: "I knew it. (I hoped it.)"
 gen_tinker.0350.a.works: "It works! Of course it works."
 gen_tinker.0350.a.dud: "Back to the drawing board. Again."
 gen_tinker.0350.a.explodes: "Note to self: less of that next time."

 # ============ Outcome tooltips ============
 gen_tk_mill_no_land.tt: "There is no land to build the works on any more. They are sold off for their brass"
 gen_tk_limb_no_fit.tt: "There is no injury left to fit it to, so it goes on a shelf as a curiosity"
 gen_tk_dud_haul.tt: "The dud has to be hauled out of the way, which costs a little gold"
 gen_tk_invention_no_fascination.tt: "Your people are not fascinated by anything just now, so the scholars talk about the invention instead"

 # ============ The curio (artifact) ============
 gen_tk_curio_songbird_name: "Clockwork Songbird"
 gen_tk_curio_songbird_masterwork_name: "Brass Nightingale"
 gen_tk_curio_songbird_desc: "A brass songbird that fits in a closed hand. Wind the key in its back and it hops, turns its head and sings three notes, not always in the same order. A gnome made it, and it shows."
 gen_tk_curio_orrery_name: "Clockwork Orrery"
 gen_tk_curio_orrery_masterwork_name: "The Great Orrery"
 gen_tk_curio_orrery_desc: "Rings of brass within rings of brass, turned by clockwork hidden in the base. Wound once a day it keeps the sun, the moon and the wandering stars in their courses, give or take a little. A gnome made it, and it shows."

 # ============ Modifiers ============
 gen_tk_curio_trinket_modifier: "Clockwork Songbird"
 gen_tk_curio_trinket_modifier_desc: "A little brass bird that sings when wound."
 gen_tk_curio_trinket_masterwork_modifier: "Brass Nightingale"
 gen_tk_curio_trinket_masterwork_modifier_desc: "A brass bird that sings better than most real ones."
 gen_tk_curio_orrery_modifier: "Clockwork Orrery"
 gen_tk_curio_orrery_modifier_desc: "The heavens in brass, turning in the throne room."
 gen_tk_curio_orrery_masterwork_modifier: "The Great Orrery"
 gen_tk_curio_orrery_masterwork_modifier_desc: "The heavens in brass, and visitors come a long way to see them turn."
 gen_tk_waterworks_modifier: "Gnomish Waterworks"
 gen_tk_waterworks_modifier_desc: "A gnome's wheels, sluices and pumps carry the river to the fields."
 gen_tk_waterworks_masterwork_modifier: "Masterwork Waterworks"
 gen_tk_waterworks_masterwork_modifier_desc: "A gnome's waterworks so fine that the millers bring cheese to say thank you."
 gen_tk_war_engine_modifier: "Gnomish War Engine"
 gen_tk_war_engine_modifier_desc: "A gnome-built engine goes with this character's army and throws things at walls."
 gen_tk_war_engine_masterwork_modifier: "Masterwork War Engine"
 gen_tk_war_engine_masterwork_modifier_desc: "A gnome-built engine that throws very large things at walls, very accurately."
 gen_tk_clockwork_hand_modifier: "Clockwork Hand"
 gen_tk_clockwork_hand_modifier_desc: "A gnome-made hand of brass and leather, strapped where the old one was. It ticks a little."
 gen_tk_clockwork_hand_masterwork_modifier: "Masterwork Clockwork Hand"
 gen_tk_clockwork_hand_masterwork_modifier_desc: "A gnome-made hand so fine it can hold a quill or a sword. It hardly ticks at all."
 gen_tk_clockwork_leg_modifier: "Clockwork Leg"
 gen_tk_clockwork_leg_modifier_desc: "A gnome-made leg of brass and oak, strapped where the old one was. It creaks on stairs."
 gen_tk_clockwork_leg_masterwork_modifier: "Masterwork Clockwork Leg"
 gen_tk_clockwork_leg_masterwork_modifier_desc: "A gnome-made leg so fine this character can dance on it, if they want to."
 gen_tk_apprentice_learned_modifier: "Learned at the Bench"
 gen_tk_apprentice_learned_modifier_desc: "This character helped build a working contraption, and learned a great deal doing it."
 gen_tk_workshop_ruins_modifier: "Workshop Ruins"
 gen_tk_workshop_ruins_modifier_desc: "A tinkerer's workshop blew up here. The neighbours are still picking brass out of their roofs."
