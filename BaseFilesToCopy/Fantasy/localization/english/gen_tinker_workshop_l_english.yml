l_english:
 # Gnome Tinkering: the design (0100s) and setback (0200s) stages. events/gen_tinker_workshop_events.txt

 # ============ What is on the bench (GenTkProject, 00_gen_tinker_workshop_loc.txt) ============
 gen_tk_ws_noun_curio: "clockwork curio"
 gen_tk_ws_noun_mill: "waterworks"
 gen_tk_ws_noun_engine: "war engine"
 gen_tk_ws_noun_limb: "clockwork limb"
 gen_tk_ws_noun_invention: "great invention"
 gen_tk_ws_noun_other: "contraption"

 # ============ The running thread (tooltips for flags the tooltip cannot draw) ============
 gen_tk_ws_wf_careful.tt: "Careful work: a #P fire in the workshop#! is less likely during the build"
 gen_tk_ws_wf_ambitious.tt: "A bigger design: something is more likely to #N go wrong with the [gen_tk_maker.Custom('GenTkProject')] itself#! during the build"
 gen_tk_ws_wf_dwarf_design.tt: "The dwarvish plan calls for parts #N only a dwarf smith makes#!"
 gen_tk_ws_wf_cheap_parts.tt: "Scrap parts: a #N fire or a breakage#! is more likely during the build"
 gen_tk_ws_wf_fine_brass.tt: "Good brass is dear: the #N money may run out#! before the work is done"
 gen_tk_ws_wf_bench_open.tt: "The workshop door is open now: expect #V visitors#!, some of them small"
 gen_tk_ws_wf_rival_stirred.tt: "Your rival is paying attention now: your notes may #N go missing#!, or someone may #N tamper with the work#!"
 gen_tk_ws_wf_patron_promised.tt: "Your patron will expect what you promised, and is likely to #V send someone to look#!"
 gen_tk_ws_wf_patron_fooled.tt: "Your patron will find out it #N is not what you agreed#!: at an inspection if they send someone, or at delivery. A masterwork is forgiven"
 gen_tk_ws_apprentice_joins.tt: "They will work at your bench until the test: they #N share its dangers#!, and #P learn from it#! if it works"
 gen_tk_ws_grudge.tt: "[gen_tk_ws_grudger.GetFirstName] will #N remember being brushed aside#! while the work goes on. A grudge at court makes sabotage more likely"

 # ============ Modifiers ============
 gen_tk_flooded_quarter_modifier: "Flooded Lower Town"
 gen_tk_flooded_quarter_modifier_desc: "Waterworks upstream opened their sluice all at once. The lower town is still drying out, and still talking about it."
 gen_tk_chiming_nights_modifier: "Chiming Nights"
 gen_tk_chiming_nights_modifier_desc: "This character spent weeks sleeping beside a clockwork curio that chimes whenever it likes."

 # ============ 0101 The Blueprint ============
 gen_tinker.0101.t: "The Blueprint"
 gen_tinker.0101.desc: "So far the [ROOT.Char.Custom('GenTkProject')] exists as a heap of drawings on the workbench, weighed down at the corners with a teacup, two spanners and a cold sausage. Before the first gear is cut, you have to settle on a plan.\n\n"
 gen_tinker.0101.desc.curio: "The drawings disagree about how many gears will fit in something small enough to hold. The later drawings have more gears, and smaller handwriting."
 gen_tinker.0101.desc.mill: "The drawings show wheels, sluices, pumps and a great many arrows showing where the water ought to go. The river has not seen the drawings."
 gen_tinker.0101.desc.engine: "The drawings show a throwing arm, a counterweight, and a small figure standing well back. You drew the figure first, which says something."
 gen_tinker.0101.desc.limb: "The drawings show a hand with more joints than a real one, because you could not see why not."
 gen_tinker.0101.desc.invention: "The drawings no longer fit on the workbench. Some of them are on the floor, and one is pinned to the ceiling for reasons you remember only vaguely."
 gen_tinker.0101.desc.end: "\n\nYou can build it carefully, build it bigger, or build it simple. And there is always that dwarvish plan you bought from a trader years ago, which may or may not be for the same thing."
 gen_tinker.0101.a: "Draw it three times and check it four."
 gen_tinker.0101.b: "Bigger. Add another wheel."
 gen_tinker.0101.c: "Use the dwarvish plan. Dwarves know gears."
 gen_tinker.0101.d: "Keep it simple. Simple things work."
 gen_tinker.0101.e: "Sit down and do all the sums properly, even the hard ones."

 # ============ 0102 Brass and Bolts ============
 gen_tinker.0102.t: "Brass and Bolts"
 gen_tinker.0102.desc: "The plan is settled. Now you need the metal for it: brass for the gears, steel for the springs, and a great many bolts, because there are never enough bolts.\n\n"
 gen_tinker.0102.desc.steward: "[gen_tk_d_steward.GetFirstName] has come with the accounts under [gen_tk_d_steward.GetHerHis] arm and a pained look. Fine brass is dear this year. The midden behind the smithy, [gen_tk_d_steward.GetSheHe] points out, is full of old pots, and costs nothing."
 gen_tinker.0102.desc.alone: "Fine brass is dear this year. The midden behind the smithy is full of old pots and bent nails, and costs nothing. There is also the household silver, which nobody really uses except at feasts."
 gen_tinker.0102.a: "Scrap from the midden will do."
 gen_tinker.0102.b: "Buy good brass and proper springs."
 gen_tinker.0102.c: "Melt down the household silver. Guests can eat off pewter."
 gen_tinker.0102.d: "[gen_tk_d_steward.GetFirstName], find me the money somewhere in those accounts."
 gen_tinker.0102.d.found: "[gen_tk_d_steward.GetFirstName] finds the money"
 gen_tinker.0102.d.found.t: "The Steward Finds the Money"
 gen_tinker.0102.d.lost: "[gen_tk_d_steward.GetFirstName] finds nothing, slowly, and it's the midden after all"
 gen_tinker.0102.d.lost.t: "The Steward Finds Nothing"

 # ============ 0103 An Apprentice ============
 gen_tinker.0103.t: "An Apprentice"
 gen_tinker.0103.desc: "A project this size wants a second pair of hands: someone to hold the other end, fetch the right spanner, and notice when your sleeve is caught in something."
 gen_tinker.0103.desc.young: "\n\n[gen_tk_d_young.GetFirstName] has been hanging about the workshop door for weeks, pretending not to watch. Yesterday [gen_tk_d_young.GetSheHe] put a dropped gear back in exactly the right place without being asked."
 gen_tinker.0103.desc.clever: "\n\n[gen_tk_d_clever.GetFirstName], who is sharper than most of your court and knows it, has let it be known that [gen_tk_d_clever.GetSheHe] would not say no to a place at the bench."
 gen_tinker.0103.a: "[gen_tk_d_young.GetFirstName], come and hold this."
 gen_tinker.0103.b: "[gen_tk_d_clever.GetFirstName], take a stool. Mind the oil."
 gen_tinker.0103.c: "I work alone."

 # ============ 0104 A Letter from a Rival ============
 gen_tinker.0104.t: "A Letter from a Rival"
 gen_tinker.0104.desc: "A letter has come from [gen_tk_d_rival.GetTitledFirstName]. Somebody told [gen_tk_d_rival.GetHerHim] about your [ROOT.Char.Custom('GenTkProject')], and [gen_tk_d_rival.GetSheHe] has a great deal to say about it.\n\n"
 gen_tinker.0104.desc.tinker: "The first page explains that [gen_tk_d_rival.GetSheHe] built the same thing years ago, only better. The second page is a drawing of it, with arrows. Some of the arrows are rude. Some of them, annoyingly, are right."
 gen_tinker.0104.desc.meddler: "[gen_tk_d_rival.GetFirstName] has never built anything in [gen_tk_d_rival.GetHerHis] life, but has somehow found a scholar who has, and has enclosed the scholar's notes on everything wrong with your idea. There are eleven pages. Some of the notes are right."
 gen_tinker.0104.a: "Write back that mine will be twice the size."
 gen_tinker.0104.b: "Study the drawing. Some of the arrows are good."
 gen_tinker.0104.c: "Burn the letter and get back to work."
 gen_tinker.0104.d: "Send back some drawings of my own. Slightly wrong ones."
 gen_tinker.0104.d.win: "[gen_tk_d_rival.GetFirstName] builds from your drawings"
 gen_tinker.0104.d.win.t: "The Wrong Drawings Work"
 gen_tinker.0104.d.win.rival: "A Tinker's Trick"
 gen_tinker.0104.d.win.rival.tt: "[gen_tk_d_rival.GetFirstName] built from the drawings [gen_tk_maker.GetFirstName] sent, and found the mistakes in them only afterwards"
 gen_tinker.0104.d.lose: "[gen_tk_d_rival.GetFirstName] sees through it and tells everyone"
 gen_tinker.0104.d.lose.t: "The Trick Is Seen"
 gen_tinker.0104.d.lose.rival: "A Clumsy Trick"
 gen_tinker.0104.d.lose.rival.tt: "[gen_tk_d_rival.GetFirstName] spotted the mistakes in the drawings [gen_tk_maker.GetFirstName] sent, and is telling everyone about them"

 # ============ 0105 The Patron's Letter ============
 gen_tinker.0105.t: "The Patron's Letter"
 gen_tinker.0105.desc: "A rider has brought a letter from [gen_tk_d_patron.GetTitledFirstName], who is paying for the [ROOT.Char.Custom('GenTkProject')] and has been thinking about it. [gen_tk_d_patron.GetSheHe|U] has had ideas.\n\n"
 gen_tinker.0105.desc.bigger: "[gen_tk_d_patron.GetSheHe|U] wants it bigger. Much bigger. [gen_tk_d_patron.GetSheHe|U] has heard that a neighbour's is bigger, and will not have it."
 gen_tinker.0105.desc.faster: "[gen_tk_d_patron.GetSheHe|U] wants it sooner. There is a feast coming, and [gen_tk_d_patron.GetSheHe] would like to show it off, and could it not simply be built more quickly?"
 gen_tinker.0105.desc.cheaper: "[gen_tk_d_patron.GetSheHe|U] wants it cheaper. The letter does not say how, but it does include a list of what [gen_tk_d_patron.GetSheHe] thinks brass ought to cost, which is about half what it does."
 gen_tinker.0105.a: "Do as [gen_tk_d_patron.GetFirstName] asks. The patron pays."
 gen_tinker.0105.b: "Write back and explain, politely, why that will not work."
 gen_tinker.0105.b.win: "[gen_tk_d_patron.GetFirstName] is persuaded"
 gen_tinker.0105.b.win.t: "The Patron Is Persuaded"
 gen_tinker.0105.b.lose: "[gen_tk_d_patron.GetFirstName] is not persuaded, and is offended"
 gen_tinker.0105.b.lose.t: "The Patron Is Offended"
 gen_tinker.0105.c: "Agree to everything, then build it my own way."

 # ============ 0106 An Idea in the Night ============
 gen_tinker.0106.t: "An Idea in the Night"
 gen_tinker.0106.desc: "You wake in the small hours with the whole [ROOT.Char.Custom('GenTkProject')] turning in your head, clear as glass: every gear, every spring, and one part you have never thought of before, which solves everything.\n\nIt might be genius. It might be the cheese you had at supper. Either way, it is fading fast."
 gen_tinker.0106.a: "Up! Light the lamp! Where is my pencil?"
 gen_tinker.0106.a.good: "The idea is good"
 gen_tinker.0106.a.good.t: "It Was Genius"
 gen_tinker.0106.a.bad: "The idea was the cheese"
 gen_tinker.0106.a.bad.t: "It Was the Cheese"
 gen_tinker.0106.b: "Build a small model of it first, to be sure."
 gen_tinker.0106.b.good: "The model works"
 gen_tinker.0106.b.good.t: "The Model Works"
 gen_tinker.0106.b.bad: "The model falls over"
 gen_tinker.0106.b.bad.t: "The Model Falls Over"
 gen_tinker.0106.c: "Go back to sleep. It will still be there in the morning."

 # ============ 0107 The Noise ============
 gen_tinker.0107.t: "The Noise"
 gen_tinker.0107.desc.spouse: "[gen_tk_d_spouse.GetFirstName] finds you at the workbench before breakfast, which is unusual, because [gen_tk_d_spouse.GetSheHe] has not been getting up for breakfast. [gen_tk_d_spouse.GetSheHe|U] has not been sleeping either.\n\n"The hammering starts at dawn," [gen_tk_d_spouse.GetSheHe] says. "The grinding starts at noon. And I don't know what the whistling is, but it goes on all night, and it smells.""
 gen_tinker.0107.desc.steward: "[gen_tk_d_steward.GetFirstName], your steward, has come with a list. It is a list of complaints about the workshop, from the kitchens, the stables, the chapel and the neighbours, and at the bottom, in [gen_tk_d_steward.GetHerHis] own hand, what the whole business has cost so far."
 gen_tinker.0107.desc.end: "\n\n[gen_tk_d_complainer.GetSheHe|U] would like it to stop, or at least to be somewhere else."
 gen_tinker.0107.a: "I'll work in daylight hours only. I promise."
 gen_tinker.0107.b: "I'll move the bench to a shed down by the river."
 gen_tinker.0107.c: "Great work is loud. Get used to it."
 gen_tinker.0107.d: "Come and see what it does. You'll understand."
 gen_tinker.0107.d.charmed: "[gen_tk_d_complainer.GetFirstName] is won over"
 gen_tinker.0107.d.charmed.t: "Won Over"
 gen_tinker.0107.d.appalled: "[gen_tk_d_complainer.GetFirstName] is appalled"
 gen_tinker.0107.d.appalled.t: "Not Won Over"

 # ============ 0201 The Woodshed (war engine) ============
 gen_tinker.0201.t: "The Woodshed"
 gen_tinker.0201.desc: "The first proper test of the throwing arm went well, in the sense that it threw. The log went up, over the wall, across the yard and straight through the roof of the woodshed, which is now mostly a woodpile.\n\nNobody was hurt. The woodcutter is very upset, and the whole castle came out to look at the hole."
 gen_tinker.0201.a: "Pay for the shed, and test outside the walls from now on."
 gen_tinker.0201.b: "More counterweight. It should have gone further."
 gen_tinker.0201.c: "Tell everyone it was aimed at the shed."
 gen_tinker.0201.c.believed: "They believe you"
 gen_tinker.0201.c.believed.t: "A Fine Shot, Everyone Agrees"
 gen_tinker.0201.c.laughed: "They do not believe you"
 gen_tinker.0201.c.laughed.t: "Nobody Believes It Was Aimed"
 gen_tinker.0201.d: "[gen_tk_s_appr.GetFirstName], go and measure how far it went."

 # ============ 0202 The Lower Town Floods (waterworks) ============
 gen_tinker.0202.t: "The Lower Town Floods"
 gen_tinker.0202.desc: "The new sluice gate held for three days. On the fourth it opened by itself, all at once, and the millpond went down the hill to visit the lower town.\n\nThe water is knee-deep in the market square. There is a goose on the baker's roof that nobody can get down. The townsfolk know exactly whose waterworks it was."
 gen_tinker.0202.a: "Pay the townsfolk for the damage."
 gen_tinker.0202.b: "Spend the money on a proper sluice gate instead. They'll dry out."
 gen_tinker.0202.c: "Tell them it's a new kind of irrigation."
 gen_tinker.0202.a.tt: "The lower town is spared two years of #N Flooded Lower Town#!"

 # ============ 0203 It Will Not Stop Chiming (curio) ============
 gen_tinker.0203.t: "It Will Not Stop Chiming"
 gen_tinker.0203.desc: "The curio's little bell now chimes on the hour. It also chimes on the half hour, at odd moments in between, and all through last night, for no reason you can find. Nobody knows how to stop it. Taking the key out made it chime faster."
 gen_tinker.0203.desc.spouse: "\n\n[gen_tk_s_spouse.GetFirstName] has not slept for three nights and has started looking at the curio the way cooks look at chickens."
 gen_tinker.0203.desc.court: "\n\nThe whole court can hear it. Someone has started leaving pillows outside the workshop door, pointedly."
 gen_tinker.0203.a: "Stuff it with wool until I can think."
 gen_tinker.0203.b: "Take the whole thing apart and find out why."
 gen_tinker.0203.c: "Sleep in the workshop beside it and listen until I understand."
 gen_tinker.0203.d: "Give it to [gen_tk_s_spouse.GetFirstName] as a present. For now."
 gen_tinker.0203.d.charmed: "[gen_tk_s_spouse.GetFirstName] is charmed by it"
 gen_tinker.0203.d.charmed.t: "A Welcome Present"
 gen_tinker.0203.d.furious: "[gen_tk_s_spouse.GetFirstName] is not charmed by it"
 gen_tinker.0203.d.furious.t: "An Unwelcome Present"

 # ============ 0204 It Pinches (clockwork limb) ============
 gen_tinker.0204.t: "It Pinches"
 gen_tinker.0204.desc.self: "You strapped on the [ROOT.Char.Custom('GenTkProject')] this morning for a first fitting. The joints move beautifully. They also snap shut without warning, and the first time they did, they caught a fold of your own skin and would not let go."
 gen_tinker.0204.desc.patron: "[gen_tk_s_wearer.GetTitledFirstName] came for a first fitting of the [ROOT.Char.Custom('GenTkProject')]. The joints move beautifully. They also snap shut without warning, and the first time they did, they caught a fold of [gen_tk_s_wearer.GetHerHis] skin and would not let go."
 gen_tinker.0204.desc.end: "\n\nIt took a screwdriver and two grown men to open it again. Everyone who laughed has been noted."
 gen_tinker.0204.a: "Pad the grip with good leather."
 gen_tinker.0204.b: "Rebuild the joint from the knuckle down."
 gen_tinker.0204.c: "It will loosen up with use."
 gen_tinker.0204.d: "Try it on [gen_tk_s_appr.GetFirstName] first. For science."
 gen_tinker.0204.d.pinched: "It pinches [gen_tk_s_appr.GetFirstName]"
 gen_tinker.0204.d.pinched.t: "Pinched"
 gen_tinker.0204.d.fine: "It behaves itself"
 gen_tinker.0204.d.fine.t: "It Behaves"
 gen_tinker.0204.d.fine.tt: "[gen_tk_s_appr.GetFirstName] comes away unpinched, and the joints close only when told to"

 # ============ 0205 The Notes Are Gone (grand invention) ============
 gen_tinker.0205.t: "The Notes Are Gone"
 gen_tinker.0205.desc: "The notebook for the [ROOT.Char.Custom('GenTkProject')] is not where you left it. It is three hundred pages long, it is the only copy, and it holds every measurement you have taken since the spring.\n\nIt is not under the bench. It is not in the other workshop. It is not, the cook swears, in the kitchen fire."
 gen_tinker.0205.desc.stirred: "\n\n[gen_tk_s_rival.GetFirstName] has been taking a great interest in your work lately."
 gen_tinker.0205.a: "Turn the whole castle upside down until it turns up."
 gen_tinker.0205.a.found: "The notebook turns up"
 gen_tinker.0205.a.found.t: "The Notebook Turns Up"
 gen_tinker.0205.a.found.tt: "It was in the privy the whole time. It is damp, but all of it can be read"
 gen_tinker.0205.a.lost: "The notebook is never found"
 gen_tinker.0205.a.lost.t: "The Notebook Is Lost"
 gen_tinker.0205.b: "Write it all out again from memory."
 gen_tinker.0205.b.win: "You remember it, and better"
 gen_tinker.0205.b.win.t: "Better the Second Time"
 gen_tinker.0205.b.lose: "You misremember important parts"
 gen_tinker.0205.b.lose.t: "Half-Remembered"
 gen_tinker.0205.c: "[gen_tk_s_rival.GetFirstName] took it. Write and demand it back."
 gen_tinker.0205.c.returned: "It comes back"
 gen_tinker.0205.c.returned.t: "Returned, with Notes in the Margins"
 gen_tinker.0205.c.denied: "[gen_tk_s_rival.GetFirstName] denies everything"
 gen_tinker.0205.c.denied.t: "Denied"
 gen_tinker.0205.d: "Offer a reward for its return, no questions asked."
 gen_tinker.0205.d.returned: "Someone brings it back"
 gen_tinker.0205.d.returned.t: "The Reward Is Claimed"
 gen_tinker.0205.d.returned.tt: "A stable boy brings it back, claims the reward and will not say where he found it. It smells of the stables, but all of it can be read"
 gen_tinker.0205.d.nothing: "Nobody brings it back"
 gen_tinker.0205.d.nothing.t: "Nobody Claims the Reward"

 # ============ 0210 The Dwarf-Made Part ============
 gen_tinker.0210.t: "The Dwarf-Made Part"
 gen_tinker.0210.desc: "The [ROOT.Char.Custom('GenTkProject')] needs a gear cut finer than your smith has ever cut anything. The smith has tried three times and now calls the job witchcraft."
 gen_tinker.0210.desc.plan: "The dwarvish plan called for a gear cut finer than your smith has ever cut anything. The measurements are in dwarf inches, which turn out not to be the same as ordinary inches. Your smith has tried three times and now calls the job witchcraft."
 gen_tinker.0210.desc.end: "\n\nThere is a dwarf smith three valleys over who could make it with one eye shut, and who knows it, and charges for it."
 gen_tinker.0210.a: "Send for the dwarf's gear, whatever it costs."
 gen_tinker.0210.b: "Cut it myself. How hard can it be?"
 gen_tinker.0210.b.win: "You cut it true"
 gen_tinker.0210.b.win.t: "Cut True"
 gen_tinker.0210.b.lose: "You cut it slightly wrong"
 gen_tinker.0210.b.lose.t: "Nearly True"
 gen_tinker.0210.c: "Use a gear that nearly fits. Nearly is close."

 # ============ 0211 Fire in the Workshop ============
 gen_tinker.0211.t: "Fire in the Workshop"
 gen_tinker.0211.desc: "Someone is shouting "fire!", and it is your workshop. Smoke is coming out of the window in a thick yellow column, and there are small pops from inside where things that should not get hot are getting hot.\n\nThe [ROOT.Char.Custom('GenTkProject')] is in there."
 gen_tinker.0211.desc.cheap: " So is a great deal of scrap from the midden, which, it turns out, was not all metal."
 gen_tinker.0211.a: "Run in and get it out!"
 gen_tinker.0211.a.safe: "You come out unhurt"
 gen_tinker.0211.a.safe.t: "Saved, and Unsinged"
 gen_tinker.0211.a.burned: "You come out burned"
 gen_tinker.0211.a.burned.t: "Saved, but Burned"
 gen_tinker.0211.a.saved.tt: "The [gen_tk_maker.Custom('GenTkProject')] is carried out of the fire whole"
 gen_tinker.0211.b: "Form a bucket line! Everyone!"
 gen_tinker.0211.c: "Let it burn. I'll start again, and properly this time."

 # ============ 0212 Tampered With ============
 gen_tinker.0212.t: "Tampered With"
 gen_tinker.0212.desc: "Someone has been at the [ROOT.Char.Custom('GenTkProject')]. A spring has been let off, two bolts are missing, and a gear has been put back upside down, which is not a mistake anyone makes by accident.\n\nIn the dust by the bench there are footprints: a grown person's, in good indoor shoes. Somebody at your own court did this."
 gen_tinker.0212.a: "Find out who did this."
 gen_tinker.0212.a.win: "You find out who"
 gen_tinker.0212.a.win.tt: "You will learn who it was, and decide what to do with them"
 gen_tinker.0212.a.lose: "Nobody confesses"
 gen_tinker.0212.a.lose.t: "Nobody Confesses"
 gen_tinker.0212.b: "Mend it, and put a lock on the door."
 gen_tinker.0212.c: "I'll sleep in the workshop until it's finished."
 gen_tinker.0212.d: "Mend it and say nothing. It was probably nothing."

 # ============ 0213 Caught ============
 gen_tinker.0213.t: "Caught"
 gen_tinker.0213.desc: "The shoes gave it away. [gen_tk_s_culprit.GetFirstName] was the only one at court with oil on [gen_tk_s_culprit.GetHerHis] good indoor shoes, and when you asked about the missing bolts, [gen_tk_s_culprit.GetSheHe] went very red and took them out of [gen_tk_s_culprit.GetHerHis] pocket."
 gen_tinker.0213.desc.grudge: "\n\nIt was about being brushed aside, of course. [gen_tk_s_culprit.GetSheHe|U] has been sore about it for months."
 gen_tinker.0213.a: "Get out of my court."
 gen_tinker.0213.b: "I'll keep this quiet. You owe me now."
 gen_tinker.0213.c: "You will sweep that workshop every day until it's finished."
 gen_tinker.0213.d: "I forgive you. Don't do it again."

 # ============ 0215 The Apprentice ============
 gen_tinker.0215.t.mistake: "The Apprentice's Mistake"
 gen_tinker.0215.t.breakthrough: "The Apprentice's Idea"
 gen_tinker.0215.desc.mistake: "[gen_tk_s_appr.GetFirstName] has fitted the mainspring of the [ROOT.Char.Custom('GenTkProject')] backwards, and then, finding it would not turn, forced it.\n\n[gen_tk_s_appr.GetSheHe|U] is standing by the bench looking at [gen_tk_s_appr.GetHerHis] shoes. The spring is looking at nothing, because it is now in three pieces."
 gen_tinker.0215.desc.breakthrough: "You have been stuck on the same linkage in the [ROOT.Char.Custom('GenTkProject')] for three weeks. This morning you came in and found it done.\n\n[gen_tk_s_appr.GetFirstName] stayed up all night with it. The solution is odd, and not how you would have done it, and it works."
 gen_tinker.0215.a: "Let [gen_tk_s_appr.GetFirstName] fix it. That's how you learn."
 gen_tinker.0215.a.fixed: "[gen_tk_s_appr.GetFirstName] fixes it"
 gen_tinker.0215.a.fixed.t: "Fixed"
 gen_tinker.0215.a.worse: "[gen_tk_s_appr.GetFirstName] makes it worse"
 gen_tinker.0215.a.worse.t: "Worse"
 gen_tinker.0215.b: "Stand aside. I'll fix it myself."
 gen_tinker.0215.b.tt: "You fit a new spring yourself: the work is none the worse"
 gen_tinker.0215.c: "Everyone does that once. Leave it, it'll hold."
 gen_tinker.0215.d: "We'll use it, and everyone will know whose it was."
 gen_tinker.0215.e: "We'll use it. No need to mention whose it was."
 gen_tinker.0215.f: "Not like that. Like this."

 # ============ 0216 The Money Runs Out ============
 gen_tinker.0216.t: "The Money Runs Out"
 gen_tinker.0216.desc: "The [ROOT.Char.Custom('GenTkProject')] is two-thirds built and the money is all spent. The brass merchant wants paying before he brings any more, the smith has gone home, and the smith's boys are eating their lunch very slowly in case it is the last one."
 gen_tinker.0216.desc.brass: "\n\nGood brass, it turns out, costs what good brass costs."
 gen_tinker.0216.a: "Find the money. It has to be finished."
 gen_tinker.0216.a.tt: "The work goes on as planned, with no corners cut"
 gen_tinker.0216.b: "Cut corners. Nobody will see the inside."
 gen_tinker.0216.c: "Sell the spare parts. It doesn't need all of them."
 gen_tinker.0216.d: "Write to [gen_tk_s_patron.GetFirstName] for a little more."
 gen_tinker.0216.d.paid: "[gen_tk_s_patron.GetFirstName] sends more gold"
 gen_tinker.0216.d.paid.t: "The Patron Pays"
 gen_tinker.0216.d.refused: "[gen_tk_s_patron.GetFirstName] refuses, and corners are cut"
 gen_tinker.0216.d.refused.t: "The Patron Refuses"

 # ============ 0217 A Visitor in the Workshop ============
 gen_tinker.0217.t: "A Visitor in the Workshop"
 gen_tinker.0217.desc: "You look up from the [ROOT.Char.Custom('GenTkProject')] and find [gen_tk_s_kid.GetFirstName] sitting under the bench, watching you. [gen_tk_s_kid.GetSheHe|U] is holding a small brass gear which was, until recently, inside the [ROOT.Char.Custom('GenTkProject')].\n\n"What does this one do?" [gen_tk_s_kid.GetSheHe] asks."
 gen_tinker.0217.a: "Out! And give me that."
 gen_tinker.0217.a.tt: "The gear goes back in, and the work is left as it was"
 gen_tinker.0217.b: "Come and hold this for me. Carefully."
 gen_tinker.0217.b.spotted: "[gen_tk_s_kid.GetFirstName] spots something you missed"
 gen_tinker.0217.b.spotted.t: "Sharp Little Eyes"
 gen_tinker.0217.b.dropped: "[gen_tk_s_kid.GetFirstName] drops it"
 gen_tinker.0217.b.dropped.t: "Butterfingers"
 gen_tinker.0217.c: "Sit down. I'll show you how the whole thing works."

 # ============ 0218 The Inspection ============
 gen_tinker.0218.t: "The Inspection"
 gen_tinker.0218.desc: "An envoy from [gen_tk_s_patron.GetTitledFirstName] has arrived to see how the [ROOT.Char.Custom('GenTkProject')] is coming along. [gen_tk_s_patron.GetSheHe|U] is paying for it, after all, and would like to know what for.\n\nThe envoy has a notebook, a very clean coat, and the look of someone who will write down everything."
 gen_tinker.0218.desc.fooled: "\n\nThe trouble is that what is on the bench is not quite what you promised [gen_tk_s_patron.GetFirstName]. It is better, you are sure of it. The envoy may not see it that way."
 gen_tinker.0218.a: "Show everything, warts and all."
 gen_tinker.0218.a.truth_tt: "The envoy sees it isn't what [gen_tk_s_patron.GetFirstName] ordered. Better now than at delivery"
 gen_tinker.0218.a.poked: "The envoy knocks something loose"
 gen_tinker.0218.a.poked.t: "The Envoy Pokes at the Works"
 gen_tinker.0218.a.fine: "The envoy touches nothing"
 gen_tinker.0218.a.fine.t: "A Careful Envoy"
 gen_tinker.0218.a.fine.tt: "The envoy looks at everything and breaks nothing"
 gen_tinker.0218.secret_kept_tt: "Your change of plan stays hidden until delivery: forgiven if it's a masterwork, resented if not"
 gen_tinker.0218.c.safe_tt: "Nobody touches the work"
 gen_tinker.0218.b: "Show only the good parts, and wind it up for a demonstration."
 gen_tinker.0218.b.impressed: "The envoy is impressed"
 gen_tinker.0218.b.impressed.t: "The Envoy Is Impressed"
 gen_tinker.0218.b.impressed.patron: "A Glowing Report from the Workshop"
 gen_tinker.0218.b.impressed.patron.tt: "The envoy sent to [gen_tk_maker.GetFirstNamePossessive] workshop saw the contraption wound up and working, and writes about it glowingly"
 gen_tinker.0218.b.collapsed: "It falls apart in front of the envoy"
 gen_tinker.0218.b.collapsed.t: "It Falls Apart"
 gen_tinker.0218.b.collapsed.patron: "A Worrying Report from the Workshop"
 gen_tinker.0218.b.collapsed.patron.tt: "The envoy sent to [gen_tk_maker.GetFirstNamePossessive] workshop watched the contraption fall apart halfway through its demonstration"
 gen_tinker.0218.c: "Give the envoy the best room, the best wine and no time to look."
