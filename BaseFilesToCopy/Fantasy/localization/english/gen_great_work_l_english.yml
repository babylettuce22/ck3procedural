l_english:
 # ============ The Long Labour (tradition) ============
 tradition_gen_long_labour_name: "The Long Labour"
 tradition_gen_long_labour_desc: "This people counts a life in centuries and spends it accordingly. Their kings have been known to give the whole of theirs to a single work, and to finish it only in old age, as they grow weary of the world."
 culture_parameter_gen_great_work: "Kings and emperors may #V Swear a Great Work#!: one masterwork, laboured on for the rest of a long life"

 # ============ Swear a Great Work (decision) ============
 gen_gw_swear_decision: "Swear a Great Work"
 gen_gw_swear_decision_desc: "Some of our kings have given everything that was left of their lives to a single work — a jewel, a chronicle, a harp — and the world still speaks of them. The oath is sworn once, and it is not taken back."
 gen_gw_swear_decision_tooltip: "Give the rest of your life to a single masterwork"
 gen_gw_swear_decision_confirm: "I swear it"
 gen_gw_swear_decision_effect.tt: "Choose the work you will give your life to"

 # ============ The work ============
 gen_gw_begin.tt: "Your life's work begins. It will not be finished soon"
 gen_gw_milestone.t: "The Work Grows"
 gen_gw_progress_big.tt: "The Great Work goes #P a long way#! toward being finished"
 gen_gw_progress_up.tt: "The Great Work goes #P forward#!"
 gen_gw_progress_small.tt: "The Great Work goes forward #V only a little#!"
 gen_gw_progress_down.tt: "The Great Work is #N set back#!"
 gen_gw_quality_big.tt: "The finished work will be #P much finer#! (a finer work becomes a greater treasure)"
 gen_gw_quality_up.tt: "The finished work will be #P finer#!"
 gen_gw_quality_down.tt: "The finished work will be #N a little rougher#!"
 gen_gw_quality_big_down.tt: "The finished work will be #N much rougher#! (a rougher work becomes a lesser treasure)"
 gen_gw_taken_up.t: "The Work Taken Up"
 gen_gw_taken_up.tt: "You take up another maker's unfinished Great Work. It is yours to finish now."
 gen_gw_work_made.t: "A Great Work Is Made"
 gen_gw_work_made.tt: "[newly_created_artifact.GetName] has been added to your treasures."

 gen_gw_kind_jewel: "a jewel of captured light"
 gen_gw_kind_chronicle: "a chronicle of the age"
 gen_gw_kind_regalia: "the regalia of the line"
 gen_gw_kind_harp: "a harp of the first songs"
 gen_gw_kind_lamp: "a living lamp-tree"

 gen_gw_epithet_jewel: "the Starlit Jewel"
 gen_gw_epithet_chronicle: "the Long Chronicle"
 gen_gw_epithet_regalia: "the Crown of Ages"
 gen_gw_epithet_harp: "the Harp of First Songs"
 gen_gw_epithet_lamp: "the Lamp-Tree"

 gen_gw_artifact_name: "[owner.Custom('GenGwWorkWord')], [owner.Custom('GenGwKindEpithet')]"
 gen_gw_artifact_desc: "[owner.Custom('GenGwArtifactDesc')]"
 gen_gw_artifact_desc_one: "[gw_maker_origin.GetFirstName] swore to make it while still young, and it was finished only after a lifetime of work. There is nothing else like it in the world."
 gen_gw_artifact_desc_hands: "[gw_maker_origin.GetFirstName] swore to make it while still young, but it took more than one lifetime. [owner.GetFirstName] finished it. There is nothing else like it in the world."
 gen_gw_artifact_unfinished_name: "[owner.Custom('GenGwWorkWord')], the Unfinished Work"
 gen_gw_artifact_unfinished_desc: "[gw_maker_origin.GetFirstName] did not live to finish it, and no one else did either. Even unfinished, it is a wonder to look at."

 # Names for a work whose people have no list of their own (an heir of another people took it up).
 gen_gw_word_fallback_1: "Elenmir"
 gen_gw_word_fallback_2: "Aerlindë"
 gen_gw_word_fallback_3: "Silmeth"
 gen_gw_word_fallback_4: "Tharaniel"
 gen_gw_word_fallback_5: "Luinveth"
 gen_gw_word_fallback_6: "Calenor"
 gen_gw_word_fallback_7: "Ithrendil"
 gen_gw_word_fallback_8: "Varelothë"
 gen_gw_word_fallback_9: "Miriandel"
 gen_gw_word_fallback_10: "Nimrethil"
 gen_gw_word_fallback_11: "Aurenwë"
 gen_gw_word_fallback_12: "Faelindor"

 # ============ The Passing of the Work (0520) ============
 gen_great_work.0520.t: "The Passing of the Work"
 gen_great_work.0520.desc: "You are tired in a way you have never been before, and you know what it means. The work is not finished. At the pace your hands move now, you may not live to finish it.\n\nMakers of our people have handed their work to another before, while they could still teach them. Others have refused and gone on alone."
 gen_great_work.0520.desc_pupil: "\n\n[gw_pupil_ok.GetFirstName] has worked beside you for years and knows the work almost as well as you do."
 gen_great_work.0520.desc_no_pupil: "\n\nYou never took a pupil. Whoever takes it now will have to learn it from you in whatever time you have left."
 gen_great_work.0520.a: "Give it to [gw_pupil_ok.GetFirstName]. [gw_pupil_ok.GetSheHe|U] is ready."
 gen_great_work.0520.b: "My heir, [gw_heir_ok.GetFirstName], will carry it on."
 gen_great_work.0520.c: "[gw_other_ok.GetFirstName] has the learning for it. Teach [gw_other_ok.GetHerHim]."
 gen_great_work.0520.d: "No. I swore to finish it, and I will."
 gen_great_work.0520.d.tt: "You keep working alone. If you die before it is done, your heirs will decide what becomes of it."

 # ============ The story panel ============
 story_gen_great_work: "The Great Work"
 story_gen_great_work_desc: "A life given to a single work."
 GEN_GW_STORY_STRING: "[Story.Custom('GenGwStoryLine')]"
 gen_gw_story_line_sworn: "[Story.GetOwner.GetFirstNameNoTooltip] has sworn a lifetime to [Story.Custom('GenGwKindStory')]."
 gen_gw_story_line_carried: "[Story.GetOwner.GetFirstNameNoTooltip] carries on [Story.Custom('GenGwKindStory')], first sworn by [Story.MakeScope.Var('gw_maker').Char.GetFirstNameNoTooltip]."
 GEN_GW_STORY_MAKER: "Sworn by"
 GEN_GW_STORY_PUPIL: "The Pupil"
 GEN_GW_STORY_PROGRESS: "The Work"

 # ============ Modifiers ============
 gen_gw_elder_modifier: "Elder of the Work"
 gen_gw_elder_modifier_desc: "This character handed their unfinished Great Work to another while they still could, and is still asked for advice about it."
 gen_gw_sworn_modifier: "Sworn to the Work"
 gen_gw_sworn_modifier_desc: "This character has sworn their life to a single great work. The realm pays for its materials, and its maker finds some peace at the bench."
 gen_gw_jewel_1_modifier: "The Jewel Takes Shape"
 gen_gw_jewel_1_modifier_desc: "Word of the jewel this character is making has begun to travel."
 gen_gw_jewel_2_modifier: "The Jewel Kindles"
 gen_gw_jewel_2_modifier_desc: "Those who have glimpsed the unfinished jewel speak of nothing else."
 gen_gw_jewel_3_modifier: "The Jewel Burns Bright"
 gen_gw_jewel_3_modifier_desc: "The jewel is nearly done, and its maker's fame has grown with it."
 gen_gw_chronicle_1_modifier: "The Chronicle Begun"
 gen_gw_chronicle_1_modifier_desc: "This character is writing the history of an age, and has read every record they could find to do it."
 gen_gw_chronicle_2_modifier: "The Chronicle Grows"
 gen_gw_chronicle_2_modifier_desc: "Scholars write from far courts to ask what the chronicle says of their houses."
 gen_gw_chronicle_3_modifier: "The Chronicle Nears Its End"
 gen_gw_chronicle_3_modifier_desc: "Scholars already treat the unfinished chronicle as the history of the age."
 gen_gw_regalia_1_modifier: "The Regalia Begun"
 gen_gw_regalia_1_modifier_desc: "The vassals know their lord is making the regalia of the line."
 gen_gw_regalia_2_modifier: "The Regalia Grows"
 gen_gw_regalia_2_modifier_desc: "Even unfinished, the regalia give their maker's rule more weight with the vassals."
 gen_gw_regalia_3_modifier: "The Regalia Nears Its End"
 gen_gw_regalia_3_modifier_desc: "The realm already speaks of the new crown as if it were finished."
 gen_gw_harp_1_modifier: "The Harp Strung"
 gen_gw_harp_1_modifier_desc: "The first strings are on the harp, and the court gathers in the evenings to hear it."
 gen_gw_harp_2_modifier: "The Harp Sings"
 gen_gw_harp_2_modifier_desc: "Envoys linger to hear the unfinished harp played."
 gen_gw_harp_3_modifier: "The Harp Nears Its End"
 gen_gw_harp_3_modifier_desc: "The harp is nearly done, and its maker has never been gentler."
 gen_gw_lamp_1_modifier: "The Lamp-Tree Planted"
 gen_gw_lamp_1_modifier_desc: "A glowing sapling grows in this character's garden, and they tend it every day."
 gen_gw_lamp_2_modifier: "The Lamp-Tree Grows"
 gen_gw_lamp_2_modifier_desc: "The lamp-tree lights the garden at night, and those who sit under it come away rested."
 gen_gw_lamp_3_modifier: "The Lamp-Tree Nears Its End"
 gen_gw_lamp_3_modifier_desc: "The lamp-tree is nearly grown, and its maker seems to have grown younger with it."
 gen_gw_artifact_jewel_modifier: "Starlit Jewel"
 gen_gw_artifact_chronicle_modifier: "Long Chronicle"
 gen_gw_artifact_regalia_modifier: "Crown of Ages"
 gen_gw_artifact_harp_modifier: "Harp of First Songs"
 gen_gw_artifact_lamp_modifier: "Lamp-Tree"
 gen_gw_artifact_unfinished_modifier: "An Unfinished Great Work"
