l_english:
 # ============ 0010 The Oath ============
 gen_great_work.0010.t: "The Oath of the Long Labour"
 gen_great_work.0010.desc: "Your court has gathered to hear you swear the oath of the Long Labour. By old custom it is sworn aloud, once, before witnesses, and never taken back.\n\nAmong your people, the greatest lives are given to a single work, begun while the maker is young and strong and finished only in old age, when they have grown weary of the world. The treasury has been opened and the craftsmen are waiting. All that is left is to say what you will make."
 gen_great_work.0010.a: "A jewel that catches the light and holds it, finer than any stone ever cut."
 gen_great_work.0010.b: "A chronicle of this age, written by one who lived through it."
 gen_great_work.0010.c: "The regalia of my line: a crown and sceptre for every heir who comes after me."
 gen_great_work.0010.d: "A harp that can play the oldest songs of our people, as they were first sung."
 gen_great_work.0010.e: "A lamp-tree: a tree that gives its own light, grown and tended by my hand."

 # ============ 0101 The True Material ============
 gen_great_work.0101.t: "The True Material"
 gen_great_work.0101.desc.jewel: "The setting is finished and the design is sound, but there is no stone in your treasury clear enough to hold what you mean it to hold. Glass clouds. Common crystal scatters the light instead of keeping it. The stone you need lies far deeper than any ordinary mine goes."
 gen_great_work.0101.desc.chronicle: "You are ready to write, but you cannot say for certain how your people's history begins. The oldest records were carried off or buried long ago, and a chronicle that begins with guesswork is no better than a tale. If those records survive anywhere, it is in the old archives beneath the mountains."
 gen_great_work.0101.desc.regalia: "Gold is soft and silver tarnishes, and the regalia of your line must outlast both. The old smiths spoke of a metal found only deep under the mountains: dark in the ore, bright when it is worked, and never touched by rust."
 gen_great_work.0101.desc.harp: "The frame must be cut from one piece of old, seasoned wood that has never been shaped for anything else, and the strings drawn from a metal that holds its note for a hundred years. Neither can be had at any market you know of."
 gen_great_work.0101.desc.lamp: "The lamp-tree must grow from living stock, and nothing in your gardens gives off any light. The old stories say a pale, glowing root still grows in the caves under the mountains, where the first lamp-trees were tended."
 gen_great_work.0101.desc.dwarf: "\n\n[gw_dwarf.GetTitledFirstName]'s people have mined under the mountains for longer than anyone can remember, and are said to have what you need, for a price. Or you could go down and find it yourself."
 gen_great_work.0101.desc.alone: "\n\nNo one trades in such things. If you want it, you will have to go down under the mountains and find it yourself, or make do with what you have."
 gen_great_work.0101.a: "Buy it from [gw_dwarf.GetFirstName]'s people."
 gen_great_work.0101.b: "Go down under the mountains and find it myself."
 gen_great_work.0101.b.found: "You find it"
 gen_great_work.0101.b.found.toast: "You Come Back with It"
 gen_great_work.0101.b.found.tt: "Weeks in the dark, and you come back up with exactly what you went down for. The court has talked of little else since."
 gen_great_work.0101.b.toll: "The journey goes badly"
 gen_great_work.0101.b.toll.toast: "A Hard Journey"
 gen_great_work.0101.b.toll.tt: "You come back with something, though not what you went for, and the weeks underground have shaken you badly."
 gen_great_work.0101.c: "Make do with the best there is."

 # ============ 0102 A Flash of Vision ============
 gen_great_work.0102.t: "A Flash of Vision"
 gen_great_work.0102.desc.jewel: "As you are falling asleep, it comes to you: the right way to cut the stone. Not the cut you have been trying for years, but one that will make it hold the light instead of throwing it back. You can see every face of it."
 gen_great_work.0102.desc.chronicle: "You wake knowing how the chronicle must be ordered. Not as a dry list of reigns, but as one story, each age leading into the next. You can see the whole shape of it, beginning to end."
 gen_great_work.0102.desc.regalia: "In a dream you see your heirs one after another, each wearing the crown, and at last you know how it must be made so that it suits every one of them."
 gen_great_work.0102.desc.harp: "You wake with a tuning in your head that no one has used since the oldest songs were new. If you can write it down before you forget it, the harp will be able to play them."
 gen_great_work.0102.desc.lamp: "Walking in the garden at night, you see how the branches must be trained so that the light runs up the trunk and out along every limb like sap. It is so plain now that you wonder how you ever missed it."
 gen_great_work.0102.desc.end: "\n\nIdeas like this do not last. If you do not get it down now, half of it will be gone by morning."
 gen_great_work.0102.a: "Work until it is caught, however long it takes."
 gen_great_work.0102.b: "Write down what I can, and sleep."
 gen_great_work.0102.c: "Wake the court. They should hear this."

 # ============ 0103 The Long Doubt ============
 gen_great_work.0103.t: "The Long Doubt"
 gen_great_work.0103.desc.jewel: "Every morning for years you have held the half-cut stone up to the window. Some mornings it looks like the finest thing ever made, and some mornings it looks like glass. This year it has looked like glass every morning."
 gen_great_work.0103.desc.chronicle: "You read back what you have written of the age, and it reads like every other chronicle: a list of kings and the battles they fought. Whatever you meant to catch is not in it."
 gen_great_work.0103.desc.regalia: "The crown sits on its cushion in the workshop and you can no longer tell whether it is beautiful or only heavy. You catch yourself thinking your heirs would do just as well with plain gold."
 gen_great_work.0103.desc.harp: "You play what you have made so far and hear only a harp. A good one. But it cannot play the oldest songs, and you are no longer sure it ever will."
 gen_great_work.0103.desc.lamp: "The lamp-tree has grown, but its light is thin and flickers in cold weather. Some nights you wonder whether what you are growing is only a pretty tree."
 gen_great_work.0103.desc.end: "\n\nYour people call this the long doubt, and say every maker of a great work meets it sooner or later. Knowing that does not help."
 gen_great_work.0103.a: "Break what is wrong, and make it again."
 gen_great_work.0103.b: "Set it aside for a season."
 gen_great_work.0103.c: "Keep working. The doubt will pass, or it won't."

 # ============ 0104 A Jealous Kinsman ============
 gen_great_work.0104.t: "A Jealous Kinsman"
 gen_great_work.0104.desc.intro: "[gw_kin.GetFirstName] came to the workshop today, and not to admire the work.\n\n"
 gen_great_work.0104.desc.jewel: "\"Half the treasury has gone into that stone,\" [gw_kin.GetSheHe] said. \"Our house could have bought a duchy with it. And when it is done it will have your name on it, and no one else's.\""
 gen_great_work.0104.desc.chronicle: "\"I have read what you wrote about me,\" [gw_kin.GetSheHe] said. \"Three lines, and one of them wrong. Is that how our house will be remembered? As a footnote in your book?\""
 gen_great_work.0104.desc.regalia: "\"They are the regalia of the line,\" [gw_kin.GetSheHe] said, \"and I am of the line. Yet no one has ever asked me what they should look like, or let me near them.\""
 gen_great_work.0104.desc.harp: "\"You spend more hours with that harp than you have spent with any of us in twenty years,\" [gw_kin.GetSheHe] said. \"The whole court hears you playing it at night. They wonder what the rest of us are for.\""
 gen_great_work.0104.desc.lamp: "\"You have given the best ground in the garden to a tree,\" [gw_kin.GetSheHe] said, \"and the best years of your life with it. Some of us would have liked a share of either.\""
 gen_great_work.0104.a: "Then take a part in it. There is work enough for two."
 gen_great_work.0104.b: "The work is mine. You may go."
 gen_great_work.0104.c: "Here. Take this, and leave me in peace."

 # ============ 0105 A Rival's Work ============
 gen_great_work.0105.t: "A Rival's Work"
 gen_great_work.0105.desc.sworn: "Word has come that [gw_rival.GetTitledFirstName] has sworn a great work of [gw_rival.GetHerHis] own, and those who have seen it say it is very fine. Some of them have said so at your table, within your hearing."
 gen_great_work.0105.desc.boast: "[gw_rival.GetTitledFirstName] has been showing [gw_rival.GetHerHis] guests a masterpiece made at [gw_rival.GetHerHis] court, and letting it be known that nothing made at yours will ever match it."
 gen_great_work.0105.desc.jewel: "\n\nYour own stone sits half-cut on the bench. You badly want to see this rival work for yourself, and to hold the two side by side."
 gen_great_work.0105.desc.chronicle: "\n\nYour chronicle is still only half written. You find yourself wondering how [gw_rival.GetSheHe] would tell the same years, and whether [gw_rival.GetSheHe] would tell them better."
 gen_great_work.0105.desc.regalia: "\n\nYour crown is still in pieces on the bench. It is hard not to picture [gw_rival.GetFirstName]'s heirs wearing something finer than yours."
 gen_great_work.0105.desc.harp: "\n\nYour harp still cannot play the oldest songs. You wonder whether [gw_rival.GetFirstName]'s musicians already can."
 gen_great_work.0105.desc.lamp: "\n\nYour lamp-tree is still only a sapling that glows. You catch yourself pacing the garden at night, comparing it to something you have never even seen."
 gen_great_work.0105.a: "Go and see it for myself, and say something kind about it."
 gen_great_work.0105.b: "Then mine will have to be better. Back to work."
 gen_great_work.0105.c: "Let the court know what I think of it."

 # ============ 0106 A Demand to See It ============
 gen_great_work.0106.t: "A Demand to See It"
 gen_great_work.0106.desc.liege: "A letter has come under [gw_asker.GetTitledFirstName]'s seal. [gw_asker.GetSheHe|U] has heard a great deal about the work in your workshop, and as your liege [gw_asker.GetSheHe] wants to see it now, not when it is finished."
 gen_great_work.0106.desc.suitor: "[gw_asker.GetTitledFirstName] has written to you again, warmly. [gw_asker.GetSheHe|U] would like to court you, but first [gw_asker.GetSheHe] wants to see the work you give all your time to. Everyone tells [gw_asker.GetHerHim] you love it more than any living person."
 gen_great_work.0106.desc.neighbour: "An envoy from [gw_asker.GetTitledFirstName] has come to your court with gifts and a single request: [gw_asker.GetSheHe] has heard of your great work, and would have [gw_asker.GetHerHis] envoy see it and describe it to [gw_asker.GetHerHim]."
 gen_great_work.0106.desc.jewel: "\n\nThe stone is only half cut. Seen now, it would look like a fine jewel and nothing more, and whoever saw it would say so."
 gen_great_work.0106.desc.chronicle: "\n\nThe chronicle is half written, and some of what is written is about [gw_asker.GetFirstName]'s own house, not all of it kind."
 gen_great_work.0106.desc.regalia: "\n\nThe crown is not yet gilt, and the sceptre has no head. Shown like this, they would make you look like a pretender."
 gen_great_work.0106.desc.harp: "\n\nThe harp can play, but not yet the songs it was made for. Anyone who hears it now will judge it by what it is now."
 gen_great_work.0106.desc.lamp: "\n\nThe lamp-tree is only a young tree that glows faintly after dark. It will take a visitor on a very clear night to see anything in it at all."
 gen_great_work.0106.a: "Very well. Show it."
 gen_great_work.0106.b: "No one sees it until it is finished."
 gen_great_work.0106.c: "Make something smaller for [gw_asker.GetHerHim], and send that."

 # ============ 0107 The Work and the Hearth ============
 gen_great_work.0107.t: "The Work and the Hearth"
 gen_great_work.0107.desc.spouse: "[gw_hearth.GetFirstName] waited up for you again last night, and fell asleep in the chair. [gw_hearth.GetSheHe|U] has said nothing about it this morning, which is worse than saying something."
 gen_great_work.0107.desc.child: "[gw_hearth.GetFirstName] came to the workshop door today to show you something, and you sent [gw_hearth.GetHerHim] away without looking up. You cannot now remember what it was."
 gen_great_work.0107.desc.jewel: "\n\nThe stone is at the stage where one slip of the hand undoes a month. You have not eaten a meal outside the workshop since spring."
 gen_great_work.0107.desc.chronicle: "\n\nYou spent most of this year in the archive copying out the old records, and hardly any of it with your family."
 gen_great_work.0107.desc.regalia: "\n\nYou have spent more of this year at the forge, making a crown for heirs not yet born, than with the family you already have."
 gen_great_work.0107.desc.harp: "\n\nYou have sat up with the harp every night until the candles burned out, and most nights you have played it alone."
 gen_great_work.0107.desc.lamp: "\n\nYou have been sleeping in the garden under the lamp-tree, to watch how its light changes in the small hours."
 gen_great_work.0107.a: "Put down the tools for a season."
 gen_great_work.0107.b: "The work comes first. They will understand, in time."
 gen_great_work.0107.c: "Bring [gw_hearth.GetFirstName] into the workshop with me."

 # ============ 0108 A Pupil ============
 gen_great_work.0108.t: "A Pupil"
 gen_great_work.0108.desc.intro: "The work has grown too large for one pair of hands, and you have begun to wonder who would carry it on if you died before it was done.\n\n"
 gen_great_work.0108.desc.jewel: "A pupil would have to learn to see light the way you do, and to keep a steady hand for a year at a time."
 gen_great_work.0108.desc.chronicle: "A pupil would have to learn the old scripts, and how to hear the truth in a story told by someone who was lying."
 gen_great_work.0108.desc.regalia: "A pupil would have to learn the smith's craft, and the history of every king who will wear the crown."
 gen_great_work.0108.desc.harp: "A pupil would have to learn the tunings and the songs, and how to track down the old ones no one sings any more."
 gen_great_work.0108.desc.lamp: "A pupil would have to learn the tree: its seasons, its sicknesses, and how to keep its light steady."
 gen_great_work.0108.desc.candidate: "\n\n[gw_candidate.GetFirstName] has been hanging about the workshop door for months, and asks sharp questions."
 gen_great_work.0108.desc.child: " And there is your own child, [gw_child_candidate.GetFirstName], though [gw_child_candidate.GetSheHe] has never asked to learn."
 gen_great_work.0108.a: "Take [gw_candidate.GetFirstName] as my pupil."
 gen_great_work.0108.b: "Teach [gw_child_candidate.GetFirstName]. It should stay in the family."
 gen_great_work.0108.c: "No one is ready. Not yet."
 gen_great_work.0108.pupil.tt: "[gw_candidate.GetFirstName] becomes your pupil in the work"
 gen_great_work.0108.pupil_child.tt: "[gw_child_candidate.GetFirstName] becomes your pupil in the work"

 # ============ 0109 Fire / War ============
 gen_great_work.0109.t.fire: "Fire in the Workshop"
 gen_great_work.0109.t.war: "The War Comes Close"
 gen_great_work.0109.desc.fire: "A lamp went over in the night, and by the time anyone woke the workshop roof was burning. Your servants are carrying water. Your guards are carrying out whoever was sleeping in the rooms above."
 gen_great_work.0109.desc.war: "The war has come closer than anyone expected. Scouts report riders two days from the town where your workshop stands, and your servants want to know what should be carried away first. The work has never been moved. It was never meant to be."
 gen_great_work.0109.desc.jewel: "\n\nThe stone is still in its setting on the bench."
 gen_great_work.0109.desc.chronicle: "\n\nThe volumes of the chronicle stand on the shelves, with the old records you copied them from."
 gen_great_work.0109.desc.regalia: "\n\nThe crown and sceptre lie in pieces on the bench, half gilt."
 gen_great_work.0109.desc.harp: "\n\nThe harp stands where it has always stood, too heavy for one person to lift."
 gen_great_work.0109.desc.lamp: "\n\nThe lamp-tree is rooted in the garden. It cannot be carried anywhere."
 gen_great_work.0109.a: "Save the work. I will see to it with my own hands."
 gen_great_work.0109.b: "The people first. The work can be made again."
 gen_great_work.0109.c.fire: "Pay whatever it takes to save the workshop, and rebuild it in stone."
 gen_great_work.0109.c.war: "Pay for soldiers to hold the town."

 # ============ 0510 The Work Is Finished ============
 gen_great_work.0510.t: "The Work Is Finished"
 gen_great_work.0510.desc.jewel: "You cut the last face of the stone this morning and held it up to the window. The light went into it and stayed there. It is glowing on the bench now, and your servants keep finding reasons to walk past it."
 gen_great_work.0510.desc.chronicle: "You wrote the last line of the chronicle this morning and sat looking at it until the ink was dry. Everything is in it: the kings and the battles, but also the harvests, the songs, and the names of people no one else remembered."
 gen_great_work.0510.desc.regalia: "You set the last stone in the crown this morning, and the sceptre lies beside it on the cushion. Your heirs will wear them for as long as your line lasts."
 gen_great_work.0510.desc.harp: "You tuned the last string this morning and played the oldest of the old songs, all the way through, and it was right. The servants who heard it through the door have not been able to say what it sounded like. They only say they stopped what they were doing."
 gen_great_work.0510.desc.lamp: "Last night the lamp-tree came into full light for the first time, every branch, and it has not gone dark since. The whole garden is lit by it. The gardeners say they can read by it at midnight."
 gen_great_work.0510.desc.hands: "\n\nYou did not begin this work. You took it up after its maker died, and you think they would be glad to see it finished."
 gen_great_work.0510.desc.one_hand: "\n\nYou swore to make it long ago, when you were young."
 gen_great_work.0510.desc.end: "\n\nYou have put down your tools, and you find you have no wish to pick them up again. The work is done, and most of your life has gone into it."
 gen_great_work.0510.a: "Unveil it before the whole court."
 gen_great_work.0510.b: "Let [gw_pupil.GetFirstName] unveil it. Half of it is [gw_pupil.GetHerHis] work now."
 gen_great_work.0510.c: "Dedicate it to my house, and to those who came before."
 gen_great_work.0510.d: "Show it to no one yet. Sit with it a while."

 # ============ 0601 The Maker's Last Wish ============
 gen_great_work.0601.t: "The Maker's Last Wish"
 gen_great_work.0601.desc.intro: "Among [gw_dead_maker.GetFirstName]'s papers in the workshop was a letter addressed to you, sealed, written some years ago by the look of the ink.\n\n"
 gen_great_work.0601.desc.jewel: "\"If I die before the stone is finished,\" it says, \"give it to [gw_pupil.GetFirstName]. [gw_pupil.GetSheHe|U] sees the light in it the way I do, and no one else ever will.\""
 gen_great_work.0601.desc.chronicle: "\"If I die before the chronicle is finished,\" it says, \"give it to [gw_pupil.GetFirstName]. [gw_pupil.GetSheHe|U] knows where every record is, and which of them lie.\""
 gen_great_work.0601.desc.regalia: "\"If I die before the regalia are finished,\" it says, \"give them to [gw_pupil.GetFirstName] to finish. The line will wear them either way. Let the hand that finishes them be one that knows them.\""
 gen_great_work.0601.desc.harp: "\"If I die before the harp is finished,\" it says, \"give it to [gw_pupil.GetFirstName]. [gw_pupil.GetSheHe|U] has heard me play every song I found. No one else has.\""
 gen_great_work.0601.desc.lamp: "\"If I die before the lamp-tree is grown,\" it says, \"give it to [gw_pupil.GetFirstName]. [gw_pupil.GetSheHe|U] knows it better than I know it, now.\""
 gen_great_work.0601.desc.end: " \"Do not seal it away. Please.\"\n\n[gw_pupil.GetFirstName] is waiting outside. [gw_pupil.GetSheHe|U] does not know what the letter says, but [gw_pupil.GetSheHe] can guess."
 gen_great_work.0601.a: "Then it goes to [gw_pupil.GetFirstName], as [gw_dead_maker.GetFirstName] wished."
 gen_great_work.0601.b: "A letter is not a will. I will decide this myself."

 # ============ 0602 The Unfinished Work ============
 gen_great_work.0602.t: "The Unfinished Work"
 gen_great_work.0602.desc.intro: "[gw_dead_maker.GetFirstName] is dead, and the work [gw_dead_maker.GetSheHe] swore to is not finished. It has come to you to decide what becomes of it.\n\n"
 gen_great_work.0602.desc.jewel: "The stone sits in its setting on the bench, half cut. In the right light you can see what it was going to be."
 gen_great_work.0602.desc.chronicle: "The chronicle stands on the shelves, volume after volume, and stops in the middle of a page."
 gen_great_work.0602.desc.regalia: "The crown and sceptre lie on their cushion, fine and unfinished. The line has been waiting a long time for them."
 gen_great_work.0602.desc.harp: "The harp stands in the corner of the workshop where [gw_dead_maker.GetFirstName] left it. No one has touched the strings since."
 gen_great_work.0602.desc.lamp: "The lamp-tree still glows in the garden. The gardeners say it has been dimmer since the funeral, though that may only be grief."
 gen_great_work.0602.desc.you_pupil: "\n\nYou learned it at [gw_dead_maker.GetFirstName]'s side. No one alive knows it better."
 gen_great_work.0602.desc.pupil: "\n\n[gw_pupil.GetFirstName], [gw_dead_maker.GetFirstName]'s pupil, has barely left the workshop since the funeral."
 gen_great_work.0602.desc.no_pupil: "\n\n[gw_dead_maker.GetFirstName] never took a pupil. No one knows the work as [gw_dead_maker.GetSheHe] did."
 gen_great_work.0602.desc.claimant: "\n\n[gw_claimant.GetFirstName] has let it be known that [gw_claimant.GetSheHe] would carry it on, if you will not."
 gen_great_work.0602.desc.not_you: "\n\nWhatever becomes of it, you are in no position to take it up yourself."
 gen_great_work.0602.a: "I will take it up myself."
 gen_great_work.0602.b: "Give it to [gw_pupil.GetFirstName], who knows it best."
 gen_great_work.0602.c: "Give it to [gw_claimant.GetFirstName]."
 gen_great_work.0602.d: "Seal it away as it is."

 # ============ 0603 The Pupil's Plea ============
 gen_great_work.0603.t: "The Pupil's Plea"
 gen_great_work.0603.desc.intro: "[gw_pupil.GetFirstName] was waiting for you outside the workshop. [gw_pupil.GetSheHe|U] had already heard what you decided.\n\n\"[gw_dead_maker.GetFirstName] did not give [gw_dead_maker.GetHerHis] life to this so it could sit behind a locked door,\" [gw_pupil.GetSheHe] said. "
 gen_great_work.0603.desc.jewel: "\"I know every face of that stone, and every one still to be cut."
 gen_great_work.0603.desc.chronicle: "\"I know every record the chronicle was drawn from, and every one still to be read."
 gen_great_work.0603.desc.regalia: "\"I know how every piece of that crown was made, and how the rest must be."
 gen_great_work.0603.desc.harp: "\"I know every tuning of that harp, and every song still missing from it."
 gen_great_work.0603.desc.lamp: "\"I know every branch of that tree, and how it must be tended through the winter."
 gen_great_work.0603.desc.end: " Let me finish it. I will never ask you for anything else.\""
 gen_great_work.0603.a: "Very well. Finish it."
 gen_great_work.0603.b: "No. It stays as [gw_dead_maker.GetSheHe] left it."
 gen_great_work.0603.b.toast: "The Work Is Sealed Away"
 gen_great_work.0603.b.toast.tt: "[gw_decider.GetFirstName] would not let you finish [gw_dead_maker.GetFirstName]'s work. It has been sealed away as it was."

 # ============ 0604 A Rival Claim ============
 gen_great_work.0604.t: "A Rival Claim"
 gen_great_work.0604.desc.intro: "You had barely said that you would take up the work when [gw_claimant.GetFirstName] came to find you.\n\n\"[gw_dead_maker.GetFirstName] gave [gw_dead_maker.GetHerHis] whole life to it,\" [gw_claimant.GetSheHe] said. \"It should go to someone who will give it the same. "
 gen_great_work.0604.desc.landed: "You have a realm to rule. I have nothing but time.\""
 gen_great_work.0604.desc.unlanded: "You have your own life to lead. I would give mine to it.\""
 gen_great_work.0604.a: "It is mine to carry."
 gen_great_work.0604.b: "Then you carry it."
 gen_great_work.0604.c: "If we must quarrel over it, no one will have it. Seal it away."
 gen_great_work.0604.a.toast: "The Work Goes to Another"
 gen_great_work.0604.a.toast.tt: "[gw_decider.GetFirstName] has taken up [gw_dead_maker.GetFirstName]'s work, and will not share it."
 gen_great_work.0604.c.toast: "The Work Is Sealed Away"
 gen_great_work.0604.c.toast.tt: "Rather than quarrel over it, [gw_decider.GetFirstName] has sealed [gw_dead_maker.GetFirstName]'s work away as it was."

 # ============ Beat modifiers ============
 gen_gw_beat_true_material_modifier: "The True Material"
 gen_gw_beat_true_material_modifier_desc: "This character found what no market sells for the great work, and people are still talking about it."
 gen_gw_beat_caught_vision_modifier: "The Vision Caught"
 gen_gw_beat_caught_vision_modifier_desc: "This character is working at the edge of what they can do, and it shows."
 gen_gw_beat_long_doubt_modifier: "The Long Doubt"
