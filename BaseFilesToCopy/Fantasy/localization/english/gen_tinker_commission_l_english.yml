l_english:
 gen_tinker.0450.desc.fooled: "\n\nIt is also not what you asked for. [gen_tk_tinkerer.GetFirstName] agreed to your terms and then built it [gen_tk_tinkerer.GetHerHis] own way."
 gen_tinker.0450.desc.fooled_masterwork: "\n\nIt is not what you asked for. [gen_tk_tinkerer.GetFirstName] built it [gen_tk_tinkerer.GetHerHis] own way, and it is better than anything you would have thought to ask."
 gen_tk_commission_bench_full.t: "Commission Not Taken"
 gen_tk_commission_bench_full.tt: "[recipient.GetShortUIName] had already started a project of [recipient.GetHerHis] own by the time your offer arrived. No gold changed hands."
 # ============ Commission a Contraption (interaction) ============
 gen_tk_commission_interaction: "Commission a Contraption"
 gen_tk_commission_interaction_desc: "Pay [recipient.GetFirstName] to build you a contraption at [recipient.GetHerHis] workbench. You pay for the materials and a fee to [recipient.GetHerHim]; the work takes eight months to a year and a half, depending on what you ask for, and the result is yours, whatever it turns out to be."
 gen_tk_commission_interaction_notification: "I hear you are clever with springs and gears. I would like to hire you to build something for me."
 gen_tk_commission_options_heading: "What to build"
 gen_tk_commission_option_curio: "A clockwork curio (#V $PRICE_CURIO|0$#! gold)"
 gen_tk_commission_option_curio_desc: "A ticking marvel for your court: a mechanical songbird, or an orrery for a royal court (with Fate of Iberia)"
 gen_tk_commission_option_mill: "Waterworks (#V $PRICE_MILL|0$#! gold)"
 gen_tk_commission_option_mill_desc: "Wheels, pumps and sluices for your capital county. They last twenty years"
 gen_tk_commission_option_engine: "A war engine (#V $PRICE_ENGINE|0$#! gold)"
 gen_tk_commission_option_engine_desc: "Something large, wooden and deeply unpleasant to stand in front of"
 gen_tk_commission_option_limb: "A clockwork limb (#V $PRICE_LIMB|0$#! gold)"
 gen_tk_commission_option_limb_desc: "A brass hand or leg to replace the one you lost"
 gen_tk_commission_busy_tt: "[recipient.GetFirstName] already has a project on the bench"
 gen_tk_commission_unskilled_tt: "[recipient.GetFirstName] needs at least 12 [learning|E] to take a commission"
 gen_tk_commission_resting_tt: "[recipient.GetFirstName] finished a commission less than a year ago, and is not taking another yet"
 gen_tk_commission_already_waiting_tt: "You are already waiting on a contraption you commissioned"
 gen_tk_commission_cannot_afford_tt: "You cannot afford this commission"
 gen_tk_commission_accepted.tt: "[recipient.GetFirstName] starts work on your contraption. You will hear from [recipient.GetHerHim] when it is done"
 gen_tk_commission_declined.t: "Commission Declined"
 gen_tk_commission_declined.tt: "[recipient.GetFirstName] thanks you kindly, but will not take the work. No gold has changed hands."

 # AI acceptance reasons
 gen_tk_ai_paid_work: "Paid work: $VALUE|=+0$"
 gen_tk_ai_fee: "The fee: $VALUE|=+0$"
 gen_tk_ai_subject: "You are [recipient.GetHerHis] lord: $VALUE|=+0$"
 gen_tk_ai_greedy: "[GetTrait('greedy').GetName( GetNullCharacter )], likes the money: $VALUE|=+0$"
 gen_tk_ai_diligent: "[GetTrait('diligent').GetName( GetNullCharacter )], likes the work: $VALUE|=+0$"
 gen_tk_ai_ambitious: "[GetTrait('ambitious').GetName( GetNullCharacter )], a chance to be known: $VALUE|=+0$"
 gen_tk_ai_lazy: "[GetTrait('lazy').GetName( GetNullCharacter )], a year or more of work: $VALUE|=+0$"
 gen_tk_ai_at_war: "Busy with a war: $VALUE|=+0$"
 gen_tk_ai_rival: "Will not work for a rival: $VALUE|=+0$"
 gen_tk_ai_race_dwarf: "Admires your people's craft: $VALUE|=+0$"
 gen_tk_ai_race_warm: "Gets on with your people: $VALUE|=+0$"
 gen_tk_ai_race_wary: "Wary of your people: $VALUE|=+0$"

 # ============ Hurry the Commission (interaction) ============
 gen_tk_hurry_commission_interaction: "Hurry the Commission"
 gen_tk_hurry_commission_interaction_desc: "Write to [recipient.GetFirstName] and ask how much longer your contraption will take. Politely, or not. If [recipient.GetSheHe] agrees to hurry, every remaining stage comes a quarter sooner, at some risk to the work. Nobody likes being hurried."
 gen_tk_hurry_already_tt: "You have already written to [recipient.GetFirstName] about this commission"
 gen_tk_hurry_too_late_tt: "The test day is already set; there is nothing left to hurry"
 gen_tk_hurry_commission.tt: "[recipient.GetFirstName] will answer your letter, and will think a little less of you for sending it"

 # ============ A commission lost ============
 gen_tk_commission_lost.t: "Commission Lost"
 gen_tk_commission_lost_death.tt: "[gen_tk_c_lost_maker.GetFirstName] has died with your contraption half-built. [gen_tk_c_lost_maker.GetHerHis] family sells the unused brass and sends back half of what you paid."
 gen_tk_commission_lost_abandoned.tt: "[gen_tk_c_lost_maker.GetFirstName] can no longer work, and your contraption will not be finished. Half of what you paid is returned."
 gen_tk_commission_lost_prison.tt: "[gen_tk_c_lost_maker.GetFirstName] has been thrown in a cell, and your contraption will not be finished. Half of what you paid is returned from [gen_tk_c_lost_maker.GetHerHis] workshop."

 # ============ 0401: the hurry letter ============
 gen_tinker.0401.t: "A Letter from Your Patron"
 gen_tinker.0401.desc: "A letter from [gen_tk_c_patron.GetTitledFirstName] has arrived, and it is not about the weather. [gen_tk_c_patron.GetSheHe|U] would like to know where [gen_tk_c_patron.GetHerHis] contraption is, why it is not finished, and whether you have been sleeping.\n\nYou have, a little."
 gen_tinker.0401.a: "I'll work through the nights."
 gen_tinker.0401.b: "Tell [gen_tk_c_patron.GetHerHim] genius cannot be hurried."
 gen_tinker.0401.c: "Faster work needs better parts, and better parts cost gold."
 gen_tinker.0401.c.tt: "[gen_tk_c_patron.GetFirstName] decides: if [gen_tk_c_patron.GetSheHe] pays, you get the gold and the work is #V hurried#! and a little better; if not, nothing changes"
 gen_tinker.0401.a.toast: "Working Through the Nights"
 gen_tinker.0401.a.toast.tt: "[gen_tk_c_root.GetFirstName] promises to work day and night on [gen_tk_c_patron.GetFirstNamePossessive] contraption."
 gen_tinker.0401.b.toast: "Genius Cannot Be Hurried"
 gen_tinker.0401.b.toast.tt: "[gen_tk_c_root.GetFirstName] writes back that the contraption will be done when it is done, and not a day sooner."

 # ============ 0402: better parts ============
 gen_tinker.0402.t: "Faster Parts Cost Gold"
 gen_tinker.0402.desc: "[gen_tk_c_maker.GetFirstName] has answered your letter. The work would go faster, [gen_tk_c_maker.GetSheHe] writes, with better springs and harder brass, and those do not come cheap. The letter ends with a sum, underlined twice."
 gen_tinker.0402.a: "Fine. Buy the good springs."
 gen_tinker.0402.b: "I have paid enough already."
 gen_tinker.0402.a.tt: "Better springs let [gen_tk_c_maker.GetFirstName] work faster, and a little better too"
 gen_tinker.0402.a.toast: "Better Parts"
 gen_tinker.0402.a.toast.tt: "[gen_tk_c_root.GetFirstName] has paid for better parts. They go straight into the work."
 gen_tinker.0402.a.late.tt: "[gen_tk_c_root.GetFirstName] has paid for better parts, but there is no longer a contraption to put them in. [gen_tk_c_maker.GetFirstName] keeps the gold."
 gen_tinker.0402.b.toast: "No More Gold"
 gen_tinker.0402.b.toast.tt: "[gen_tk_c_root.GetFirstName] will not pay for better parts. The work goes on as before."

 # ============ 0450: the delivery ============
 gen_tinker.0450.t.masterwork: "A Masterwork Delivered"
 gen_tinker.0450.t.works: "The Contraption Arrives"
 gen_tinker.0450.t.dud: "A Dud Delivered"
 gen_tinker.0450.t.explodes: "Up in Smoke"
 gen_tinker.0450.desc.curio: "[gen_tk_tinkerer.GetFirstNamePossessive] cart rolls into your courtyard with the clockwork curio you paid for, wrapped in three blankets and a great deal of string. "
 gen_tinker.0450.desc.mill: "[gen_tk_tinkerer.GetFirstName] arrives with the plans, the brass and the wheels for the waterworks you paid for, and a crew already ankle-deep in your river. "
 gen_tinker.0450.desc.engine: "Eleven crates arrive from [gen_tk_tinkerer.GetFirstNamePossessive] workshop: the war engine you paid for, and a note asking you not to stand in front of it. "
 gen_tinker.0450.desc.limb: "[gen_tk_tinkerer.GetFirstName] arrives in person with the clockwork limb you paid for, in a box lined with velvet. "
 gen_tinker.0450.desc.masterwork: "It is better than promised. It ticks, it turns, it does everything [gen_tk_tinkerer.GetSheHe] said it would and two things [gen_tk_tinkerer.GetSheHe] did not mention. Half your court has come out to look at it."
 gen_tinker.0450.desc.works: "It works. It squeaks a little and smells of oil, but it does what you paid for."
 gen_tinker.0450.desc.dud: "It does not work. [gen_tk_tinkerer.GetFirstName] turns every crank twice, taps the casing, apologises, and turns them again. Nothing happens."
 gen_tinker.0450.desc.explodes: "It did not survive its final test. [gen_tk_tinkerer.GetFirstName] has sent what is left of it anyway, along with a long letter that uses the word 'regrettable' nine times."
 gen_tinker.0450.desc.end: "\n\n[gen_tk_tinkerer.GetFirstName] is waiting to hear what you think."
 gen_tinker.0450.good.a: "Here is something extra for your trouble."
 gen_tinker.0450.good.b: "I owe you one."
 gen_tinker.0450.good.c: "It works. That is what I paid for."
 gen_tinker.0450.dud.a: "I want half the fee back."
 gen_tinker.0450.dud.b: "These things happen."
 gen_tinker.0450.dud.c: "Put it in the garden. Let the court have a laugh."
 gen_tinker.0450.boom.a: "Everyone will hear whose fault this was."
 gen_tinker.0450.boom.b: "I want half the fee back."
 gen_tinker.0450.boom.c: "Well, it certainly did something."
 gen_tinker.0450.good.a.toast: "A Bonus from Your Patron"
 gen_tinker.0450.good.a.toast.tt: "[gen_tk_c_root.GetFirstName] is pleased with the contraption and pays [gen_tk_tinkerer.GetFirstName] a little extra."
 gen_tinker.0450.good.b.toast: "A Favor Owed"
 gen_tinker.0450.good.b.toast.tt: "[gen_tk_c_root.GetFirstName] is delighted with the contraption, and says [gen_tk_c_root.GetSheHe] owes [gen_tk_tinkerer.GetFirstName] one."
 gen_tinker.0450.good.c.toast: "Paid in Full"
 gen_tinker.0450.good.c.toast.tt: "[gen_tk_c_root.GetFirstName] takes delivery of the contraption. The account is settled, and that is all."
 gen_tinker.0450.refund.toast: "Your Patron Wants a Refund"
 gen_tinker.0450.refund.toast.tt: "[gen_tk_c_root.GetFirstName] is not happy with the contraption, and wants half of [gen_tk_tinkerer.GetFirstNamePossessive] fee back."
 gen_tinker.0450.forgive.toast: "Your Patron Takes It Well"
 gen_tinker.0450.forgive.toast.tt: "[gen_tk_c_root.GetFirstName] shrugs off the dud. These things happen, [gen_tk_c_root.GetSheHe] says."
 gen_tinker.0450.laugh.toast.tt: "[gen_tk_c_root.GetFirstName] laughs off the explosion. Nobody important was standing near it."
 gen_tinker.0450.mock.toast: "Your Dud on Display"
 gen_tinker.0450.mock.toast.tt: "[gen_tk_c_root.GetFirstName] has put [gen_tk_tinkerer.GetFirstNamePossessive] dud in the garden, where the whole court can laugh at it."
 gen_tinker.0450.blame.toast: "Blamed for the Blast"
 gen_tinker.0450.blame.toast.tt: "[gen_tk_c_root.GetFirstName] is telling everyone that the explosion was [gen_tk_tinkerer.GetFirstNamePossessive] fault."
