l_english:
 # RACE PHENOTYPE TRAITS (Generic Descriptions for Ruler Designer & Encyclopedia)
 trait_phenotype_human:0 "Human"
 trait_phenotype_human_desc:0 "Short-lived and endlessly adaptable, humans learn quickly, multiply faster than any of the elder peoples, and treat every corner of the world as somewhere to settle."
 trait_phenotype_human_character_desc:0 "Short-lived and endlessly adaptable, [ROOT.GetCharacter.GetFirstNameNoTooltip] carries the restless ambition of humankind."

 trait_phenotype_gracile:0 "Gracile"
 trait_phenotype_gracile_desc:0 "Possessing an elongated, lithesome build and sharp bone structure, individuals with this trait move with natural poise and effortless grace."
 trait_phenotype_gracile_character_desc:0 "Possessing an elongated, lithesome build and sharp bone structure, [ROOT.GetCharacter.GetFirstNameNoTooltip] moves with natural poise and effortless grace."

 trait_phenotype_sylvan:0 "Sylvan"
 trait_phenotype_sylvan_desc:0 "Lean, sharp-featured and at home beneath the canopy, individuals with this trait carry a hunter's wiry strength and move through wild country without a sound."
 trait_phenotype_sylvan_character_desc:0 "Lean, sharp-featured and at home beneath the canopy, [ROOT.GetCharacter.GetFirstNameNoTooltip] carries a hunter's wiry strength and moves through wild country without a sound."

 trait_phenotype_stocky:0 "Stocky"
 trait_phenotype_stocky_desc:0 "Built low to the ground with broad shoulders and dense bone structure, individuals with this trait possess immense physical stamina and stability."
 trait_phenotype_stocky_character_desc:0 "Built low to the ground with broad shoulders and dense bone structure, [ROOT.GetCharacter.GetFirstNameNoTooltip] possesses immense physical stamina and stability."

 trait_phenotype_rough_hewn:0 "Rough-Hewn"
 trait_phenotype_rough_hewn_desc:0 "Marked by a pronounced brow, heavy jaw, and thick skin, individuals with this trait are naturally intimidating and hardened against hardship."
 trait_phenotype_rough_hewn_character_desc:0 "Marked by a pronounced brow, heavy jaw, and thick skin, [ROOT.GetCharacter.GetFirstNameNoTooltip] is naturally intimidating and hardened against hardship."

 trait_phenotype_towering:0 "Towering"
 trait_phenotype_towering_desc:0 "Standing heads above others with massive physical reach, individuals with this trait command an overwhelming presence on and off the battlefield."
 trait_phenotype_towering_character_desc:0 "Standing heads above others with massive physical reach, [ROOT.GetCharacter.GetFirstNameNoTooltip] commands an overwhelming presence on and off the battlefield."

 trait_phenotype_diminutive:0 "Diminutive"
 trait_phenotype_diminutive_desc:0 "Small in stature and light of step, individuals with this trait slip through tight spaces and pass unnoticed in a crowd, and make up for their size with a quick mind."
 trait_phenotype_diminutive_character_desc:0 "Small in stature and light of step, [ROOT.GetCharacter.GetFirstNameNoTooltip] slips through tight spaces, passes unnoticed in a crowd, and makes up for [ROOT.GetCharacter.GetHerHis] size with a quick mind."

 trait_phenotype_dusk_adapted:0 "Umbral"
 trait_phenotype_dusk_adapted_desc:0 "Born to the twilight of the fens, where mist hangs over the reeds from dusk to dawn, individuals with this trait see clearly in half-light and keep their own counsel, and few secrets get past them."
 trait_phenotype_dusk_adapted_character_desc:0 "Born to the twilight of the fens, where mist hangs over the reeds from dusk to dawn, [ROOT.GetCharacter.GetFirstNameNoTooltip] sees clearly in half-light, keeps [ROOT.GetCharacter.GetHerHis] own counsel, and lets few secrets slip past."

 trait_phenotype_horned:0 "Horned"
 trait_phenotype_horned_desc:0 "Born of the horned people, herders of the high pastures and the open steppe. Their horns grow from the brow in childhood and are as ordinary among their own kind as a beard is to others."
 trait_phenotype_horned_character_desc:0 "Born of the horned people, [ROOT.GetCharacter.GetFirstNameNoTooltip] carries the horns of [ROOT.GetCharacter.GetHerHis] kin and the hardiness of a life spent with the herds."

 # HORNBORN
 trait_hornborn:0 "Hornborn"
 trait_hornborn_desc:0 "Born with horns to a people who have none. Some trace it to horned blood somewhere in the line; others call it an ill omen. Strangers stare, and the Hornborn keep close to one another."
 trait_hornborn_character_desc:0 "Born with horns to a people who have none, [ROOT.GetCharacter.GetFirstNameNoTooltip] draws stares wherever [ROOT.GetCharacter.GetSheHe] goes, and finds a ready friend in any other Hornborn."

 gen_file_horns_decision:0 "File Down Horns"
 gen_file_horns_decision_desc:0 "Horns can be sawn and filed down to stumps. Without them a Hornborn draws no stares and makes a match more easily, but inspires no fear either. They grow back within a few years."
 gen_file_horns_decision_tooltip:0 "File your horns down to stumps for the next five years."
 gen_file_horns_decision_confirm:0 "Fetch the file"
 gen_file_horns_still_growing:0 "Your horns have not yet grown back"

 gen_filed_horns_modifier:0 "Filed Horns"
 gen_filed_horns_modifier_desc:0 "This character has filed their horns down to stumps. They draw no stares for it, and no fear. The horns will grow back."

 gen_tusk_broken_toast:0 "A Tusk Snapped"

 # Marriage stuff
 AI_DIFFERENT_RACE_MARRIAGE_PENALTY:0 "Different Heritage/Race: $VALUE|=+0$"
 AI_HORNS_SHOWING_MARRIAGE_PENALTY:0 "Hornborn, Horns Showing: $VALUE|=+0$"
