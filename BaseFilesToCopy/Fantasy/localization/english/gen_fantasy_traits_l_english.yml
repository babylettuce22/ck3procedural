l_english:
 # RACE PHENOTYPE TRAITS (Generic Descriptions for Ruler Designer & Encyclopedia)
 trait_phenotype_human:0 "Human"
 trait_phenotype_human_desc:0 "Short-lived and endlessly adaptable, humans learn quickly, multiply faster than any of the elder peoples, and treat every corner of the world as somewhere to settle.\n\n$gen_race_ties_human$"
 trait_phenotype_human_character_desc:0 "Short-lived and endlessly adaptable, [ROOT.GetCharacter.GetFirstNameNoTooltip] carries the restless ambition of humankind.\n\n$gen_race_ties_human$"

 trait_phenotype_gracile:0 "Gracile"
 trait_phenotype_gracile_desc:0 "Possessing an elongated, lithesome build and sharp bone structure, individuals with this trait move with natural poise and effortless grace.\n\n$gen_race_ties_gracile$"
 trait_phenotype_gracile_character_desc:0 "Possessing an elongated, lithesome build and sharp bone structure, [ROOT.GetCharacter.GetFirstNameNoTooltip] moves with natural poise and effortless grace.\n\n$gen_race_ties_gracile$"

 trait_phenotype_sylvan:0 "Sylvan"
 trait_phenotype_sylvan_desc:0 "Lean, sharp-featured and at home beneath the canopy, individuals with this trait carry a hunter's wiry strength and move through wild country without a sound.\n\n$gen_race_ties_sylvan$"
 trait_phenotype_sylvan_character_desc:0 "Lean, sharp-featured and at home beneath the canopy, [ROOT.GetCharacter.GetFirstNameNoTooltip] carries a hunter's wiry strength and moves through wild country without a sound.\n\n$gen_race_ties_sylvan$"

 trait_phenotype_stocky:0 "Stocky"
 trait_phenotype_stocky_desc:0 "Built low to the ground with broad shoulders and dense bone structure, individuals with this trait possess immense physical stamina and stability.\n\n$gen_race_ties_stocky$"
 trait_phenotype_stocky_character_desc:0 "Built low to the ground with broad shoulders and dense bone structure, [ROOT.GetCharacter.GetFirstNameNoTooltip] possesses immense physical stamina and stability.\n\n$gen_race_ties_stocky$"

 trait_phenotype_rough_hewn:0 "Rough-Hewn"
 trait_phenotype_rough_hewn_desc:0 "Marked by a pronounced brow, heavy jaw, and thick skin, individuals with this trait are naturally intimidating and hardened against hardship. Few of them live to grow old; the ones who do have usually earned it.\n\n$gen_race_ties_rough_hewn$"
 trait_phenotype_rough_hewn_character_desc:0 "Marked by a pronounced brow, heavy jaw, and thick skin, [ROOT.GetCharacter.GetFirstNameNoTooltip] is naturally intimidating and hardened against hardship. Few orcs live to grow old; the ones who do have usually earned it.\n\n$gen_race_ties_rough_hewn$"

 trait_phenotype_towering:0 "Towering"
 trait_phenotype_towering_desc:0 "Standing heads above others with massive physical reach, individuals with this trait command an overwhelming presence on and off the battlefield.\n\n$gen_race_ties_towering$"
 trait_phenotype_towering_character_desc:0 "Standing heads above others with massive physical reach, [ROOT.GetCharacter.GetFirstNameNoTooltip] commands an overwhelming presence on and off the battlefield.\n\n$gen_race_ties_towering$"

 trait_phenotype_diminutive:0 "Diminutive"
 trait_phenotype_diminutive_desc:0 "Small in stature and light of step, individuals with this trait slip through tight spaces and pass unnoticed in a crowd, and make up for their size with a quick mind.\n\n$gen_race_ties_diminutive$"
 trait_phenotype_diminutive_character_desc:0 "Small in stature and light of step, [ROOT.GetCharacter.GetFirstNameNoTooltip] slips through tight spaces, passes unnoticed in a crowd, and makes up for [ROOT.GetCharacter.GetHerHis] size with a quick mind.\n\n$gen_race_ties_diminutive$"

 trait_phenotype_dusk_adapted:0 "Umbral"
 trait_phenotype_dusk_adapted_desc:0 "Born to the twilight of the fens, where mist hangs over the reeds from dusk to dawn, individuals with this trait see clearly in half-light and keep their own counsel, and few secrets get past them.\n\n$gen_race_ties_dusk_adapted$"
 trait_phenotype_dusk_adapted_character_desc:0 "Born to the twilight of the fens, where mist hangs over the reeds from dusk to dawn, [ROOT.GetCharacter.GetFirstNameNoTooltip] sees clearly in half-light, keeps [ROOT.GetCharacter.GetHerHis] own counsel, and lets few secrets slip past.\n\n$gen_race_ties_dusk_adapted$"

 trait_phenotype_horned:0 "Horned"
 trait_phenotype_horned_desc:0 "Ash-grey to ember-red of skin, with eyes of amber or gold and horns that rise from the brow in childhood, the horned people are marked at a glance. Other peoples whisper about where that blood came from; the horned themselves are proud of it, and slow to forgive those who whisper.\n\n$gen_race_ties_horned$"
 trait_phenotype_horned_character_desc:0 "Ash-grey to ember-red of skin, with eyes of amber or gold and the horns of [ROOT.GetCharacter.GetHerHis] kin, [ROOT.GetCharacter.GetFirstNameNoTooltip] is marked at a glance, and carries the pride of a people others whisper about.\n\n$gen_race_ties_horned$"

 # RACE TIES: a readable copy of the `compatibility` blocks in common/traits/00_phenotype_traits.txt,
 # appended to both descriptions of each race trait. Keep in step with that file by hand.
 # Kin = @race_kin (+15), friendly = @race_warm (+5), wary = @race_cool (-5), hostile = @race_hostile (-15).
 gen_race_ties_human:0 "#weak Friendly to $trait_phenotype_human$ and $trait_phenotype_diminutive$ folk. Wary of $trait_phenotype_rough_hewn$ and $trait_phenotype_dusk_adapted$ folk.#!"
 gen_race_ties_gracile:0 "#weak Kin to other $trait_phenotype_gracile$ folk. Friendly to $trait_phenotype_sylvan$ folk. Wary of $trait_phenotype_stocky$ folk. Hostile to $trait_phenotype_rough_hewn$ and $trait_phenotype_dusk_adapted$ folk.#!"
 gen_race_ties_sylvan:0 "#weak Kin to other $trait_phenotype_sylvan$ folk. Friendly to $trait_phenotype_gracile$ folk. Wary of $trait_phenotype_stocky$ and $trait_phenotype_dusk_adapted$ folk. Hostile to $trait_phenotype_rough_hewn$ folk.#!"
 gen_race_ties_stocky:0 "#weak Kin to other $trait_phenotype_stocky$ folk. Friendly to $trait_phenotype_diminutive$ folk. Wary of $trait_phenotype_gracile$, $trait_phenotype_sylvan$ and $trait_phenotype_towering$ folk. Hostile to $trait_phenotype_rough_hewn$ folk.#!"
 gen_race_ties_rough_hewn:0 "#weak Friendly to $trait_phenotype_rough_hewn$ and $trait_phenotype_towering$ folk. Wary of $trait_phenotype_human$ and $trait_phenotype_diminutive$ folk. Hostile to $trait_phenotype_gracile$, $trait_phenotype_sylvan$ and $trait_phenotype_stocky$ folk.#!"
 gen_race_ties_towering:0 "#weak Friendly to $trait_phenotype_towering$ and $trait_phenotype_rough_hewn$ folk. Wary of $trait_phenotype_diminutive$ folk.#!"
 gen_race_ties_diminutive:0 "#weak Kin to $trait_phenotype_stocky$ folk. Friendly to $trait_phenotype_diminutive$ and $trait_phenotype_human$ folk. Wary of $trait_phenotype_towering$ and $trait_phenotype_rough_hewn$ folk.#!"
 gen_race_ties_dusk_adapted:0 "#weak Kin to other $trait_phenotype_dusk_adapted$ folk. Wary of $trait_phenotype_human$ and $trait_phenotype_sylvan$ folk. Hostile to $trait_phenotype_gracile$ folk.#!"
 gen_race_ties_horned:0 "#weak Kin to other $trait_phenotype_horned$ folk. Wary of $trait_phenotype_human$, $trait_phenotype_gracile$, $trait_phenotype_stocky$ and $trait_phenotype_diminutive$ folk.#!"

 # HORNBORN
 trait_hornborn:0 "Hornborn"
 trait_hornborn_desc:0 "Born with horns to a people who have none. Some trace it to horned blood somewhere in the line; others call it an ill omen. Strangers stare, and the Hornborn keep close to one another."
 trait_hornborn_character_desc:0 "Born with horns to a people who have none, [ROOT.GetCharacter.GetFirstNameNoTooltip] draws stares wherever [ROOT.GetCharacter.GetSheHe] goes, and finds a ready friend in any other Hornborn."

 gen_file_horns_decision:0 "File Down Horns"
 gen_file_horns_decision_desc:0 "Horns can be sawn and filed down to stumps. Without them a Hornborn draws no stares and makes a match more easily, but inspires no fear either. They grow back within a few years."
 gen_file_horns_decision_tooltip:0 "File your horns down to stumps for the next five years."
 gen_file_horns_decision_confirm:0 "Fetch the file"
 gen_file_horns_still_growing:0 "Your horns have not yet grown back"

 gen_filed_horns_modifier:0 "Filed Horns"
 gen_filed_horns_modifier_desc:0 "This character has filed their horns down to stumps. They draw no stares for it, and no fear. The horns will grow back."

 gen_tusk_broken_toast:0 "A Tusk Snapped"

 # Marriage stuff
 AI_DIFFERENT_RACE_MARRIAGE_PENALTY:0 "Different Heritage/Race: $VALUE|=+0$"
 AI_FRIENDLY_RACE_MARRIAGE_PENALTY:0 "Different Race, Friendly Peoples: $VALUE|=+0$"
 AI_HOSTILE_RACE_MARRIAGE_PENALTY:0 "Different Race, Old Enemies: $VALUE|=+0$"
 AI_HORNS_SHOWING_MARRIAGE_PENALTY:0 "Hornborn, Horns Showing: $VALUE|=+0$"
