l_english:
 # ============ The Blood Right (tradition) ============
 tradition_gen_blood_right_name: "The Blood Right"
 tradition_gen_blood_right_desc: "Any ruler of this people may call another into the circle, and a challenge is answered with a blade. Refusing is losing without the wounds."
 culture_parameter_gen_blood_right: "Rulers may issue a #V Blood Challenge#! to one another: fight a peer for renown, a liege or greater ruler for a claim on their seat, or a vassal to put them in their place"

 # ============ Blood Challenge (interaction) ============
 gen_blood_challenge_interaction: "Blood Challenge"
 gen_blood_challenge_interaction_desc_peer: "Call [recipient.GetShortUIName] into the circle. The winner takes the renown. The bout is not to the death, but the one who falls can still die: by a last reckless gamble, or at the winner's hand."
 gen_blood_challenge_interaction_desc_upward: "Call [recipient.GetShortUIName] into the circle for [recipient.GetHerHis] seat. Win and you earn a claim on one of [recipient.GetHerHis] titles; lose and every claim you hold on [recipient.GetHerHim] is spent. This fight can kill: a badly wounded loser may not survive the bout, and the winner may finish whoever falls."
 gen_blood_challenge_interaction_desc_downward: "Call your vassal [recipient.GetShortUIName] into the circle and put [recipient.GetHerHim] in [recipient.GetHerHis] place. Win and [recipient.GetSheHe] owes you. The bout is not to the death, but the one who falls can still die: by a last reckless gamble, or at the winner's hand."
 gen_blood_challenge_interaction_notification: "[recipient.Custom2('InsultNoun', SCOPE.sC('actor'))|U]! By the Blood Right, I call you into the circle. Answer with your blade, or be known as the one who would not."

 gen_bc_enter_the_circle.tt: "A [single_combat_fight|E] in the circle will begin at once"
 gen_bc_upward_lethal.tt: "The fight can #N kill#!: a loser who is already badly wounded may not survive it, and the winner may finish whoever falls"
 gen_bc_not_lethal.tt: "The bout itself does not kill, but the one who falls can still #N die#! by their own last gamble or the winner's verdict"

 gen_bc_challenge_refused.t: "Challenge Refused"
 gen_bc_ai_refusal_shame: "Refusing the Blood Right is a disgrace: $VALUE|=+0$"
 gen_bc_ai_already_wounded: "Already badly wounded: $VALUE|=+0$"
 gen_bc_ai_seat_at_stake: "Would risk a claim on [recipient.GetHerHis] titles: $VALUE|=+0$"
 gen_bc_ai_chance_at_the_seat: "A chance at your seat: $VALUE|=+0$"
 gen_blood_challenge_interaction_desc_downward_claim: "\n\nIf [recipient.GetSheHe] wins, [recipient.GetSheHe] earns a claim on one of your titles, and your other vassals of [recipient.GetHerHis] people will look up to [recipient.GetHerHim]."
 gen_blood_challenge_interaction_desc_downward_tyranny: "\n\n[recipient.GetShortUIName] has given you no cause. Calling a loyal vassal into the circle costs you #N 3#! [tyranny|E]."
 gen_bc_every_same_culture_vassal: "Every other [vassal|E] of the winner's culture"

 gen_bc_not_own_spouse: "Cannot challenge your own spouse"
 gen_bc_actor_already_fighting: "You are already answering a Blood Challenge"
 gen_bc_recipient_already_fighting: "[recipient.GetShortUIName] is already answering a Blood Challenge"

 # ============ Modifiers and opinions ============
 gen_bc_refused_the_blood_modifier: "Refused the Blood"
 gen_bc_refused_the_blood_modifier_desc: "This character was called into the circle and would not go. Among a people of the Blood Right, that is worse than losing."
 gen_bc_blood_proven_modifier: "Blood-Proven"
 gen_bc_blood_proven_modifier_desc: "This character has won three Blood Challenges. The clans know the name."
 gen_bc_circle_master_modifier: "Master of the Circle"
 gen_bc_circle_master_modifier_desc: "This character has won seven Blood Challenges. Few will step into the circle against them now."
 gen_bc_unbroken_modifier: "Unbroken"
 gen_bc_unbroken_modifier_desc: "Twelve times called into the circle, twelve times the one who walked out. Among a people who rarely live to grow old, this one seems to have forgotten how to die."
 gen_bc_challenged_my_seat_opinion: "Challenged Me for My Seat"
 gen_bc_made_an_example_of_me_opinion: "Made an Example of Me"
 gen_bc_bested_me_fairly_opinion: "Bested Me Fairly"
 gen_bc_humbled_our_liege_opinion: "Humbled Our Liege in the Circle"

 # ============ Events ============
 gen_blood_challenge.0101.t: "The Challenge Falls Through"
 gen_blood_challenge.0101.tt: "The fight cannot go ahead. Nobody wins and nobody pays."
 gen_blood_challenge.0500.victor.t: "Victory in the Circle"
 gen_blood_challenge.0500.loser.t: "Defeat in the Circle"
 gen_bc_presider_rules.tt: "Your shared liege, [gen_bc_presider.GetShortUIName], will rule on the fight first: let it go ahead, back one of you, or forbid it"
 gen_blood_challenge.0500.presider.t: "The Circle Has Spoken"
 gen_blood_challenge.0500.presider.tt: "[gen_bc_victor.GetShortUIName] beat [gen_bc_loser.GetShortUIName] in the circle."

 # ============ The presiding liege (0401) ============
 gen_blood_challenge.0401.t: "Blood Between Vassals"
 gen_blood_challenge.0401.desc: "Your vassal [gen_bc_challenger.GetTitledFirstName] has called [gen_bc_defender.GetTitledFirstName] into the circle, and [gen_bc_defender.GetSheHe] has answered. They are both yours, and the court is waiting to see what you will say."
 gen_blood_challenge.0401.desc_rivals: "\n\nThe two have hated each other for years. Everyone knows this fight has been coming."
 gen_blood_challenge.0401.desc_claim: "\n\nIt is more than a brawl: if [gen_bc_challenger.GetFirstName] wins, [gen_bc_challenger.GetSheHe] walks away with a claim on [gen_bc_title.GetName]."
 gen_blood_challenge.0401.desc_renown: "\n\nNo land hangs on it, only who walks away with the name."
 gen_blood_challenge.0401.desc_custom: "\n\nThe Blood Right says a challenge answered is not yours to stop. You can still stop it, if you want the clans to say you did."
 gen_blood_challenge.0401.desc_foreign: "\n\nThey call it the Blood Right. To you it looks like two of your vassals about to maim each other."
 gen_blood_challenge.0401.a: "Let them settle it."
 gen_blood_challenge.0401.b: "I stand with [gen_bc_challenger.GetFirstName]."
 gen_blood_challenge.0401.c: "I stand with [gen_bc_defender.GetFirstName]."
 gen_blood_challenge.0401.d: "Not in my realm. Put the blades away."
 gen_blood_challenge.0401.d.refund_tt: "The fight is called off. [gen_bc_challenger.GetShortUIName] gets back the [prestige|E] the challenge cost"
 gen_bc_backed_outcome.tt: "If the one you backed wins, you gain [prestige|E]; if they lose, you lose some"
 gen_bc_ruling.t: "Your Liege Has Ruled"
 gen_blood_challenge.0401.ruling_allowed: "[gen_bc_presider.GetShortUIName] lets the fight go ahead."
 gen_blood_challenge.0401.ruling_backed_challenger: "[gen_bc_presider.GetShortUIName] stands with [gen_bc_challenger.GetShortUIName] in the fight."
 gen_blood_challenge.0401.ruling_backed_defender: "[gen_bc_presider.GetShortUIName] stands with [gen_bc_defender.GetShortUIName] in the fight."
 gen_blood_challenge.0401.ruling_forbidden: "[gen_bc_presider.GetShortUIName] forbids the fight. The blades go back in their sheaths."
 gen_bc_liege_favour_modifier: "Liege's Favour"
 gen_bc_liege_favour_modifier_desc: "This character's liege stands with them in a coming fight."
 gen_bc_backed_me_opinion: "Stood with Me in the Circle"
 gen_bc_backed_my_foe_opinion: "Stood with My Foe"
 gen_bc_forbade_my_fight_opinion: "Forbade My Fight"

 # ============ Settled in blood (0510) ============
 gen_blood_challenge.0510.t: "Settled in Blood"
 gen_blood_challenge.0510.desc: "[gen_bc_loser.GetTitledFirstName] is on the ground in front of you, and for once [gen_bc_loser.GetSheHe] has nothing to say. Years of bad blood between you came down to this fight, and you won it.\n\nYou can let that be the end of it. Or you can make sure [gen_bc_loser.GetSheHe] never forgets it."
 gen_blood_challenge.0510.a: "It's done. We're done."
 gen_blood_challenge.0510.a.toast: "The Rivalry Is Over"
 gen_blood_challenge.0510.b: "Grind [gen_bc_loser.GetHerHim] into the dirt."
 gen_blood_challenge.0510.b.toast: "Ground into the Dirt"
 gen_bc_settled_in_blood_opinion: "Settled in Blood"
 gen_bc_ground_me_down_opinion: "Ground Me into the Dirt"
