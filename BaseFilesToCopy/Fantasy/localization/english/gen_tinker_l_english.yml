l_english:
 # ============ Tinkerers (tradition) ============
 tradition_gen_tinkers_bench_name: "Tinkerers"
 tradition_gen_tinkers_bench_desc: "Every household of this people has a workbench, and every workbench has something on it that ticks, whirrs or smokes. Their rulers build contraptions of their own, and other lords pay well to borrow the knack."
 culture_parameter_gen_tinkering: "Learned rulers may #V Start a Contraption#!: a clockwork curio, waterworks, a war engine, a clockwork limb or a grand invention. Other rulers may commission one from a gnome"

 # ============ Start a Contraption (decision) ============
 gen_tinker_start_project_decision: "Start a Contraption"
 gen_tinker_start_project_decision_desc: "Clear the workbench, light the lamps and build something the world has not seen. It will take from eight months to two years, cost good gold, and may well blow up."
 gen_tinker_start_project_decision_tooltip: "Build a contraption at your workbench"
 gen_tinker_start_project_decision_confirm: "To the workbench!"
 gen_tinker_start_project_decision_effect.tt: "Choose what to build and what to spend on it"
 gen_tk_bench_busy: "You already have a project on the bench"
 gen_tk_bench_resting: "You finished a project less than three years ago"

 # ============ The project loop ============
 gen_tk_begin_project.tt: "Work begins. Over the coming months the project will go through its design, its setbacks and finally its test: eight months to a year for a curio or a limb, a year to a year and a half for waterworks or a war engine, up to two years for a grand invention"
 gen_tk_quality_up_little.tt: "The work will be #P a little better#!"
 gen_tk_quality_up.tt: "The work will be #P better#!"
 gen_tk_quality_up_much.tt: "The work will be #P much better#!"
 gen_tk_quality_down_little.tt: "The work will be #N a little worse#!"
 gen_tk_quality_down.tt: "The work will be #N worse#!"
 gen_tk_quality_down_much.tt: "The work will be #N much worse#!"
 gen_tk_risk_up_little.tt: "The risk of an accident #N rises a little#!"
 gen_tk_risk_up.tt: "The risk of an accident #N rises#!"
 gen_tk_risk_up_much.tt: "The risk of an accident #N rises sharply#!"
 gen_tk_risk_down_little.tt: "The risk of an accident #P falls a little#!"
 gen_tk_slower_little.tt: "Care takes time: the next stage comes #N about two weeks later#!"
 gen_tk_slower.tt: "Care takes time: the next stage comes #N about a month later#!"
 gen_tk_slower_much.tt: "Care takes time: the next stage comes #N about two months later#!"
 gen_tk_risk_down.tt: "The risk of an accident #P falls#!"
 gen_tk_risk_down_much.tt: "The risk of an accident #P falls sharply#!"
 gen_tk_rest_own.tt: "Your workbench rests: you cannot start another contraption of your own for #V three years#!"
 gen_tk_rest_commission.tt: "Your workbench rests: you will not take another commission for #V a year#!"
 gen_tk_result_masterwork.tt: "#P A masterwork#!"
 gen_tk_result_works.tt: "It works"
 gen_tk_result_dud.tt: "#N A dud#!"
 gen_tk_result_explodes.tt: "#N It blows up#!"
 gen_tk_hurried.tt: "The work is #V hurried#!: every remaining stage comes a quarter sooner"
 gen_tk_hurried_already.tt: "The work is already hurried; it can't go any faster"
 gen_tk_hurried_too_late.tt: "The test day is already set, so the work cannot be hurried any further"
 gen_tk_project_abandoned.t: "Project Abandoned"
 gen_tk_project_abandoned.tt: "The work cannot go on. The half-built contraption is packed away, and the gold spent on it is gone."
 gen_tk_project_abandoned_commission.tt: "The work cannot go on. The half-built contraption is packed away, and whoever commissioned it will have to look elsewhere."
 gen_tk_commission_abandoned.tt: "[gen_tk_tinkerer.GetShortUIName] can no longer finish the contraption you commissioned."

 # ============ At the Workbench ============
 gen_tk_at_bench_curio_modifier: "At the Workbench: a Clockwork Curio"
 gen_tk_at_bench_curio_modifier_desc: "This character is building a clockwork curio, for themselves or for whoever commissioned it. It should be done in eight months to a year."
 gen_tk_at_bench_mill_modifier: "At the Workbench: Waterworks"
 gen_tk_at_bench_mill_modifier_desc: "This character is building waterworks, for themselves or for whoever commissioned them. They should be done in a year to a year and a half."
 gen_tk_at_bench_engine_modifier: "At the Workbench: a War Engine"
 gen_tk_at_bench_engine_modifier_desc: "This character is building a war engine, for themselves or for whoever commissioned it. It should be done in a year to a year and a half."
 gen_tk_at_bench_limb_modifier: "At the Workbench: a Clockwork Limb"
 gen_tk_at_bench_limb_modifier_desc: "This character is building a clockwork limb, for themselves or for whoever commissioned it. It should be done in eight months to a year."
 gen_tk_at_bench_invention_modifier: "At the Workbench: a Grand Invention"
 gen_tk_at_bench_invention_modifier_desc: "This character is at work on a grand invention. It should be done in a year and a half to two years."

 gen_tk_hurried_me_opinion: "Hurried My Work"
 gen_tk_not_what_i_ordered_opinion: "Not What I Ordered"
 gen_tk_better_than_ordered_opinion: "Better Than I Ordered"

 # ============ Standing ============
 gen_tk_tinkerer_modifier: "Tinkerer"
 gen_tk_tinkerer_modifier_desc: "This character has built three working contraptions. Their workbench is the pride of the household, if not of the neighbours."
 gen_tk_master_artificer_modifier: "Master Artificer"
 gen_tk_master_artificer_modifier_desc: "This character has built seven working contraptions. Scholars write to them, and lords wait years for their work."
