l_english:
 # General names for Mandala and Wanua in generated worlds; VanillaWorld keeps vanilla text.
 # Keep vanilla government IDs, concept IDs, icons and mechanics. Supporting Sacral concepts
 # below preserve the installed game's text with the same generalized terminology.
 mandala_government:0 "Sacral"
 mandala_government_adjective:0 "$mandala_government$"
 mandala_government_realm:0 "$mandala_government$ Realm"
 mandala_government_vassals_label:0 "$mandala_government$ [obligations|E] are based on each [vassal|E]'s [vassal_contract|E]"
 mandala_vassal:0 "$mandala_government$"
 mandala_government_desc:0 "\n$game_concept_mandala_desc$\n\n#F A sacred sovereign stands at the heart of the realm, drawing lesser rulers into their orbit through devotion, splendor, and divine authority. Their dominion endures only while others believe in their right to rule.#!"
 game_concept_mandala:0 "$mandala_government$"
 game_concept_mandalas:0 "Sacral Realms"
 game_concept_mandala_government:0 "$mandala_government$ Government"
 game_concept_mandala_desc:0 "Under $mandala_government$ [government|E], the [domain_limit|E] and number of [direct_vassals|E] are limited. [rulers|E] instead expand their reach as [suzerains|E] of [tributaries|E].\n\nA $mandala_government$ [ruler|E] may aspire to divine kingship, relying on [mandala_radiance|E] to attract and retain $game_concept_tributaries$. Maintaining their [opinion|E] and building strong relationships helps preserve these ties.\n\nOn [succession|E], $game_concept_tributaries$ may break away unless the new ruler proves a worthy [mandala_succesor|E]."

 wanua_government:0 "Maritime"
 wanua_government_adjective:0 "$wanua_government$"
 wanua_government_realm:0 "$wanua_government$ Realm"
 wanua_government_desc:0 "\n$game_concept_wanua_desc$\n\n#F From coastal settlements, seafaring communities cross the waters to trade and raid. Their fortunes rest on the goods they exchange, the shores they reach, and the strength of their fleets.#!"
 game_concept_wanua:0 "$wanua_government$"
 game_concept_wanua_government:0 "$wanua_government$ Government"
 game_concept_wanua_desc:0 "$wanua_government$ [government|E] is a seafaring form of [tribal|E] rule, with reduced [domain_limit|E] and [vassal_limit|E]. [rulers|E] use [gold|E] to construct [buildings|E] and recruit [men_at_arms|E], but earn little $game_concept_gold$ from their $game_concept_buildings$.\n\nThey can [barter|E] and [raid|E], and benefit from cheaper embarkation and safer travel at sea. They also gain [legitimacy|E] from being a [tributary|E], making ties with [mandala|E] realms particularly valuable."
 game_concept_mandala_succession: "Sacral Succession"
 game_concept_mandala_succession_succession: "Succession"
 game_concept_mandala_trials: "Sacral Trials"
 game_concept_mandala_succesor: "Divine Sovereign Successor"
 game_concept_mandala_succession_desc: "When a [mandala|E] [ruler|E] passes on, and has chosen a [mandala_aspect|E], their [heir|E] faces the $game_concept_mandala_succession$ Trials. In these Trials, the Heir is subject to [skill|E] Challenges which test their mettle in the associated Aspect Skill but also two other Aspect Skills.\n\nSucceeding these trials means the Heir managed to convince their followers that they are a worthy successor and the [realm|E] remains stable.\n\n#EMP Failing#! however, will incur increasing penalties:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! Failed Challenge: Losing a [piety_level|E] and a small amount of [tributaries|E] break free.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! Failed Challenges: Losing two [piety_levels|E] and all Tributaries break free.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold All#! Failed Challenges: Losing three [piety_levels|E] and the shattering of the [realm|E].#!"
 game_concept_mandala_radiance: "Sacral Radiance"
 game_concept_mandala_radiance_desc: "The magnetism to attract and maintain [subjects|E] for a [mandala|E] [ruler|E] is referred to as Sacral Radiance. It is a blend of their [piety_level|E], #V [GetBuilding('mandala_capital_01').GetTypeName]#! [great_building|E] level as well as [mandala_aspect|E] level.\n\nHigher rewards, more Subjects and more power await those who combine the three to become more Radiant."
 game_concept_mandala_decree: "Sacral Decree"
 game_concept_mandala_decrees: "Sacral Decrees"
 game_concept_mandala_decree_desc: "The $game_concept_mandala_decrees$ are the three Decrees mandated by the [mandala|E] [ruler|E] — signified by [prosperity_decree|E], [expansion_decree|E] and [reverence_decree|E].\n\nGenerally the Sacral realm has a very centralized authority, where the power over [subjects|E] and [laws|E] lies with the associated Ruler who can change them as required with little to no objection from its denizens."
 game_concept_mandala_decree_prosperity: "Prosperity Decree"
 game_concept_mandala_decree_prosperity_desc: "With the [GetLaw('mandala_decree_prosperity').GetName], the [mandala|E] [ruler|E] is focused on stimulating and inspiring all [subjects|E] to enact constructive changes.\n\nEfforts are funneled into furthering [development|E], [buildings|E], amassing wealth as well as strengthening community via personal relations."
 game_concept_mandala_decree_expansion: "Expansion Decree"
 game_concept_mandala_decree_expansion_desc: "The [GetLaw('mandala_decree_expansion').GetName] dictate that all [subjects|E] focus their efforts on expanding the [realm|E].\n\nIncreasing soldier count, military accommodations and supporting any eventual [wars|E] directed by their [mandala|E] [ruler|E] is imperative."
 game_concept_mandala_decree_reverence: "Reverence Decree"
 game_concept_mandala_decree_reverence_desc: "The [GetLaw('mandala_decree_reverence').GetName] mandates that the [mandala|E] [subjects|E] focus their efforts on furthering spirituality and worship.\n\n[pilgrimages|E], rituals and [piety|E] are the cornerstones of this Sacral Decree."
 game_concept_mandala_aspect: "Sacral Aspect"
 game_concept_mandala_aspects: "Sacral Aspects"
 game_concept_mandala_aspect_desc: "In order for a [mandala|E] [ruler|E] to achieve ever-lasting reverence and divinity, they need to align with one of the Aspects that identify them as a god.\n\nThe available Aspects are: \n$EFFECT_LIST_BULLET$[aspect_of_creation|E]\n$EFFECT_LIST_BULLET$[aspect_of_serenity|E]\n$EFFECT_LIST_BULLET$[aspect_of_destruction|E]\n$EFFECT_LIST_BULLET$[aspect_of_trickery|E]\n\nThese Aspects will impact certain expectations and actions undertaken by the Ruler."
 game_concept_mandala_ritual: "Sacral Ritual"
 game_concept_mandala_rituals: "Sacral Rituals"
 game_concept_mandala_ritual_desc: "Sacral Rituals are tasks that appear occasionally for [mandala|E] [rulers|E] — it is a sign that a particular part of your [realm|E] is in need of your guidance and divine uplifting.\n\nBeing more skilled in your [mandala_aspect|E] will increase any gains from making appearances for your [subjects|E]."
 game_concept_mandala_ritual_tier: "Sacral Ritual Tier"
 game_concept_mandala_ritual_tier_desc: "The [ritual_tier|E] of a [mandala_ritual|E] indicates just how much that destination would benefit from your admonition as well as the rewards for you, personally."
