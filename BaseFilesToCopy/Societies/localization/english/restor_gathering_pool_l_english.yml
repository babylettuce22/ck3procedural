l_english:

 # ---- Helpers (common/scripted_effects/00_restor_gathering_pool_effects.txt) ---------------------

 restor_gathering_their_favour_gain_tt:0 "[restor_favour_target.GetTitledFirstName] gains #P [restor_their_favour_delta|0]#! favour with $restor_society_name$"
 restor_gathering_hall_exposure_loss_tt:0 "Everyone sworn in the hall: exposure falls by #P [restor_hall_delta|0]#!"
 restor_gathering_released_tt:0 "[restor_released.GetTitledFirstName] is released from the oath, and is no longer one of the Sworn"

 # ---- Spine additions (restor_gathering_events.txt) ----------------------------------------------

 restor.0901.desc_heir:0 "\n\n[restor_pretender.GetTitledFirstName] has come in person, and sits among them. The Sworn keep looking at the heir, and then at the door."
 restor.0901.desc_war:0 "\n\n[restor_usurper.GetTitledFirstName] is at war, and half the talk before the doors were even barred was about what that might mean."
 restor.0908.d:0 "Get [restor_pretender.GetFirstNameNoTooltip] out of the town before dawn."

 # ---- restor.1001 -------------------------------------------------------------------------------

 restor.1001.t:0 "Riders on the Road"
 restor.1001.desc:0 "[restor_late.GetTitledFirstName] reaches your hall a day after everyone else, mud to the knees, and asks for the doors to be barred behind [restor_late.GetHerHim]. On the last stretch of road, [restor_late.GetSheHe] says, a rider kept the same pace behind [restor_late.GetHerHim] for an hour, never closer and never further away.\n\nIt may have been nothing. A man going the same way."
 restor.1001.a:0 "Send two of my men back down the road."
 restor.1001.a.empty:0 "The Road Was Empty"
 restor.1001.a.empty.tt:0 "Your men rode as far as the ford and back, and saw nobody"
 restor.1001.a.caught:0 "The Rider Is Found"
 restor.1001.a.caught.tt:0 "Your men found the rider at an inn and kept him drinking until morning. Whatever he saw, he is no longer sure of it"
 restor.1001.a.lost:0 "The Rider Got Away"
 restor.1001.b:0 "Bar the doors. Whoever it was has seen a house and nothing more."
 restor.1001.c:0 "You should have come by the back roads, [restor_late.GetFirstNameNoTooltip]."

 # ---- restor.1002 -------------------------------------------------------------------------------

 restor.1002.t:0 "Strike Now or Wait"
 restor.1002.desc:0 "Late in the evening, [restor_hawk.GetTitledFirstName] stands up and says what some of the Sworn have been thinking: the heir of House $restor_house_name$ should raise the standard this year, while the old soldiers of $restor_crown_name$ are still alive to follow it.\n\n[restor_dove.GetTitledFirstName] tells [restor_hawk.GetHerHim] to sit down. Every year the Sworn wait, [restor_dove.GetSheHe] says, they are stronger, and every rising that went early ended on a scaffold.\n\nBoth of them are looking at you."
 restor.1002.a:0 "[restor_hawk.GetFirstNameNoTooltip] is right. We have waited long enough."
 restor.1002.b:0 "[restor_dove.GetFirstNameNoTooltip] is right. We wait."
 restor.1002.c:0 "It isn't for us to say. The heir will decide."
 restor.1002.c.calm:0 "The Hall Is Calmed"
 restor.1002.c.sour:0 "Nobody Is Satisfied"

 # ---- restor.1003 -------------------------------------------------------------------------------

 restor.1003.t:0 "A Doubt at the Table"
 restor.1003.desc:0 "[restor_accuser.GetTitledFirstName] asks to speak with you alone. On the road here, [restor_accuser.GetSheHe] says, [restor_suspect.GetTitledFirstName] stopped at an inn"
 restor.1003.desc_usurper:0 " where one of [restor_usurper.GetTitledFirstName]'s stewards keeps a room, and spent an hour there with the door shut."
 restor.1003.desc_nousurper:0 " where the tax men of $restor_crown_name$ keep a room, and spent an hour there with the door shut."
 restor.1003.desc_end:0 "\n\n[restor_suspect.GetFirstNameNoTooltip] is in your hall now, eating your bread. [restor_suspect.GetSheHe|U] has not mentioned the inn."
 restor.1003.a:0 "Put it to [restor_suspect.GetFirstNameNoTooltip] in front of everyone."
 restor.1003.a.answer:0 "[restor_suspect.GetFirstNameNoTooltip] Has an Answer"
 restor.1003.a.answer.tt:0 "The steward is [restor_suspect.GetFirstNameNoTooltip]'s cousin, and there are three witnesses to what they talked about. [restor_suspect.GetSheHe|U] will not forget being asked"
 restor.1003.a.loose:0 "[restor_suspect.GetFirstNameNoTooltip] Talked Too Much"
 restor.1003.a.loose.tt:0 "It was not treason, only wine and a loose tongue. But [restor_suspect.GetSheHe] said more than [restor_suspect.GetSheHe] should have, and now the Sworn know what"
 restor.1003.a.walks:0 "[restor_suspect.GetFirstNameNoTooltip] Walks Out"
 restor.1003.b:0 "Say nothing. Have [restor_suspect.GetHerHim] watched once the Gathering is over."
 restor.1003.b.tt:0 "In a month or two, your watchers will tell you what [restor_suspect.GetTitledFirstName] does when [restor_suspect.GetSheHe] thinks nobody is looking"
 restor.1003.c:0 "I trust [restor_suspect.GetFirstNameNoTooltip] as I trust you. Drop it."

 # ---- restor.1004 -------------------------------------------------------------------------------

 restor.1004.t:0 "The Heir Among Us"
 restor.1004.desc:0 "[restor_pretender.GetTitledFirstName] has come to the Gathering in person, against the advice of everyone who knew. The Sworn keep glancing at the heir of House $restor_house_name$ across your table. Some of them have never seen [restor_pretender.GetHerHim] before.\n\nBefore the evening is out, [restor_pretender.GetSheHe] asks you quietly whether [restor_pretender.GetSheHe] might say a few words to the hall."
 restor.1004.a:0 "Let the heir speak to them."
 restor.1004.b:0 "Better that fewer of them see your face, [restor_pretender.GetFirstNameNoTooltip]."
 restor.1004.c:0 "I will kneel to [restor_pretender.GetHerHim] first, so that they all see it."

 # ---- restor.1005 -------------------------------------------------------------------------------

 restor.1005.t:0 "A Servant at the Door"
 restor.1005.desc:0 "Your steward has caught one of the household servants crouched outside the door of the hall, while the Sworn were talking about the heir. The servant swears to have heard nothing, and was only waiting to be called with more wine.\n\nNobody believes that."
 restor.1005.a:0 "Pay for the servant's silence."
 restor.1005.a.quiet:0 "The Servant Keeps Quiet"
 restor.1005.a.quiet.tt:0 "The servant takes the money, and nobody in the town hears a word"
 restor.1005.a.talks:0 "The Servant Talks Anyway"
 restor.1005.b:0 "Make it clear what happens to servants who talk."
 restor.1005.b.quiet:0 "Too Frightened to Talk"
 restor.1005.b.quiet.tt:0 "The servant goes back to the kitchens white-faced, and says nothing to anyone"
 restor.1005.b.runs:0 "The Servant Runs"
 restor.1005.c:0 "Ask the servant what the family thought of the old kings."
 restor.1005.c.loyal:0 "An Old Loyalty"
 restor.1005.c.loyal.tt:0 "The servant's grandfather died in the last king's levy. You have another pair of ears in your own house"
 restor.1005.c.liar:0 "A Poor Liar"
 restor.1005.c.liar.tt:0 "The servant tells you what you want to hear, badly. You send them away to your furthest estate, and hope"

 # ---- restor.1006 -------------------------------------------------------------------------------

 restor.1006.t:0 "To the Last King"
 restor.1006.desc:0 "It is late, the doors are barred, and someone has filled a cup and set it at the empty head of your table, as the Sworn do for the last king of House $restor_house_name$. He has been dead since $restor_fell_year$.\n\nThe hall has gone quiet. As host, the toast is yours to give."
 restor.1006.a:0 "Say his name aloud, and let them say it after me."
 restor.1006.b:0 "To the heir, who is alive."
 restor.1006.c:0 "We drink in silence. The walls are thin."

 # ---- restor.1007 -------------------------------------------------------------------------------

 restor.1007.t:0 "A Letter from the Heir"
 restor.1007.desc:0 "A rider you do not know brings a letter to your gate and will give it to nobody but you. The seal is plain, but the hand is [restor_pretender.GetTitledFirstName]'s. The heir of House $restor_house_name$ knows the Sworn are meeting under your roof, and has written to all of them."
 restor.1007.a:0 "Read it aloud to the hall."
 restor.1007.b:0 "Read it to myself, then burn it."
 restor.1007.c:0 "Keep it. A letter in the heir's own hand is worth a great deal."
 restor.1007.c.tt:0 "If anyone ever searches your chests, they will find it"

 # ---- restor.1008 -------------------------------------------------------------------------------

 restor.1008.t:0 "An Uninvited Guest"
 restor.1008.desc:0 "[restor_sponsor.GetTitledFirstName] has brought someone to the Gathering who was not asked: [restor_newcomer.GetTitledFirstName], of [restor_sponsor.GetHerHis] own court. [restor_sponsor.GetSheHe|U] swears that [restor_newcomer.GetFirstNameNoTooltip] has been loyal to House $restor_house_name$ for years, and that it was time.\n\n[restor_newcomer.GetFirstNameNoTooltip] is waiting in the yard, and has already seen half the faces in your hall."
 restor.1008.a:0 "Bring [restor_newcomer.GetHerHim] in and swear [restor_newcomer.GetHerHim] now."
 restor.1008.a.tt:0 "[restor_newcomer.GetTitledFirstName] is sworn to $restor_society_name$"
 restor.1008.b:0 "Send [restor_newcomer.GetHerHim] home, with a warning."
 restor.1008.b.quiet:0 "[restor_newcomer.GetFirstNameNoTooltip] Keeps Quiet"
 restor.1008.b.quiet.tt:0 "[restor_newcomer.GetFirstNameNoTooltip] goes home and says nothing about the faces in your hall"
 restor.1008.b.talks:0 "[restor_newcomer.GetFirstNameNoTooltip] Talks"
 restor.1008.c:0 "[restor_sponsor.GetFirstNameNoTooltip] can wait in the yard with [restor_newcomer.GetHerHim] until morning."

 # ---- restor.1009 -------------------------------------------------------------------------------

 restor.1009.t:0 "News of the Usurper"
 restor.1009.desc:0 "One of the Sworn's riders comes in after dark with news of [restor_usurper.GetTitledFirstName]."
 restor.1009.desc_war:0 " [restor_usurper.GetSheHe|U] is at war, and has taken the levies of $restor_crown_name$ with [restor_usurper.GetHerHim]. The roads are half empty and the garrisons are thin."
 restor.1009.desc_ill:0 " [restor_usurper.GetSheHe|U] is ill, and has not left [restor_usurper.GetHerHis] bed for a week. [restor_usurper.GetHerHis|U] stewards are running [restor_usurper.GetHerHis] lands, and not well."
 restor.1009.desc_roads:0 " [restor_usurper.GetSheHe|U] has doubled the watch on the roads into $restor_crown_name$, and [restor_usurper.GetHerHis] men are asking the innkeepers who comes and goes."
 restor.1009.desc_end:0 "\n\nThe hall wants to know what you make of it."
 restor.1009.a:0 "While [restor_usurper.GetFirstNameNoTooltip] looks elsewhere, send riders into [restor_news_county.GetName]."
 restor.1009.a.tt:0 "Support for House $restor_house_name$ is recounted"
 restor.1009.d:0 "Then everyone goes home by the back roads."
 restor.1009.b:0 "Send word to the heir tonight."
 restor.1009.c:0 "It changes nothing. We keep to the plan."

 # ---- restor.1010 -------------------------------------------------------------------------------

 restor.1010.t:0 "Counting Swords"
 restor.1010.desc:0 "Once the plates are cleared, you ask each lord in the hall how many men they could bring if the heir raised the standard tomorrow. [restor_sword_lords|0] of them answer. [restor_sword_lord.GetTitledFirstName] answers first, and loudest.\n\nThe numbers are larger than you expected. Some of them are probably true."
 restor.1010.a:0 "Write the pledges down. We will need them."
 restor.1010.a.tt:0 "A list of names and numbers now exists, in your hand"
 restor.1010.b:0 "Nobody writes anything down. Remember what you promised."
 restor.1010.c:0 "Men are for later. Tonight I want coin for the heir."

 # ---- restor.1011 -------------------------------------------------------------------------------

 restor.1011.t:0 "A Stranger in Town"
 restor.1011.desc:0 "Your steward tells you that a stranger has taken a room at the inn below your hall, and has been asking the innkeeper whose horses fill your stables this week. The stranger claims to be a wool merchant, and has brought no wool."
 restor.1011.a:0 "Have the stranger followed."
 restor.1011.a.merchant:0 "Only a Merchant"
 restor.1011.a.merchant.tt:0 "The stranger buys wool in the next town and rides on. Your stables were only a question"
 restor.1011.a.followed:0 "Followed Home"
 restor.1011.a.followed.tt:0 "Your man follows the stranger to the house of a tax collector, and learns what the tax collector wanted to know. Now you know too"
 restor.1011.a.noticed:0 "The Stranger Noticed"
 restor.1011.b:0 "Move the meetings to the cellar, and stop the riders coming and going."
 restor.1011.c:0 "Invite the stranger to dine with us, and see who flinches."
 restor.1011.c.good:0 "A Pleasant Evening"
 restor.1011.c.good.tt:0 "The stranger eats well, hears about nothing but hunting, and leaves the next morning"
 restor.1011.c.bad:0 "The Stranger Studied Every Face"

 # ---- restor.1012 -------------------------------------------------------------------------------

 restor.1012.t:0 "Released from the Oath"
 restor.1012.desc:0 "[restor_leaver.GetTitledFirstName] asks to speak with you before the others are awake. [restor_leaver.GetSheHe|U] has not slept all week. [restor_leaver.GetSheHe|U] still loves House $restor_house_name$, [restor_leaver.GetSheHe] says, but [restor_leaver.GetSheHe] has a family, and every rider on the road looks like the usurper's man.\n\n[restor_leaver.GetSheHe|U] wants to be released from the oath, to go home, and to forget every face in this hall."
 restor.1012.a:0 "Go, then. You are released."
 restor.1012.a.silent:0 "[restor_leaver.GetFirstNameNoTooltip] Keeps Faith"
 restor.1012.a.silent.tt:0 "[restor_leaver.GetFirstNameNoTooltip] goes home and forgets, as [restor_leaver.GetSheHe] promised"
 restor.1012.a.talks:0 "[restor_leaver.GetFirstNameNoTooltip] Talks"
 restor.1012.b:0 "Stay. You are safer among us than outside."
 restor.1012.b.stays:0 "[restor_leaver.GetFirstNameNoTooltip] Stays"
 restor.1012.b.goes:0 "[restor_leaver.GetFirstNameNoTooltip] Leaves Anyway"
 restor.1012.c:0 "Nobody leaves the Sworn. Remember what happens to those who try."

 # ---- restor.1013 -------------------------------------------------------------------------------

 restor.1013.t:0 "The Headman at the Gate"
 restor.1013.desc:0 "An old man from one of the villages of [restor_home_county.GetName] has come to your gate, and will not leave until he has seen you. The word in the villages, he says, is that the old king's people are meeting in your hall. He wants to know if it is true that the heir of House $restor_house_name$ is coming back.\n\nHe asks loudly. Your guards are listening."
 restor.1013.a:0 "Tell him yes, and tell him to tell the others."
 restor.1013.b:0 "Tell him he has been listening to fools."
 restor.1013.b.tt:0 "The old man goes home, and the villages hear nothing from you"
 restor.1013.c:0 "Give him bread and a place by the fire, and no answer either way."

 # ---- restor.1014 -------------------------------------------------------------------------------

 restor.1014.t:0 "The Keeper's Account"
 restor.1014.desc:0 "[restor_keeper.GetTitledFirstName], the Keeper of $restor_society_name$, draws you aside after the meal. The Keeper keeps an account of every Captain of the Sworn: who has done something, and who has only talked. [restor_keeper.GetSheHe|U] would like to hear yours."
 restor.1014.a:0 "Tell the Keeper exactly what I have done, no more."
 restor.1014.b:0 "Make it sound better than it was."
 restor.1014.b.impressed:0 "The Keeper Is Impressed"
 restor.1014.b.seen:0 "The Keeper Knows Better"
 restor.1014.c:0 "Ask the Keeper for more to do."

 # ---- restor.1020 -------------------------------------------------------------------------------

 restor.1020.t:0 "A Word in Private"
 restor.1020.desc:0 "[host.GetTitledFirstName] draws you into a side room while the others are eating. There are letters that need to reach the Sworn in the far counties of $restor_crown_name$, [host.GetSheHe] says, and [host.GetSheHe] would not trust them to anyone [host.GetSheHe] trusts less than you."
 restor.1020.a:0 "I'll carry them."
 restor.1020.b:0 "Find someone else. I have been watched enough this year."

 # ---- restor.1021 -------------------------------------------------------------------------------

 restor.1021.t:0 "Asked to Vouch"
 restor.1021.desc:0 "[restor_vouchee.GetTitledFirstName] finds you in the yard. There is talk in the hall, [restor_vouchee.GetSheHe] says, that [restor_vouchee.GetSheHe] has been careless, and [host.GetFirstNameNoTooltip] has been looking at [restor_vouchee.GetHerHim] strangely all evening. If someone the host trusts spoke up for [restor_vouchee.GetHerHim], the talk would stop."
 restor.1021.a:0 "I'll speak for you."
 restor.1021.b:0 "I'll speak for you, and you'll owe me."
 restor.1021.b.nohook_tt:0 "[restor_vouchee.GetFirstNameNoTooltip] is grateful, but you cannot hold it over [restor_vouchee.GetHerHim]"
 restor.1021.c:0 "You made this trouble yourself."

 # ---- restor.1022 -------------------------------------------------------------------------------

 restor.1022.t:0 "By the Fire"
 restor.1022.desc:0 "Late at night you find yourself by the fire with [restor_elder.GetTitledFirstName], and nobody else awake."
 restor.1022.desc_heir:0 " The heir of House $restor_house_name$ asks how you came to be sworn, and seems to want the real answer."
 restor.1022.desc_keeper:0 " The Keeper asks how you came to be sworn, and seems to want the real answer."
 restor.1022.a:0 "Tell [restor_elder.GetHerHim] everything I have done for the cause."
 restor.1022.a.good:0 "[restor_elder.GetFirstNameNoTooltip] Is Impressed"
 restor.1022.a.bad:0 "[restor_elder.GetFirstNameNoTooltip] Has Heard It Before"
 restor.1022.b:0 "Ask [restor_elder.GetHerHim] about the old kings."
 restor.1022.c:0 "Say very little, and listen."

 # ---- restor.1023 -------------------------------------------------------------------------------

 restor.1023.t:0 "A Face You Know"
 restor.1023.desc:0 "Across the hall sits [restor_old_foe.GetTitledFirstName]. You have not had a kind word for each other in years, and you had no idea [restor_old_foe.GetSheHe] was sworn to House $restor_house_name$ too.\n\nFrom the look on [restor_old_foe.GetHerHis] face, [restor_old_foe.GetSheHe] has just had the same thought about you."
 restor.1023.a:0 "For the heir's sake, I'll offer my hand."
 restor.1023.b:0 "I'll keep an eye on [restor_old_foe.GetHerHim]."

 # ---- restor.1024 -------------------------------------------------------------------------------

 restor.1024.t:0 "Too Much Wine"
 restor.1024.desc:0 "The wine at [host.GetTitledFirstName]'s table is better than it ought to be at a secret meeting, and you have had more of it than you meant to. Near midnight you find yourself in the yard with the stars going round, and a great wish to sing the old song of House $restor_house_name$."
 restor.1024.a:0 "Sing it. Quietly."
 restor.1024.a.good:0 "The Yard Sings With You"
 restor.1024.a.bad:0 "The Stable Boy Heard"
 restor.1024.a.bad.tt:0 "Not so quietly, as it turns out. The stable boy heard every word"
 restor.1024.b:0 "Go to bed before I do anything foolish."
 restor.1024.b.tt:0 "You wake with a headache and nothing to regret"
 restor.1024.c:0 "Find [host.GetFirstNameNoTooltip] and say how much I love [host.GetHerHim]."

 # ---- restor.1030 -------------------------------------------------------------------------------

 restor.1030.t:0 "The Watchers Report"
 restor.1030.desc_clean:0 "The people you set to watch [restor_suspect.GetTitledFirstName] after the Gathering have come back. For two months [restor_suspect.GetSheHe] went nowhere, met nobody, and wrote to nobody but [restor_suspect.GetHerHis] steward.\n\nWhatever [restor_suspect.GetSheHe] was doing at that inn, it was not selling the Sworn."
 restor.1030.desc_loose:0 "The people you set to watch [restor_suspect.GetTitledFirstName] after the Gathering have come back. [restor_suspect.GetSheHe|U] is no informer, but [restor_suspect.GetSheHe] drinks, and when [restor_suspect.GetSheHe] drinks [restor_suspect.GetSheHe] talks about the old kings to anyone who will listen.\n\nSomebody has to tell [restor_suspect.GetHerHim] to stop."
 restor.1030.desc_gone:0 "The people you set to watch the suspect after the Gathering have come back with nothing to watch. The one you had them follow is dead, or no longer one of the Sworn.\n\nThey return what is left of the money."
 restor.1030.a:0 "Tell [restor_suspect.GetHerHim] to stop, and tell the Sworn why."
 restor.1030.b:0 "Good. Nobody needs to know I asked."
 restor.1030.c:0 "So be it."
 restor.1030.d:0 "Understood."

 # ---- Pulse actions (common/activities/pulse_actions/00_restor_gathering_actions.txt) -----------

 restor_gathering_pa_whispered_toast_title:0 "[first.GetShortUINameNoTooltip|U] Toasted the Last King in a Whisper"
 restor_gathering_pa_old_song_title:0 "[first.GetShortUINameNoTooltip|U] Hummed a Song of the Old Court for [second.GetShortUINameNoTooltip|U]"
 restor_gathering_pa_sworn_bond_title:0 "[first.GetShortUINameNoTooltip|U] and [second.GetShortUINameNoTooltip|U] Swore to Stand Together"
 restor_gathering_pa_map_study_title:0 "[first.GetShortUINameNoTooltip|U] Studied the Old Map of $restor_crown_name$"
 restor_gathering_pa_cipher_title:0 "[first.GetShortUINameNoTooltip|U] Taught [second.GetShortUINameNoTooltip|U] the Sworn's Cipher"
 restor_gathering_pa_jumpy_title:0 "[first.GetShortUINameNoTooltip|U] Jumped at Every Noise at the Door"
 restor_gathering_pa_doors_barred_title:0 "[first.GetShortUINameNoTooltip|U] Checked the Bars on the Doors Twice"
 restor_gathering_pa_prayer_title:0 "[first.GetShortUINameNoTooltip|U] Prayed for the Kings of House $restor_house_name$"
 restor_gathering_pa_heir_story_title:0 "[first.GetShortUINameNoTooltip|U] Told [second.GetShortUINameNoTooltip|U] of the Old Court"
 restor_gathering_pa_praised_title:0 "[second.GetShortUINameNoTooltip|U] Praised [first.GetShortUINameNoTooltip|U] Before the Sworn"
 restor_gathering_pa_argument_title:0 "[first.GetShortUINameNoTooltip|U] and [second.GetShortUINameNoTooltip|U] Argued in Low Voices"
 restor_gathering_pa_coin_title:0 "[first.GetShortUINameNoTooltip|U] Counted Out Coin for [second.GetShortUINameNoTooltip|U]"
