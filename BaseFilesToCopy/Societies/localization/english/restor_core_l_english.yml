 # ---- Debug -------------------------------------------------------------------------------------

 restor.0004.t:0 "$restor_society_name$"
 restor.0004.desc:0 "Crown: [restor_crown.GetName]. Pretender: [restor_pretender.GetTitledFirstName]. Keeper: [restor_keeper.GetTitledFirstName]. The panel shows support and phase."

 # ---- restor.0010 -------------------------------------------------------------------------------

 restor.0010.t:0 "$restor_society_name$"
 restor.0010.desc_member:0 "$restor_fall_sentence$\n\nYou are one of the few who never accepted that the line ended there. You are sworn to $restor_society_name$, and the Sworn mean to see [restor_pretender.GetTitledFirstName], the rightful heir, crowned in $restor_seat_name$.\n\n[restor_keeper.GetTitledFirstName] is the Keeper and hands out the society's work. For now that work is support in the old kingdom: lords won over, counties stirred, and gold set aside for the day the standard is raised."
 restor.0010.desc_keeper:0 "$restor_fall_sentence$\n\nYou are the Keeper of $restor_society_name$. The Sworn meet when you call them, go where you send them, and keep their mouths shut because you have made sure they have reason to. Every one of them is waiting for the day [restor_pretender.GetTitledFirstName], the rightful heir, is crowned in $restor_seat_name$.\n\nThat day is a long way off. The work until then is support in the old kingdom: lords won over, counties stirred, and gold set aside for the rising."
 restor.0010.desc_pretender:0 "$restor_fall_sentence$ House $restor_house_name$ is your house.\n\nBy right the crown is yours. A few people agree, and they have sworn themselves to $restor_society_name$ to prove it. [restor_keeper.GetTitledFirstName] leads them, and they want the same thing you do: you, crowned in $restor_seat_name$.\n\nThey cannot do it without land under you. Hold as much of the old kingdom as you can and let the Sworn build support. When it is high enough, you can raise the standard and take the crown back."
 restor.0010.a:0 "I remember my oath."
 restor.0010.a.tt:0 "The #high $restor_society_name$#! tab beside Intrigue shows the society: the heir, the enemy, how close the rising is, and what you can do next."

 # ---- restor.0011 -------------------------------------------------------------------------------

 restor.0011.t:0 "Old Loyalties"
 restor.0011.desc:0 "Your spymaster has heard the same story from three different people this season. There is a society in the lands of old $restor_crown_name$, sworn to put House $restor_house_name$ back on its throne. They call themselves $restor_society_name$.\n\nThey say [restor_pretender.GetTitledFirstName] is the rightful heir. Nobody has been able to name a single member. What is clear is that everything they want, you hold."
 restor.0011.a:0 "Let them talk. Talk is all they have."
 restor.0011.b:0 "Have my spymaster listen for names."
 restor.0011.b.tt:0 "Every one of the Sworn becomes a little easier to find."

 # ---- restor.0012 -------------------------------------------------------------------------------

 restor.0012.t:0 "The Old Crown"
 restor.0012.desc:0 "Your house wore the crown of $restor_crown_name$ until $restor_fell_year$. Most people have forgotten. Some have not.\n\nThere is a society, $restor_society_name$, sworn to put House $restor_house_name$ back on the throne. They look to [restor_pretender.GetTitledFirstName] as the rightful heir. They will be looking at you, too."
 restor.0012.a:0 "Let them come to me."
 restor.0012.a.tt:0 "The Sworn may approach you. If you join, you gain their support, and the crown may pass to you if the heir dies."
 restor.0012.b:0 "That was a long time ago."

 restor_can_afford_favour_5_tt:0 "You have at least #high 5#! favour"
 restor_can_afford_favour_10_tt:0 "You have at least #high 10#! favour"
 restor_can_afford_favour_15_tt:0 "You have at least #high 15#! favour"

