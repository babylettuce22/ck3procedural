l_english:

 CULT_PANEL_TITLE:0 "$cult_society_name$"
 CULT_PANEL_AIM:0 "Sworn to #high $cult_devil_name$#!, inside #high $cult_host_name$#!, the faith that calls $cult_devil_name$ its enemy. The cult means to hollow the church out from within: turn its $cult_priests$, hold its holy places, swear its head. Once it is captured, it can be turned inside out."
 CULT_PANEL_AIM_PUBLIC:0 "Now #high $cult_society_name_public$#!. $cult_host_name$ has been turned over: $cult_unveil_list$ The cult's work is to keep it that way."

 CULT_PANEL_HIEROPHANT:0 "THE HIEROPHANT"
 CULT_PANEL_HEAD:0 "HEAD OF THE FAITH"
 CULT_PANEL_HUNTER:0 "THE HUNTER"

 CULT_PANEL_CAUSE_HEADER:0 "The Rot"
 CULT_PANEL_SUPPORT_LABEL:0 "Rot"
 CULT_PANEL_MARK_ROT:0 "#high 60#!: once the church is captured, it can be unveiled."
 CULT_PANEL_LAND_LABEL:0 "Holy sites in sworn hands"
 CULT_PANEL_LAND_TT:0 "How many of $cult_host_name$'s holy sites are held by the Faithless."
 CULT_PANEL_MARK_SITES:0 "#high Half#!: with no head of the faith to swear, holding half the holy sites captures the church."
 CULT_PANEL_SUPPORT_NEXT:0 "The rot comes from holy sites in sworn hands, [Concept('court_chaplain','court chaplains')|E] who are sworn, tainted counties and the number of the Faithless; a sworn head of the faith adds #high 20#!. The church is #high captured#! when its head is sworn (or, with no head, when the Faithless hold half its holy sites). A captured church with #high 60#! rot can be unveiled."

 CULT_PANEL_PLACE_HEADER:0 "Your Place"
 CULT_PANEL_STANDING_LABEL:0 "STANDING"
 CULT_PANEL_STANDING_TT:0 "Your standing in the circle. Kept charges, initiates and service raise it; failure and idleness lower it. Higher standing unlocks more of the cult's powers."
 CULT_RANK_0:0 "Initiate"
 CULT_RANK_1:0 "Adept"
 CULT_RANK_2:0 "Magister"
 CULT_RANK_3:0 "Hierarch"
 CULT_PANEL_FAVOUR_LABEL:0 "Dark Power"
 CULT_PANEL_FAVOUR_TT:0 "Earned by keeping charges, offerings in the dark and bringing in the faithless. Spent on the cult's powers, and every use takes something from your soul."
 CULT_PANEL_EXPOSURE_LABEL:0 "Exposure"
 CULT_PANEL_EXPOSURE_TT:0 "How much the faith's watchers have noticed. It fades each year."
 CULT_PANEL_MARK_SUSPECT:0 "#high 15#!: whispered about. There is a secret to be found."
 CULT_PANEL_MARK_HIGHLY_SUSPECT:0 "#high 25#!: a suspected heretic. The hunter is told, and you lose standing."
 CULT_PANEL_EXPOSURE_CALM:0 "Unnoticed"
 CULT_PANEL_EXPOSURE_SUSPECT:0 "Whispered about"
 CULT_PANEL_EXPOSURE_HIGH:0 "Suspected heretic"

 CULT_PANEL_NEXT_HEADER:0 "What You Can Do"
 CULT_PANEL_CHARGE:0 "#weak Your charge:#! [GetPlayer.Custom('CultCurrentCharge')]"
 CULT_PANEL_ACTION_UNVEIL:0 "The Unveiling"
 CULT_PANEL_ACTION_UNVEIL_TT:0 "A decision for the Hierophant or a sworn head of the faith. Needs the church #high captured#! and #high 60#! rot."
 CULT_PANEL_ACTION_OFFER:0 "An Offering in the Dark"
 CULT_PANEL_ACTION_OFFER_TT:0 "A decision. Give #high 100#! gold for dark power."
 CULT_PANEL_ACTION_MASS:0 "Hold a Black Mass"
 CULT_PANEL_ACTION_MASS_TT:0 "An activity for a Magister or the Hierophant."
 CULT_PANEL_ACTION_DESECRATE:0 "Pilgrimage of Defilement"
 CULT_PANEL_ACTION_DESECRATE_TT:0 "An activity: a journey to one of the faith's holy sites, to foul it."
 CULT_PANEL_POWERS_HINT:0 "Right-click a character for the cult's powers: sounding out and initiating the faithless, turning $cult_priests$, curses and sacrifice. Higher standing unlocks more."

 CULT_PANEL_ROSTER_HEADER:0 "THE FAITHLESS YOU KNOW"
 CULT_PANEL_ROSTER_EMPTY:0 "No one you know of. Magisters and above know the whole circle."
 CULT_ROSTER_HEAD:0 "Head of Faith"
 CULT_ROSTER_HIEROPHANT:0 "Hierophant"
 CULT_ROSTER_SUSPECT:0 "whispered about"
 CULT_ROSTER_VERY_SUSPECT:0 "suspected heretic"
 CULT_PANEL_REACH_HEADER:0 "WITHIN REACH"
 CULT_PANEL_REACH_HINT:0 "Lords of the faith and their [Concept('court_chaplain','court chaplains')|E], near enough to approach. Nothing marks who will listen. Look at what they are."
 CULT_PANEL_REACH_EMPTY:0 "No one of the faith is near enough to approach."
 CULT_REACH_CHAPLAIN:0 "[court_chaplain|E]"
 CULT_REACH_SYMPATHETIC:0 "sympathetic"
 CULT_REACH_REFUSED:0 "refused lately"
 CULT_REACH_APPROACH:0 "Approach"
 CULT_REACH_APPROACH_TT:0 "Sound them out, or offer them the oath."
 cult_recruitment_filter_tag_desc:0 "Bring Them In"
 CULT_PEOPLE_TITLE:0 "The Circle"
 CULT_PEOPLE_BUTTON_MEMBERS:0 "The Faithless"
 CULT_PEOPLE_BUTTON_REACH:0 "Within Reach"
