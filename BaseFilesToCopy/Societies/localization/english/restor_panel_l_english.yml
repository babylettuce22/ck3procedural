l_english:

 # The HUD tab (key kept from the prototype; Emit/GuiWriter.cs names it).
 SOCIETY_TAB_BUTTON:0 "#T Your Society#!"

 RESTOR_PANEL_TITLE:0 "$restor_society_name$"
 RESTOR_PANEL_AIM:0 "Sworn to put House $restor_house_name$ back on the throne of #high $restor_crown_name$#!, which has had no king of the house since $restor_fell_year$. The old seat is $restor_seat_name$."
 RESTOR_PANEL_AIM_PUBLIC:0 "Now #high $restor_society_name_public$#!. House $restor_house_name$ wears the crown of $restor_crown_name$ again. The order's work is to make the kingdom whole and keep it."

 RESTOR_PANEL_HEIR:0 "THE HEIR"
 RESTOR_PANEL_KING:0 "THE KING"
 RESTOR_PANEL_KEEPER:0 "THE KEEPER"
 RESTOR_PANEL_USURPER:0 "THE USURPER"

 RESTOR_PANEL_CAUSE_HEADER:0 "The Cause"
 RESTOR_PANEL_SUPPORT_LABEL:0 "Support"
 RESTOR_PANEL_MARK_SUPPORT:0 "#high 40#!: the heir can raise the standard, and with a quarter of the land, take back the crown."
 RESTOR_PANEL_LAND_LABEL:0 "The heir's share of the old kingdom"
 RESTOR_PANEL_LAND_TT:0 "How much of $restor_crown_name$'s land lies in the heir's own realm."
 RESTOR_PANEL_MARK_LAND:0 "#high 25%#!: enough land for the heir to take back the crown, once support reaches #high 40#!."
 RESTOR_PANEL_WAR_CHEST_LABEL:0 "Gold given to the cause"
 RESTOR_PANEL_WAR_CHEST_TT:0 "Everything the Sworn have given through Give to the Cause."
 RESTOR_PANEL_SUPPORT_NEXT:0 "Support comes from the heir's land, sworn lords on the old kingdom's land, stirred counties and the number of the Sworn. At #high 40#! the heir can raise the standard. With #high 40#! support and #high 25%#! of the land in their own realm, the heir can take back the crown."

 RESTOR_PANEL_PLACE_HEADER:0 "Your Place"
 RESTOR_PANEL_STANDING_LABEL:0 "STANDING"
 RESTOR_PANEL_STANDING_TT:0 "Your standing in the order. Kept charges, recruits and service raise it; failure and idleness lower it. Higher standing unlocks more of the society's powers."
 RESTOR_RANK_0:0 "Sworn"
 RESTOR_RANK_1:0 "Trusted"
 RESTOR_RANK_2:0 "Captain"
 RESTOR_RANK_3:0 "Elder"
 RESTOR_PANEL_FAVOUR_LABEL:0 "Favour"
 RESTOR_PANEL_FAVOUR_TT:0 "Earned by keeping charges, giving to the cause and bringing in new members. Spent on the society's powers."
 RESTOR_PANEL_EXPOSURE_LABEL:0 "Exposure"
 RESTOR_PANEL_EXPOSURE_TT:0 "How much the usurper's people have noticed. It fades each year."
 RESTOR_PANEL_MARK_SUSPECT:0 "#high 15#!: under suspicion. There is a secret to be found."
 RESTOR_PANEL_MARK_HIGHLY_SUSPECT:0 "#high 25#!: highly suspect. The usurper is told, and you lose standing."
 RESTOR_PANEL_EXPOSURE_CALM:0 "Unnoticed"
 RESTOR_PANEL_EXPOSURE_SUSPECT:0 "Under suspicion"
 RESTOR_PANEL_EXPOSURE_HIGH:0 "Highly suspect"

 RESTOR_PANEL_NEXT_HEADER:0 "What You Can Do"
 RESTOR_PANEL_CHARGE:0 "#weak Your charge:#! [GetPlayer.Custom('RestorCurrentCharge')]"
 RESTOR_PANEL_ACTION_CROWN:0 "Restore the Crown"
 RESTOR_PANEL_ACTION_CROWN_TT:0 "A decision for the heir. Needs #high 40#! support and #high 25%#! of the old kingdom's land in the heir's realm."
 RESTOR_PANEL_ACTION_RAISE:0 "Raise the Standard"
 RESTOR_PANEL_ACTION_RAISE_TT:0 "A decision for the heir. Needs #high 40#! support. Can be taken once each time the crown is lost."
 RESTOR_PANEL_ACTION_GIVE:0 "Give to the Cause"
 RESTOR_PANEL_ACTION_GIVE_TT:0 "A decision. Give #high 100#! gold for favour."
 RESTOR_PANEL_ACTION_GATHER:0 "Hold a Gathering"
 RESTOR_PANEL_ACTION_GATHER_TT:0 "An activity for a Captain or the Keeper."
 RESTOR_PANEL_ACTION_ERRAND:0 "Ride on an Errand"
 RESTOR_PANEL_ACTION_ERRAND_TT:0 "An activity: a journey to the old kingdom on the order's business."
 RESTOR_PANEL_POWERS_HINT:0 "Right-click a character for the society's powers: sounding out and swearing in new members, letters from the heir, forged charters and more. Higher standing unlocks more."

 RESTOR_PANEL_ROSTER_HEADER:0 "THE SWORN YOU KNOW"
 RESTOR_PANEL_ROSTER_EMPTY:0 "No one you know of. Captains and above know the whole roll."
 RESTOR_ROSTER_HEIR:0 "Heir"
 RESTOR_ROSTER_KEEPER:0 "Keeper"
 RESTOR_ROSTER_SUSPECT:0 "suspected"
 RESTOR_ROSTER_VERY_SUSPECT:0 "openly suspected"
 RESTOR_PANEL_REACH_HEADER:0 "WITHIN REACH"
 RESTOR_PANEL_REACH_HINT:0 "The old house's blood, and lords of its people or its lands, near enough to approach. Nothing marks who will listen. Look at what they are."
 RESTOR_PANEL_REACH_EMPTY:0 "No one with a stake in the crown is near enough to approach."
 RESTOR_REACH_BLOOD:0 "Of the blood"
 RESTOR_REACH_SYMPATHETIC:0 "sympathetic"
 RESTOR_REACH_REFUSED:0 "refused lately"
 RESTOR_REACH_APPROACH:0 "Approach"
 RESTOR_REACH_APPROACH_TT:0 "Sound them out, or offer them the oath."
 restor_recruitment_filter_tag_desc:0 "Bring Them In"
 RESTOR_PEOPLE_TITLE:0 "The Order"
 RESTOR_PEOPLE_BUTTON_MEMBERS:0 "The Sworn"
 RESTOR_PEOPLE_BUTTON_REACH:0 "Within Reach"
