l_english:

 # Every string the society prototype needs.
 #
 # Voice: cold and specific. Nobody here is having an adventure, nobody is cackling, and the
 # society does not explain itself to people who are not in it. The same register the wilderness
 # files use, pointed at a different subject.
 #
 # WHERE THE GENERATED VERSION WILL DIFFER
 # ---------------------------------------
 # Every bare "the society" below is a placeholder for a name a generator would supply,
 # and every one of them is a `$gen_cult_name$`-shaped substitution in the real thing -- CK3
 # resolves $another_loc_key$ against another entry, which this project already relies on for
 # holy site names. The prose around those nouns does NOT need to be generated, and should not
 # be: what varies between worlds is the vocabulary, not the sentences.
 #
 # The strings below are written to make those seams visible. Nothing refers to a specific god,
 # a specific faith or a specific crime, because the prototype has no host faith to borrow that
 # vocabulary from -- which is exactly the gap the generated version fills.

 # --- The trait ------------------------------------------------------------------------------

 trait_society_member:0 "Society Member"
 trait_society_member_desc:0 "Sworn into a body that keeps no roll of its members and meets where it will not be counted."
 trait_society_member_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] belongs to something that does not put its name to things."

 # The track is named once and its levels are numbered by the engine -- see the note in
 # common/traits/00_society_traits.txt for why there are no per-rung keys to write here.
 trait_track_society_rank:0 "Standing"
 trait_track_society_rank_desc:0 "How far in. Nobody is told where they stand; they work it out from what they are asked to do."

 # --- The planner category -------------------------------------------------------------------
 #
 # Header of the society's own foldout in the activity list. The key is "activity_group_type"
 # plus the group's key, which is the only loc an activity group takes -- there is no _desc and
 # no icon; the foldout is a text header and nothing else.
 #
 # In the generated version this becomes the cult's own name -- "$gen_cult_name$ Rites" -- and
 # a world with two societies gets two headers rather than one shared shelf.

 activity_group_type_society:0 "Rites"

 # --- The rite -------------------------------------------------------------------------------
 #
 # CK3 derives about a dozen keys from an activity's name and documents none of them. The set
 # below is the working inventory, taken from the wilderness activities -- a missing one shows
 # the raw key in the planner and reports nothing to the log.

 activity_society_rite:0 "Hold the Rite"
 activity_society_rite_name:0 "Hold the Rite"
 activity_society_rite_owner:0 "Convened by [ROOT.Char.GetTitledFirstName]"
 activity_society_rite_selection_tooltip:0 "Call the society together. Only members will come, because only members are asked."
 activity_society_rite_host_desc:0 "We convene it, which means we answer for it."
 activity_society_rite_guest_desc:0 "Only sworn members appear on this list. There is no version of it that does not."
 activity_society_rite_guest_help_text:0 "Members within reach. Anyone not sworn cannot be invited and cannot attend."
 activity_society_rite_destination_selection:0 "Where are we holding it?"
 activity_society_rite_predicted_cost:0 "Nothing in coin. What it costs is that everyone who comes now knows who else came."
 activity_society_rite_conclusion_desc:0 "It is done, and everyone who stood through it stands a little further in."
 # NO datafunctions in this one. An activity's `_desc` is not rendered with a character root --
 # every vanilla activity desc that wants dynamic text reaches for GetActivityType() or
 # ActivityWindow.GetActivity, and none of them use ROOT. A [ROOT.Char.GetHerHis] here produced
 # "Data error in loc string 'activity_society_rite_desc'" 376 times in a single session, once per
 # render of the planner. The neighbouring _owner key CAN use ROOT.Char and does.
 activity_society_rite_desc:0 "The society meets rarely and never by accident. A rite is convened, the people who are owed an invitation receive one, and for a fortnight one room in one capital holds more of the society than any other room in the world.\n\nNobody outside it is asked, because nobody outside it is told. That is not caution about this particular gathering — it is the arrangement the society exists under, and the reason it has survived long enough to be worth joining."
 # The travel plan's name for the journey out. Derived from the activity key, named nowhere,
 # and caught only by ck3-tiger -- an unlocalised one shows the raw key on the travel banner.
 TRAVEL_NAME_FOR_activity_society_rite:0 "Journey to the Rite"

 activity_society_rite_province_desc:0 "The host's own seat. Somewhere with doors, and people who have learned not to ask about the traffic through them."

 # --- The intent -----------------------------------------------------------------------------

 society_rite_intent:0 "Stand Through It"
 society_rite_intent_desc:0 "There is one reason to be here and everyone present already knows it."

 # --- The phase ------------------------------------------------------------------------------

 society_rite_phase:0 "The Rite"
 society_rite_phase_desc:0 "A fortnight. Most of it is waiting, and the waiting is done together on purpose."

 # --- The guest list -------------------------------------------------------------------------

 # Two categories, matching vanilla's witch ritual. A preference, not a requirement — an earlier
 # note claiming a single rule broke the guest window was wrong. The split is also the
 # useful one: which of the two is empty says which iterator found nobody.
 activity_invite_rule_society_court:0 "Sworn in Our Court"
 activity_invite_rule_society_court_desc:0 "Members under our own roof. The ones we swore ourselves, mostly, and the ones who swore us."
 activity_invite_rule_society_abroad:0 "Sworn Elsewhere"
 activity_invite_rule_society_abroad_desc:0 "Members among our vassals, our blood and our liege — everyone whose allegiance we know of without sharing a hall with them. Nobody outside these lists can be invited or attend."

 # --- Tooltips -------------------------------------------------------------------------------

 society_rite_requires_membership_tt:0 "Must be a sworn member of the society"
 society_rite_requires_standing_tt:0 "Must have standing enough to be listened to — #bold 50#! or better"

 # --- The powers ------------------------------------------------------------------------------
 #
 # `_filter_tag_desc` is the header the filtered interaction menu shows above this group. The
 # key is the tag plus that suffix and it is documented only in _character_interactions.info --
 # without it the menu shows the raw tag.

 society_power_filter_tag_desc:0 "Powers"

 # TWO different strings, and the category's `desc` field is NOT the one on the header.
 #
 # The header in the right-click menu is drawn by `InteractionCategoryItem.GetName`, which looks
 # up a loc key named EXACTLY after the category's own key — vanilla keeps those in
 # localization/english/gui/characterinteractionwindow_l_english.yml
 # (interaction_category_hostile: "Hostile", interaction_category_friendly: "Personal", and so
 # on). Nothing points at them from script, so nothing tells you they exist: leaving this key out
 # renders the literal string "interaction_category_society" as the header and logs nothing.
 # ck3-tiger does not catch it either, because from its side the category is fully defined.
 #
 # Title Case here, not the lowercase used just below, because these are headers sitting in a
 # column beside "Personal", "Hostile" and "Prison".
 interaction_category_society:0 "Societies"

 # The category's `desc` field. Vanilla writes these as lowercase noun phrases because they are
 # used inside sentences rather than as a header — "hostile actions", "vassal actions".
 # The generated version substitutes the cult's own name into both of these the same way the
 # Rites activity header does.
 SOCIETY_ACTIONS:0 "society actions"

 # Shared across every power, so the reason a button is grey is worded the same way each time.
 society_power_requires_membership_tt:0 "Must be a sworn member of the society"
 society_power_requires_standing_tt:0 "Must have standing enough to be trusted with it"

 # Sacrifice. The society does not publish its rates — the number is deliberately absent here,
 # which is the voice and also means the formula can be retuned without touching this file.
 society_sacrifice_interaction:0 "Sacrifice"
 society_sacrifice_interaction_desc:0 "There is a use for [recipient.GetTitledFirstNameNoTooltip] that does not require [recipient.GetHerHim] to agree to it."
 society_sacrifice_gain_tt:0 "Gain #bold Dark Power#! in proportion to what they were"

 # public_knowledge = no on the death reason, so the first string is what the world reads and
 # the second is what anyone who learns the truth reads instead.
 death_society_sacrifice:0 "died in captivity"
 death_society_sacrifice_killer:1 "was given to something in [TARGET_CHARACTER.GetUINamePossessive] keeping"

 # Abduction. The first power that SPENDS, so the cost tooltip is the only place in the whole set
 # where the society states a number out loud — a price is the one thing it has to be explicit
 # about, because a greyed button with no figure on it is just a broken button.
 society_abduct_interaction:0 "Take Them"
 society_abduct_interaction_desc:0 "[recipient.GetTitledFirstNameNoTooltip] can be somewhere else by spring, and in no position to be asked about it. Arranging that costs the society, and the society does not refund arrangements that are abandoned halfway."
 society_abduct_cost_tt:0 "Costs #bold 100 Dark Power#!"
 society_abduct_no_great_lords_tt:0 "Must not be a Duke or greater — a lord of that standing is a war, not a disappearance"
 society_abduct_started_toast:0 "Arrangements Are Made"

 # The scheme itself. A scheme names itself in four places and CK3 derives none of them.
 society_abduct:0 "Take Them"
 # `<key>_action` is a second name for the same scheme, used where the UI needs it as a verb
 # phrase rather than a title. Vanilla carries both for every scheme (abduct / abduct_action) and
 # ck3-tiger is the only thing that reports the second one missing.
 society_abduct_action:0 "Take Them"
 society_abduct_desc:0 "Someone is being moved, and the people moving them have been paid enough not to ask why."
 society_abduct_success_desc:0 "They are ours, and nobody who matters saw it happen."
 society_abduct_discovery_desc:0 "Somebody has worked out what the comings and goings were for."
 society_abduct_invalidated_title:0 "The Arrangement Lapses"

 # --- The approach, from the recruiter's side ------------------------------------------------

 society_offer_oath_interaction:0 "Offer the Oath"
 society_offer_oath_interaction_desc:0 "Say it out loud to [recipient.GetTitledFirstNameNoTooltip], and find out what [recipient.GetSheHe] does with it."

 # The two toasts are the recruiter's only account of what happened. The interaction is
 # auto_accept and the decision is taken inside society.0001 by whoever was asked, so without
 # these the button reports nothing at all — see the notes on both options in the event file.
 society_oath_accepted_toast:0 "[ROOT.Char.GetTitledFirstName] Is Sworn"
 society_oath_refused_toast:0 "[ROOT.Char.GetTitledFirstName] Refused"

 # --- The approach, from the other side ------------------------------------------------------

 society.0001.t:0 "A Quiet Word"
 society.0001.desc:0 "[society_recruiter.GetTitledFirstName] has been in this court long enough that [society_recruiter.GetSheHe] is furniture, and [society_recruiter.GetSheHe] chooses a moment when the room has emptied to stop being furniture.\n\nWhat [society_recruiter.GetSheHe] describes has no name that [society_recruiter.GetSheHe] is willing to say, no holdings, and no head that [society_recruiter.GetSheHe] will admit to. It has members, in more courts than this one, and it has been asking about us.\n\n[society_recruiter.GetSheHe] does not press, which is somehow worse. [society_recruiter.GetSheHe] has already taken the risk simply by finishing the sentence."
 society.0001.desc_alone:0 "The approach comes, and it comes badly — a note with no hand on it, left where only we would find it, describing a body with no name and asking whether we would care to be counted among it.\n\nThere is nobody to ask about it. Whoever wrote it is not in this court, or is and is not going to say so."
 society.0001.a:0 "Say yes. Quietly."
 society.0001.b:0 "Refuse — and remember the face."

 # --- The rite ---------------------------------------------------------------------------------
 #
 # Voice: the same as everything else in this set. Nobody here is having an adventure, nothing is
 # eldritch, and the society is not described from outside — it is described by people who are in
 # it and who have got used to it. The horror, where there is any, is administrative.

 society.0100.t:0 "The Convening"
 society.0100.desc:0 "They arrive over three days, in ones and twos, by routes that do not cross. #bold [ROOT.Char.MakeScope.Var('society_rite_attendance').GetValue|0]#! of them in the end, in a room chosen because it has one door and nothing overlooking the yard.\n\nNobody has said what it is for. That is ours to say, and it is the only thing any of them will remember about the fortnight. A rite is expensive and it is dangerous, and a society that gathers for nothing does not get asked to gather twice."
 society.0100.a:0 "Ask who is not here."
 society.0100.b:0 "Raise somebody."
 society.0100.c:0 "Say nothing at all. Let them go home."

 society.0101.t:0 "The Room"
 society.0101.desc:0 "We were given a night and a door and no other detail, and the room turns out to hold more of the society than we had any idea existed. [host.GetTitledFirstName] is standing where everyone can see [host.GetHerHim].\n\nHalf the room is lit and half of it is not, and everybody here worked out which half they were standing in before they took their coat off."
 society.0101.desc_alone:0 "We were given a night and a door and no other detail.\n\nHalf the room is lit and half of it is not, and everybody here worked out which half they were standing in before they took their coat off."
 society.0101.a:0 "Stand in the light."
 society.0101.b:0 "Stand near the door."

 society.0110.t:0 "The Reckoning"
 society.0110.desc:0 "[society_absentee.GetTitledFirstName] is not here.\n\n[society_absentee.GetSheHe|U] was asked. [society_absentee.GetSheHe|U] is half a day's ride away and in good health, and [society_absentee.GetSheHe] is not here. Nobody in the room says the name out loud. Every one of them is waiting to see whether we will."
 society.0110.desc_full:0 "Everyone who was asked came.\n\nThat has not happened before, and the room knows it. There is nobody to make an example of tonight, which leaves only the bare fact of all of us being in one place at one time, and how much that would be worth to somebody outside."
 society.0110.a:0 "Say the name."
 society.0110.b:0 "Let it stand."
 society.0110.c:0 "Let them see that the room is whole."

 society.0111.t:0 "The Elevation"
 society.0111.desc:0 "[society_candidate.GetTitledFirstName] has spent years doing the parts of this that nobody writes down, and has never once asked to be thanked for it where anyone could hear.\n\nThe room is expecting a name tonight. It is expecting that one. Nothing obliges us to agree with it."
 society.0111.desc_alone:0 "The room is expecting a name tonight.\n\nThere is nobody in the room but us, which narrows it considerably."
 society.0111.a:0 "Say [society_candidate.GetFirstNameNoTooltip]."
 society.0111.b:0 "Say our own name."

 # --- Debug ----------------------------------------------------------------------------------
 #
 # society.9001's only output. The number is the point: a zero means the court is empty or all
 # children, which is a different fault from the guest list being broken.
 society_debug_sworn_toast:0 "#bold [ROOT.Char.MakeScope.Var('society_debug_sworn').GetValue|0]#! courtiers sworn into the society"
 society_debug_standing_toast:0 "Standing raised. Two presses from a fresh induction clears the rite's threshold of 50."

 # --- Opinion --------------------------------------------------------------------------------

 society_refused_the_oath_opinion:0 "I said something to you I should not have"
 society_struck_from_the_roll_opinion:0 "Said my name in front of all of them"
 society_elevated_by_opinion:0 "Raised me when it cost you to do it"
 society_took_the_rite_opinion:0 "Took the night for yourself"

 # --- The panel ------------------------------------------------------------------------------
 #
 # Modelled on CK2's society screen: rank, currency, and the full ladder of powers with the ones
 # above your rank listed rather than hidden. The rank names are deliberately plain — this
 # prototype's society has no name and no flavour of its own, and a generated one will draw all
 # five of these from its host religion's language instead.

 # The HUD tab's hover text. Vanilla's siblings are COUNCIL_BUTTON, INTRIGUE_BUTTON and so on;
 # this one is written by Emit/GuiWriter.cs into gui/hud.gui and reads the key from here, which
 # is the usual split — the .gui is generated, everything it names is static.
 # `#T ... #!` and not bare text. Every vanilla tab tooltip is wrapped this way -- INTRIGUE_BUTTON
 # is "#T Intrigue#!" -- and the tag is what gives them their heavier weight. Without it ours was
 # the one tooltip in the column rendering in body text.
 SOCIETY_TAB_BUTTON:0 "#T The Society#!"

 SOCIETY_PANEL_TITLE:0 "The Society"
 SOCIETY_PANEL_BLURB:0 "It keeps no roll. What follows is only what we have been able to work out from the people we have met and the nights we have stood through."

 SOCIETY_PANEL_STANDING_LABEL:0 "STANDING"
 SOCIETY_PANEL_DARK_POWER_LABEL:0 "DARK POWER"
 SOCIETY_PANEL_VISIBILITY_LABEL:0 "VISIBILITY"

 # SOCIETY_PANEL_LADDER_HEADER and SOCIETY_PANEL_LADDER_HERE are gone with the seven-row ladder.
 # The header restated the Standing line directly above it, and the "you are here" marker existed
 # only because the rows were far enough apart that the lit one was hard to pick out. On one line
 # the bold rung is its own marker.

 SOCIETY_PANEL_POWERS_HEADER:0 "POWERS"
 SOCIETY_PANEL_POWER_RITE:0 "Hold the Rite — convene the society at your seat"
 SOCIETY_PANEL_POWER_AVAILABLE:0 "Available"
 SOCIETY_PANEL_POWER_LOCKED:0 "Standing 50"

 SOCIETY_PANEL_ROSTER_HEADER:0 "KNOWN MEMBERS"
 SOCIETY_PANEL_ROSTER_EMPTY:0 "Nobody. Either we are the only one within reach, or the others are better at this than we are."

 # The five rungs. Two forms of each: the bare name for the standing block and the roster, and a
 # row form for the ladder that says what the rung is worth.
 SOCIETY_RANK_0:0 "Unproven"
 SOCIETY_RANK_1:0 "Sworn"
 SOCIETY_RANK_2:0 "Trusted"
 SOCIETY_RANK_3:0 "Adept"
 SOCIETY_RANK_4:0 "Inner Circle"

 # PARKED, not dead. These carry what each rung actually grants, which the one-line ladder has no
 # room for and which is the only thing lost in the change. Nothing references them today; they are
 # kept because the obvious home for them is a tooltip on each rung name, and rewriting them later
 # would be worse than leaving five finished lines where they are.
 SOCIETY_RANK_0_ROW:0 "Unproven — sworn, and nothing more than that yet"
 SOCIETY_RANK_1_ROW:0 "Sworn (25) — #bold +1#! Intrigue"
 SOCIETY_RANK_2_ROW:0 "Trusted (50) — #bold +1#! Intrigue, #bold +1#! Learning, and the rite is yours to call"
 SOCIETY_RANK_3_ROW:0 "Adept (75) — #bold +1#! Intrigue, #bold +1#! Learning, #bold +5#! Dread"
 SOCIETY_RANK_4_ROW:0 "Inner Circle (100) — #bold +2#! Intrigue, #bold +1#! Learning, #bold +10#! Dread"

 # --- The way in ------------------------------------------------------------------------------

 society_panel_decision:0 "Take Stock of the Society"
 society_panel_decision_desc:0 "Sit down and work out, from what we have been told and what we have guessed, how far in we actually are and who else is in with us."
 society_panel_decision_tooltip:0 "Open the society panel."
 society_panel_decision_confirm:0 "Take stock"
