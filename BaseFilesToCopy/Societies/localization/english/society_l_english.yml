l_english:

 # Every string the society prototype needs.
 #
 # Voice: cold and specific. Nobody here is having an adventure, nobody is cackling, and the
 # society does not explain itself to people who are not in it. The same register the wilderness
 # files use, pointed at a different subject.
 #
 # WHERE THE GENERATED VERSION WILL DIFFER
 # ---------------------------------------
 # Every bare "the society" below is a placeholder for a name a generator would supply,
 # and every one of them is a `$gen_cult_name$`-shaped substitution in the real thing -- CK3
 # resolves $another_loc_key$ against another entry, which this project already relies on for
 # holy site names. The prose around those nouns does NOT need to be generated, and should not
 # be: what varies between worlds is the vocabulary, not the sentences.
 #
 # The strings below are written to make those seams visible. Nothing refers to a specific god,
 # a specific faith or a specific crime, because the prototype has no host faith to borrow that
 # vocabulary from -- which is exactly the gap the generated version fills.

 # --- The trait ------------------------------------------------------------------------------

 trait_society_member:0 "Society Member"
 trait_society_member_desc:0 "Sworn into a body that keeps no roll of its members and meets where it will not be counted."
 trait_society_member_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] belongs to something that does not put its name to things."

 # The track is named once and its levels are numbered by the engine -- see the note in
 # common/traits/00_society_traits.txt for why there are no per-rung keys to write here.
 trait_track_society_rank:0 "Standing"
 trait_track_society_rank_desc:0 "How far in. Nobody is told where they stand; they work it out from what they are asked to do."

 # --- The planner category -------------------------------------------------------------------
 #
 # Header of the society's own foldout in the activity list. The key is "activity_group_type"
 # plus the group's key, which is the only loc an activity group takes -- there is no _desc and
 # no icon; the foldout is a text header and nothing else.
 #
 # In the generated version this becomes the cult's own name -- "$gen_cult_name$ Rites" -- and
 # a world with two societies gets two headers rather than one shared shelf.

 activity_group_type_society:0 "Rites"

 # --- The rite -------------------------------------------------------------------------------
 #
 # CK3 derives about a dozen keys from an activity's name and documents none of them. The set
 # below is the working inventory, taken from the wilderness activities -- a missing one shows
 # the raw key in the planner and reports nothing to the log.

 activity_society_rite:0 "Hold the Rite"
 activity_society_rite_name:0 "Hold the Rite"
 activity_society_rite_owner:0 "Convened by [ROOT.Char.GetTitledFirstName]"
 activity_society_rite_selection_tooltip:0 "Call the society together. Only members will come, because only members are asked."
 activity_society_rite_host_desc:0 "We convene it, which means we answer for it."
 activity_society_rite_guest_desc:0 "Only sworn members appear on this list. There is no version of it that does not."
 activity_society_rite_guest_help_text:0 "Members within reach. Anyone not sworn cannot be invited and cannot attend."
 activity_society_rite_destination_selection:0 "Where are we holding it?"
 activity_society_rite_predicted_cost:0 "Nothing in coin. What it costs is that everyone who comes now knows who else came."
 activity_society_rite_conclusion_desc:0 "It is done, and everyone who stood through it stands a little further in."
 # NO datafunctions in this one. An activity's `_desc` is not rendered with a character root --
 # every vanilla activity desc that wants dynamic text reaches for GetActivityType() or
 # ActivityWindow.GetActivity, and none of them use ROOT. A [ROOT.Char.GetHerHis] here produced
 # "Data error in loc string 'activity_society_rite_desc'" 376 times in a single session, once per
 # render of the planner. The neighbouring _owner key CAN use ROOT.Char and does.
 activity_society_rite_desc:0 "The society meets rarely and never by accident. A rite is convened, the people who are owed an invitation receive one, and for a fortnight one room in one capital holds more of the society than any other room in the world.\n\nNobody outside it is asked, because nobody outside it is told. That is not caution about this particular gathering — it is the arrangement the society exists under, and the reason it has survived long enough to be worth joining."
 # The travel plan's name for the journey out. Derived from the activity key, named nowhere,
 # and caught only by ck3-tiger -- an unlocalised one shows the raw key on the travel banner.
 TRAVEL_NAME_FOR_activity_society_rite:0 "Journey to the Rite"

 activity_society_rite_province_desc:0 "The host's own seat. Somewhere with doors, and people who have learned not to ask about the traffic through them."

 # --- The intent -----------------------------------------------------------------------------

 society_rite_intent:0 "Stand Through It"
 society_rite_intent_desc:0 "There is one reason to be here and everyone present already knows it."

 # --- The phase ------------------------------------------------------------------------------

 society_rite_phase:0 "The Rite"
 society_rite_phase_desc:0 "A fortnight. Most of it is waiting, and the waiting is done together on purpose."

 # --- The guest list -------------------------------------------------------------------------

 # Two categories, matching vanilla's witch ritual. A preference, not a requirement — an earlier
 # note claiming a single rule broke the guest window was wrong. The split is also the
 # useful one: which of the two is empty says which iterator found nobody.
 activity_invite_rule_society_court:0 "Sworn in Our Court"
 activity_invite_rule_society_court_desc:0 "Members under our own roof. The ones we swore ourselves, mostly, and the ones who swore us."
 activity_invite_rule_society_abroad:0 "Sworn Elsewhere"
 activity_invite_rule_society_abroad_desc:0 "Members among our vassals, our blood and our liege — everyone whose allegiance we know of without sharing a hall with them. Nobody outside these lists can be invited or attend."

 # --- Tooltips -------------------------------------------------------------------------------

 society_rite_requires_membership_tt:0 "Must be a sworn member of the society"
 society_rite_requires_standing_tt:0 "Must have standing enough to be listened to — #bold 50#! or better"

 # --- Exposure ----------------------------------------------------------------------------------
 #
 # Two tooltips and one toast, shared by every place the society raises or lowers Visibility.
 #
 # ONE key per direction rather than one per amount: society_visibility_gain_effect saves the
 # figure as a scope value first, so the string reads it rather than having it baked in (bare name, NOT scope: -- that is a loc parse error). Add a new
 # power that costs 7 exposure and nothing here needs touching.
 #
 # The tooltip is the BEFORE and names the delta; the toast is the AFTER and names the TOTAL. Both
 # are needed and they are not redundant — a delta means nothing without the running sum, and the
 # sum is the number that eventually gets a member caught.
 society_visibility_rises_tt:0 "#bold Exposure#! rises by #bold [society_visibility_delta|0]#!"
 society_visibility_falls_tt:0 "#bold Exposure#! falls by #bold [society_visibility_delta|0]#!"
 society_visibility_toast:0 "Exposure now stands at #bold [ROOT.Char.MakeScope.Var('society_visibility').GetValue|0]#!"

 # --- The powers ------------------------------------------------------------------------------
 #
 # `_filter_tag_desc` is the header the filtered interaction menu shows above this group. The
 # key is the tag plus that suffix and it is documented only in _character_interactions.info --
 # without it the menu shows the raw tag.

 society_power_filter_tag_desc:0 "Powers"

 # TWO different strings, and the category's `desc` field is NOT the one on the header.
 #
 # The header in the right-click menu is drawn by `InteractionCategoryItem.GetName`, which looks
 # up a loc key named EXACTLY after the category's own key — vanilla keeps those in
 # localization/english/gui/characterinteractionwindow_l_english.yml
 # (interaction_category_hostile: "Hostile", interaction_category_friendly: "Personal", and so
 # on). Nothing points at them from script, so nothing tells you they exist: leaving this key out
 # renders the literal string "interaction_category_society" as the header and logs nothing.
 # ck3-tiger does not catch it either, because from its side the category is fully defined.
 #
 # Title Case here, not the lowercase used just below, because these are headers sitting in a
 # column beside "Personal", "Hostile" and "Prison".
 interaction_category_society:0 "Societies"

 # The category's `desc` field. Vanilla writes these as lowercase noun phrases because they are
 # used inside sentences rather than as a header — "hostile actions", "vassal actions".
 # The generated version substitutes the cult's own name into both of these the same way the
 # Rites activity header does.
 SOCIETY_ACTIONS:0 "society actions"

 # Shared across every power, so the reason a button is grey is worded the same way each time.
 society_power_requires_membership_tt:0 "Must be a sworn member of the society"
 society_power_requires_standing_tt:0 "Must have standing enough to be trusted with it"

 # Sacrifice. The society does not publish its rates — the number is deliberately absent here,
 # which is the voice and also means the formula can be retuned without touching this file.
 society_sacrifice_interaction:0 "Sacrifice"
 society_sacrifice_interaction_desc:0 "There is a use for [recipient.GetTitledFirstNameNoTooltip] that does not require [recipient.GetHerHim] to agree to it."
 society_sacrifice_gain_tt:0 "Gain #bold Dark Power#! in proportion to what they were"

 # public_knowledge = no on the death reason, so the first string is what the world reads and
 # the second is what anyone who learns the truth reads instead.
 death_society_sacrifice:0 "died in captivity"
 death_society_sacrifice_killer:1 "was given to something in [TARGET_CHARACTER.GetUINamePossessive] keeping"

 # Abduction. The first power that SPENDS, so the cost tooltip is the only place in the whole set
 # where the society states a number out loud — a price is the one thing it has to be explicit
 # about, because a greyed button with no figure on it is just a broken button.
 society_abduct_interaction:0 "Take Them"
 society_abduct_interaction_desc:0 "[recipient.GetTitledFirstNameNoTooltip] can be somewhere else by spring, and in no position to be asked about it. Arranging that costs the society, and the society does not refund arrangements that are abandoned halfway."
 society_abduct_cost_tt:0 "Costs #bold 100 Dark Power#!"
 society_abduct_no_great_lords_tt:0 "Must not be a Duke or greater — a lord of that standing is a war, not a disappearance"
 society_abduct_started_toast:0 "Arrangements Are Made"

 # The scheme itself. A scheme names itself in four places and CK3 derives none of them.
 society_abduct:0 "Take Them"
 # `<key>_action` is a second name for the same scheme, used where the UI needs it as a verb
 # phrase rather than a title. Vanilla carries both for every scheme (abduct / abduct_action) and
 # ck3-tiger is the only thing that reports the second one missing.
 society_abduct_action:0 "Take Them"
 society_abduct_desc:0 "Someone is being moved, and the people moving them have been paid enough not to ask why."
 society_abduct_success_desc:0 "They are ours, and nobody who matters saw it happen."
 society_abduct_discovery_desc:0 "Somebody has worked out what the comings and goings were for."
 society_abduct_invalidated_title:0 "The Arrangement Lapses"

 # --- The approach, from the recruiter's side ------------------------------------------------

 society_offer_oath_interaction:0 "Offer the Oath"
 society_offer_oath_interaction_desc:0 "Say it out loud to [recipient.GetTitledFirstNameNoTooltip], and find out what [recipient.GetSheHe] does with it."

 # The recruiter's account of what happened used to be two toasts defined here. It is now
 # society.0002 and society.0003 — the interaction is still auto_accept and the decision is still
 # taken inside society.0001 by whoever was asked, but the recruiter gets an event with the
 # answer in it rather than a line that scrolls past. The toast keys are deleted rather than left
 # in place: an unreferenced loc key is invisible to ck3-tiger and to the game, so it survives
 # indefinitely and reads as live text to whoever edits this file next.

 # --- The approach, from the other side ------------------------------------------------------

 society.0001.t:0 "A Quiet Word"
 society.0001.desc:0 "[society_recruiter.GetTitledFirstName] has been in this court long enough that [society_recruiter.GetSheHe] is furniture, and [society_recruiter.GetSheHe] chooses a moment when the room has emptied to stop being furniture.\n\nWhat [society_recruiter.GetSheHe] describes has no name that [society_recruiter.GetSheHe] is willing to say, no holdings, and no head that [society_recruiter.GetSheHe] will admit to. It has members, in more courts than this one, and it has been asking about us.\n\n[society_recruiter.GetSheHe] does not press, which is somehow worse. [society_recruiter.GetSheHe] has already taken the risk simply by finishing the sentence."
 society.0001.desc_alone:0 "The approach comes, and it comes badly — a note with no hand on it, left where only we would find it, describing a body with no name and asking whether we would care to be counted among it.\n\nThere is nobody to ask about it. Whoever wrote it is not in this court, or is and is not going to say so."
 society.0001.a:0 "Say yes. Quietly."
 society.0001.b:0 "Refuse — and remember the face."

 # --- The answer, from the recruiter's side ----------------------------------------------------
 #
 # ROOT is the RECRUITER in both of these, and scope:society_answerer is the person who answered.
 # That is the reverse of society.0001 above, where ROOT is the one being asked — so the "we" in
 # these two strings is the person who did the asking, and the same word means the other party
 # eight lines up. Worth checking against before editing either.

 society.0002.t:0 "Sworn"
 society.0002.desc:0 "[society_answerer.GetTitledFirstName] says yes the way people do when they have already decided and are waiting to be asked — no questions, no conditions, and no pause anywhere it belonged.\n\nThat is the part worth thinking about later. For now there is one more of us than there was this morning, and [society_answerer.GetSheHe] will be told the rest of it slowly, the way we all were."
 society.0002.a:0 "Good. Nothing else changes today."

 society.0003.t:0 "The One Who Said No"
 society.0003.desc:0 "[society_answerer.GetTitledFirstName] says no, and says it kindly, which is the worst of the available answers. A hard no is a person who wants the subject closed. A kind one is a person who has decided to be generous about something they now know.\n\n[society_answerer.GetSheHe] will not go to [society_answerer.GetFaith.PriestMale] tonight. Tonight [society_answerer.GetSheHe] will decide [society_answerer.GetSheHe] misheard. It is the week after, and the year after, that we have no answer for."
 society.0003.a:0 "Make it worth [society_answerer.GetHerHis] while to have misheard."
 society.0003.b:0 "Nothing. Let [society_answerer.GetHerHim] carry it."

 # --- The rite ---------------------------------------------------------------------------------
 #
 # Voice: the same as everything else in this set. Nobody here is having an adventure, nothing is
 # eldritch, and the society is not described from outside — it is described by people who are in
 # it and who have got used to it. The horror, where there is any, is administrative.

 society.0100.t:0 "The Convening"
 society.0100.desc:0 "They arrive over three days, in ones and twos, by routes that do not cross. #bold [ROOT.Char.MakeScope.Var('society_rite_attendance').GetValue|0]#! of them in the end, in a room chosen because it has one door and nothing overlooking the yard.\n\nNobody has said what it is for. That is ours to say, and it is the only thing any of them will remember about the fortnight. A rite is expensive and it is dangerous, and a society that gathers for nothing does not get asked to gather twice."
 society.0100.a:0 "Ask who is not here."
 society.0100.b:0 "Raise somebody."
 society.0100.c:0 "Say nothing at all. Let them go home."

 society.0101.t:0 "The Room"
 society.0101.desc:0 "We were given a night and a door and no other detail, and the room turns out to hold more of the society than we had any idea existed. [host.GetTitledFirstName] is standing where everyone can see [host.GetHerHim].\n\nHalf the room is lit and half of it is not, and everybody here worked out which half they were standing in before they took their coat off."
 society.0101.desc_alone:0 "We were given a night and a door and no other detail.\n\nHalf the room is lit and half of it is not, and everybody here worked out which half they were standing in before they took their coat off."
 society.0101.a:0 "Stand in the light."
 society.0101.b:0 "Stand near the door."

 society.0110.t:0 "The Reckoning"
 society.0110.desc:0 "[society_absentee.GetTitledFirstName] is not here.\n\n[society_absentee.GetSheHe|U] was asked. [society_absentee.GetSheHe|U] is half a day's ride away and in good health, and [society_absentee.GetSheHe] is not here. Nobody in the room says the name out loud. Every one of them is waiting to see whether we will."
 society.0110.desc_full:0 "Everyone who was asked came.\n\nThat has not happened before, and the room knows it. There is nobody to make an example of tonight, which leaves only the bare fact of all of us being in one place at one time, and how much that would be worth to somebody outside."
 society.0110.a:0 "Say the name."
 society.0110.b:0 "Let it stand."
 society.0110.c:0 "Let them see that the room is whole."

 society.0111.t:0 "The Elevation"
 society.0111.desc:0 "[society_candidate.GetTitledFirstName] has spent years doing the parts of this that nobody writes down, and has never once asked to be thanked for it where anyone could hear.\n\nThe room is expecting a name tonight. It is expecting that one. Nothing obliges us to agree with it."
 society.0111.desc_alone:0 "The room is expecting a name tonight.\n\nThere is nobody in the room but us, which narrows it considerably."
 society.0111.a:0 "Say [society_candidate.GetFirstNameNoTooltip]."
 society.0111.b:0 "Say our own name."

 # --- Debug ----------------------------------------------------------------------------------
 #
 # society.9001's only output. The number is the point: a zero means the court is empty or all
 # children, which is a different fault from the guest list being broken.
 society_debug_sworn_toast:0 "#bold [ROOT.Char.MakeScope.Var('society_debug_sworn').GetValue|0]#! courtiers sworn into the society"
 society_debug_standing_toast:0 "Standing raised. Two presses from a fresh induction clears the rite's threshold of 50."
 society_debug_dark_power_toast:0 "Dark Power granted. One press buys exactly one abduction and leaves the pool empty."

 # --- Opinion --------------------------------------------------------------------------------

 society_refused_the_oath_opinion:0 "I said something to you I should not have"
 society_struck_from_the_roll_opinion:0 "Said my name in front of all of them"
 society_elevated_by_opinion:0 "Raised me when it cost you to do it"
 society_took_the_rite_opinion:0 "Took the night for yourself"

 # --- The panel ------------------------------------------------------------------------------
 #
 # Modelled on CK2's society screen: rank, currency, and the full ladder of powers with the ones
 # above your rank listed rather than hidden. The rank names are deliberately plain — this
 # prototype's society has no name and no flavour of its own, and a generated one will draw all
 # five of these from its host religion's language instead.

 # The HUD tab's hover text. Vanilla's siblings are COUNCIL_BUTTON, INTRIGUE_BUTTON and so on;
 # this one is written by Emit/GuiWriter.cs into gui/hud.gui and reads the key from here, which
 # is the usual split — the .gui is generated, everything it names is static.
 # `#T ... #!` and not bare text. Every vanilla tab tooltip is wrapped this way -- INTRIGUE_BUTTON
 # is "#T Intrigue#!" -- and the tag is what gives them their heavier weight. Without it ours was
 # the one tooltip in the column rendering in body text.
 SOCIETY_TAB_BUTTON:0 "#T The Society#!"

 SOCIETY_PANEL_TITLE:0 "The Society"
 SOCIETY_PANEL_BLURB:0 "It keeps no roll. What follows is only what we have been able to work out from the people we have met and the nights we have stood through."

 SOCIETY_PANEL_STANDING_LABEL:0 "STANDING"
 SOCIETY_PANEL_DARK_POWER_LABEL:0 "DARK POWER"
 SOCIETY_PANEL_VISIBILITY_LABEL:0 "VISIBILITY"

 # SOCIETY_PANEL_LADDER_HEADER and SOCIETY_PANEL_LADDER_HERE are gone with the seven-row ladder.
 # The header restated the Standing line directly above it, and the "you are here" marker existed
 # only because the rows were far enough apart that the lit one was hard to pick out. On one line
 # the bold rung is its own marker.

 SOCIETY_PANEL_POWERS_HEADER:0 "POWERS"
 SOCIETY_PANEL_POWER_RITE:0 "Hold the Rite — convene the society at your seat"
 SOCIETY_PANEL_POWER_AVAILABLE:0 "Available"
 SOCIETY_PANEL_POWER_LOCKED:0 "Standing 50"

 SOCIETY_PANEL_ROSTER_HEADER:0 "KNOWN MEMBERS"
 SOCIETY_PANEL_ROSTER_EMPTY:0 "Nobody. Either we are the only one within reach, or the others are better at this than we are."

 # The five rungs. Two forms of each: the bare name for the standing block and the roster, and a
 # row form for the ladder that says what the rung is worth.
 SOCIETY_RANK_0:0 "Unproven"
 SOCIETY_RANK_1:0 "Sworn"
 SOCIETY_RANK_2:0 "Trusted"
 SOCIETY_RANK_3:0 "Adept"
 SOCIETY_RANK_4:0 "Inner Circle"

 # PARKED, not dead. These carry what each rung actually grants, which the one-line ladder has no
 # room for and which is the only thing lost in the change. Nothing references them today; they are
 # kept because the obvious home for them is a tooltip on each rung name, and rewriting them later
 # would be worse than leaving five finished lines where they are.
 SOCIETY_RANK_0_ROW:0 "Unproven — sworn, and nothing more than that yet"
 SOCIETY_RANK_1_ROW:0 "Sworn (25) — #bold +1#! Intrigue"
 SOCIETY_RANK_2_ROW:0 "Trusted (50) — #bold +1#! Intrigue, #bold +1#! Learning, and the rite is yours to call"
 SOCIETY_RANK_3_ROW:0 "Adept (75) — #bold +1#! Intrigue, #bold +1#! Learning, #bold +5#! Dread"
 SOCIETY_RANK_4_ROW:0 "Inner Circle (100) — #bold +2#! Intrigue, #bold +1#! Learning, #bold +10#! Dread"

 # --- The way in ------------------------------------------------------------------------------
 #
 # There is one door now: the HUD tab under Intrigue. The "Take Stock of the Society" decision and
 # its four keys are gone.
 #
 # It existed as a fallback for the window in which the tab did not, because the tab needs a patch
 # to vanilla's gui/hud.gui and only the generator can write one — so a `--static-only --societies`
 # run shipped a panel with no way to open it. The tab works, and a second door into the same
 # window is a decisions-panel entry that duplicates a button four pixels away.

 # --- The errand -------------------------------------------------------------------------------
 #
 # CK2's devil-worshipper missions, as an activity. The register is the same as everything else
 # here: nobody is cackling, the work is work, and the horror is that it is routine.
 #
 # NO hardcoded religious nouns. The devout quarry is described through
 # [ROOT.Char.GetFaith.PriestMale], so a procgen faith supplies its own word for what is being
 # taken. Writing "priest" here would be the same bug as the one fixed in society.0003.

 activity_society_errand:0 "The Errand"
 activity_society_errand_name:0 "The Errand"
 activity_society_errand_owner:0 "Sent by [ROOT.Char.GetTitledFirstName]"
 activity_society_errand_selection_tooltip:0 "Go out and bring the society back something it can use. The society does not ask twice and does not ask in writing."
 activity_society_errand_host_desc:0 "We go, and we answer for what comes back with us."
 activity_society_errand_guest_desc:0 "Two, at most. Anyone sworn. Nobody who is not."
 activity_society_errand_guest_help_text:0 "Members within reach. An errand does not need a retinue and is worse for having one."
 activity_society_errand_destination_selection:0 "Where are we going?"
 activity_society_errand_predicted_cost:0 "Nothing in coin. It is paid for afterwards, out of what is left of you."
 activity_society_errand_conclusion_desc:0 "We came back. Not everything did."
 activity_society_errand_desc:0 "The society does not hold land, levy taxes or keep books. What it has instead is a standing list of things it needs done, and the understanding that a member who has never done one of them is a member in name.\n\nAn errand is a month away from home with a plausible reason attached — an inspection, a shrine, a relative who is unwell. Nobody who waves us off is lied to exactly. They are simply told the part that will hold up if anyone asks."
 TRAVEL_NAME_FOR_activity_society_errand:0 "The Errand"
 activity_society_errand_province_desc:0 "Far enough that we are not known, close enough that being away a month raises nothing."

 society_errand_intent:0 "See It Done"
 society_errand_intent_desc:0 "There is one reason to be out here and it is not written down anywhere."
 society_errand_phase:0 "The Errand"
 society_errand_phase_desc:0 "Four weeks. Most of it is travelling, and the travelling is the part we will be able to describe afterwards."

 # --- The quarry, chosen in the planner --------------------------------------------------------
 #
 # Named as decisions rather than as victims. The society's language for this is procedural on
 # purpose — it is easier to send somebody on an errand than to send them to kill a man.

 society_errand_quarry:0 "What We Are Going For"
 errand_quarry_unmissed:0 "Someone Nobody Will Look For"
 errand_quarry_unmissed_desc:0 "The safest of the three and the one that costs the most in the end. There is always somebody at the edge of a town whose absence is an administrative matter. #bold Pays least. Noticed least.#!"
 errand_quarry_highborn:0 "Someone With a Name"
 errand_quarry_highborn_desc:0 "Harder to reach, harder to move, and there will be people whose profession is asking where they went. #bold Pays well. Will be looked for.#!"
 errand_quarry_devout:0 "Someone Who Believes"
 errand_quarry_devout_desc:0 "The society pays best for these and does not explain why. A missing [ROOT.Char.GetFaith.PriestMale] is not looked for by a family. #bold Pays most. Exposes most.#!"

 # --- The chain --------------------------------------------------------------------------------

 errand.0001.t:0 "The Setting Out"
 errand.0001.desc_unmissed:0 "The reason we gave for leaving is thin and nobody examined it, which is its own small lesson about how much of our life is taken on trust.\n\nWe are going somewhere we are not known, to find somebody whose absence will be a matter for a clerk rather than a family. The society was specific about that and about nothing else. Where, and who exactly, is ours to solve."
 errand.0001.desc_highborn:0 "The reason we gave for leaving is a good one, carefully built, and it will hold for about five weeks. That is the shape of the whole errand: everything is fine until it is suddenly and completely not.\n\nSomeone with a name. Someone with people. The society was specific that it wanted the difficulty, which means the difficulty is the point and not an obstacle to it."
 errand.0001.desc_devout:0 "The reason we gave for leaving is a pilgrimage, which is very nearly true and will be remembered as true by everyone we told.\n\nSomeone who believes. The society did not say why and we did not ask, and somewhere in the not-asking is the exact moment we stopped being a person who would have found this remarkable."
 errand.0001.a:0 "Ride."

 errand.0002.t:0 "Along For It"
 errand.0002.desc:0 "[host.GetTitledFirstName] has not said where we are going and has not said what for, and the correct thing to do — the thing that is understood without being explained — is to not ask either question.\n\nSo we ride, and we carry what we are handed, and at some point in the next month we will be asked to hold something or stand somewhere, and we will do it, and that will be our part."
 errand.0002.a:0 "Ask nothing."

 errand.0010.t:0 "Found"
 errand.0010.desc_unmissed:0 "It takes nine days, which is eight days longer than expected, because the difficulty is not finding somebody nobody will miss — it is being certain. Twice we were wrong. Twice somebody turned out to have a sister two towns over.\n\nThe third has nobody. We have watched long enough to be sure of it, and the watching has been the worst part so far, because a person you are certain about is a person you have paid attention to."
 errand.0010.desc_highborn:0 "Easier to find than the last one and immeasurably harder to approach. They travel with four people, two of whom are competent, and they keep no schedule we can rely on.\n\nThere is a window. There is always a window. The question is whether we take the first one we are offered or wait for a better one, knowing that every day we wait is a day we are here, being seen."
 errand.0010.desc_devout:0 "They are exactly where they were always going to be, doing exactly what they were always going to be doing, and that is what makes this one different from the others. A person with a routine is not difficult to take.\n\nThey are also kind to us. Twice. Without being asked, and without knowing who we are, which is a thing we will be carrying home regardless of how the rest of this goes."
 errand.0010.a:0 "Take the time. Do it properly."
 errand.0010.b:0 "Tonight. Before we think about it any more."

 errand.0020.t:0 "The Part Nobody Plans"
 errand.0020.desc_careful:0 "Something goes wrong, because something always does, and the difference is that we have time to notice it going wrong rather than discovering it afterwards.\n\nA week of watching bought us the two hours we need now. It is not a rescue. It is the ordinary, unglamorous business of having been careful, and it is why the society sends people who can wait."
 errand.0020.desc_hasty:0 "Something goes wrong immediately, and there is no margin in the plan to absorb it, because we did not build one.\n\nThere is a witness. Not a good one — tired, half-lit, unsure — but a person who saw something and will keep turning it over. We can improvise around this. Improvising is how the rest of the night will go now, and improvised work is the kind that gets remembered by somebody."
 errand.0020.a:0 "Use the time we bought."
 errand.0020.b:0 "Improvise. It will hold."
 errand.0020.c:0 "Stop. Go home with nothing."

 errand_careful_tt:0 "The errand will go #bold cleanly#! — half the exposure"
 errand_hasty_tt:0 "The errand will be #bold messy#! — full exposure"
 errand_clean_tt:0 "Nothing will be traced back"
 errand_messy_tt:0 "Somebody saw. #bold Full exposure.#!"
 errand_abandoned_tt:0 "The errand pays #bold nothing#!"
 errand_no_payment_tt:0 "No payment. Nothing was brought back."
 society_errand_paid_tt:0 "The society settles up — #bold Dark Power#! and #bold Standing#! gained"

 errand.0030.t:0 "Home"
 errand.0030.desc_clean:0 "Five weeks away, and the account of it we give at home is almost entirely true — which is the mark of an errand done properly. The lie is not in what we say but in the shape of what we leave out.\n\nThe society settles up without ceremony. There is no praise and no acknowledgement of what it cost, and both absences are deliberate: this was work, we were asked to do it, and we did it. The next one will simply be assumed."
 errand.0030.desc_messy:0 "Five weeks away, and we are home, and we got what we went for, and there is a person somewhere behind us still turning over something they half-saw.\n\nThe society settles up in full. It does not deduct for the witness and it does not mention them, which is worse than being told off — it means the witness is now our problem, and has been reclassified, quietly, as a thing we will be handling later."
 errand.0030.desc_abandoned:0 "We came home with nothing, and nobody has said anything about it.\n\nThat is the entire response. No summons, no reprimand, no question. Whatever was going to be asked of us next is simply not asked, and we will not know for some time whether that is mercy or arithmetic."
 errand.0030.a:0 "Nothing was brought back."
 errand.0030.b:0 "Take payment."
 errand.0030.c:0 "Take payment. Deal with the witness later."

 # --- Corruption -------------------------------------------------------------------------------
 #
 # Fired three days after a trait actually moves, never on the no-op branch — so this arriving
 # always means something changed. Written to read correctly whichever direction the roll went,
 # since one event covers both losing a virtue and gaining a vice.

 society_corruption_tt:0 "This will #bold change#! us"
 errand.0100.t:0 "A Thing We Used To Do"
 errand.0100.desc:0 "It is a small thing, and it happens at home, weeks later, over something that does not matter.\n\nThere was a way we would have handled it a year ago — a thing we would have said, or not said, or noticed. We do not handle it that way. We notice that we do not handle it that way, briefly, the way you notice a room has been rearranged, and then we get on with the afternoon.\n\nThe society did not ask for this and would not have thought to. It is simply what the work does to whoever does it."
 errand.0100.a:0 "It is not important."

 # --- Visibility: the thresholds ---------------------------------------------------------------
 #
 # Three lines, at 15 / 25 / 40, copied from CK2's own numbers. The voice rule for all of these:
 # nothing has been PROVEN at any point. Suspicion is not evidence and the society is not caught —
 # what changes is only how many people are thinking about you, which is why none of these events
 # has an option that does anything. There is nothing yet to do.

 society_under_suspicion:0 "Under Suspicion"
 society_under_suspicion_desc:0 "Something about this one does not add up, and enough people have said so that it has stopped being one person's idea."
 society_highly_suspect:0 "Highly Suspect"
 society_highly_suspect_desc:0 "It is no longer a question of whether there is something to find. It is a question of who finds it, and what they want for keeping it quiet."

 society.0200.t:0 "A Question Being Asked"
 society.0200.desc:0 "Nothing has happened. That is the difficulty in describing it.\n\nA conversation stops when we enter a room and starts again a beat too late. A servant we have had for years takes the long way past our door. Somebody has asked somebody else a question about us, and been careful enough not to ask us.\n\nThere is nothing to answer and nobody to answer it to."
 society.0200.a:0 "Then we give them nothing further."

 society.0201.t:0 "It Has a Name Now"
 society.0201.desc:0 "The thing being said about us has hardened. It is no longer a question that trails off — it is a sentence somebody finishes, and it is being finished in front of people who repeat it.\n\nOur [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] will hear it if [ROOT.Char.GetLiege.GetSheHe] has not already. Not from us."
 society.0201.a:0 "Let them prove a word of it."

 society.0202.t:0 "No Point Denying It"
 society.0202.desc:0 "There is a threshold past which a denial costs more than the thing being denied. We passed it some time ago and have been paying for the pretence ever since.\n\nWe answer to nobody, which is the only reason this is a decision and not a sentence. Better to be the one who says it."
 society.0202.a:0 "Say it, then."

 # ROOT is the liege; scope:society_suspect is the member being talked about.
 society.0203.t:0 "Something in Our Realm"
 society.0203.desc:0 "It reaches us the way these things do — third-hand, from somebody with no reason to invent it and no evidence worth the name.\n\n[society_suspect.GetTitledFirstName] is spoken of carefully now, by people who were not careful about [society_suspect.GetHerHim] a year ago. Nobody will say what it is they think [society_suspect.GetSheHe] has done.\n\nWe are told. That is all, for the moment."
 society.0203.a:0 "Note it, and watch."

 # --- Exposure: the secret, and what comes for it ----------------------------------------------
 #
 # The end the whole Visibility system has been counting toward. ROOT is the exposed member in
 # 0300 and 0301; in 0302 ROOT is the person who was sold, and they are NOT told by whom.
 #
 # Paragraph breaks here are the two-character escape, not real line breaks. A CK3 loc entry is
 # ONE line: a real newline inside the quotes ends the entry early, and the parser reads the next
 # paragraph as a malformed key -- four warnings per entry, and no prose in game.

 secret_society_membership:0 "Sworn to Something"
 secret_society_membership_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] belongs to a body that meets where it will not be counted, and has done for longer than anyone outside it would guess."
 secret_society_membership_type_desc:0 "Membership of a body that keeps no roll and meets where it will not be counted."
 secret_society_membership_tooltip_desc:0 "Sworn to something that does not put its name to things."

 society_known_member:0 "Known"
 society_known_member_desc:0 "There is nothing left to find out. What remains is what everybody intends to do about it."

 society.0300.t:0 "Out"
 society.0300.desc:0 "It is not a rumour any more, and there is no version of the next year in which it becomes one again.\n\nSomebody has said it plainly, to somebody who wrote it down, and the writing has been read. Every careful year we spent is now a list of things that look worse for having been careful.\n\nWhat is left is not whether they know. It is what we say in the weeks before somebody comes to ask."
 society.0300.a:0 "Deny it. Loudly, and to the wrong people first."
 society.0300.b:0 "Say nothing. Let them build it themselves."

 society.0301.t:0 "They Come to Ask"
 society.0301.desc:0 "Three of them, and only one does the talking. They are not soldiers and they are not clergy, and the distinction stops mattering at about the second question.\n\nThey have our denial written down alongside everything it contradicts. They are not here to establish whether. They are here to be given somebody, and they have the patience of men who usually are."
 society.0301.desc_silent:0 "Three of them, and only one does the talking. They are not soldiers and they are not clergy, and the distinction stops mattering at about the second question.\n\nWe said nothing when it broke, and silence turns out to be a thing that can be quoted. They arrive already certain, ahead of schedule, and with fewer questions than we had prepared answers for."
 society.0301.a:0 "Give them a name that is not ours."
 society.0301.b:0 "Buy the visit short."
 society.0301.c:0 "Give them nothing at all."

 # ROOT is the betrayed member. Deliberately never names who sold them -- see the note on 0302.
 society.0302.t:0 "Our Name, in Someone Else's Mouth"
 society.0302.desc:0 "They arrive knowing things about us that only the sworn could have told them, and they are not shy about how recently they learned it.\n\nSomebody sat where we have sat, was asked what we would have been asked, and answered. We are not told which of them. We will go on standing in rooms with all of them, and we will not know."
 society.0302.a:0 "Then we learn nothing from it except the lesson."

 # --- Visibility on the roster -----------------------------------------------------------------
 #
 # What one member can see of another's exposure. Not a number: the panel prints the player's own
 # visibility to the point because they are entitled to know exactly where they stand, but you
 # learn somebody else's from how people have started talking about them. Three states, matching
 # the two modifiers and their absence.
 #
 # Deliberately short — this sits in a narrow right-hand column under the member's rung, beside a
 # portrait, and anything longer wraps or elides.

 SOCIETY_ROSTER_UNSUSPECTED:0 "unremarked"
 SOCIETY_ROSTER_SUSPECT:0 "spoken of"
 SOCIETY_ROSTER_VERY_SUSPECT:0 "spoken of openly"
